name: Temporary Needs control inspection
on:
  push:
    branches:
      - design/final-visual-polish
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false puppeteer-core
      - name: Inspect small Needs buttons
        run: |
          python3 -m http.server 8000 >/tmp/server.log 2>&1 &
          sleep 2
          node --input-type=module - <<'NODE'
          import puppeteer from 'puppeteer-core';
          const b=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const p=await b.newPage(); await p.setViewport({width:1440,height:1000});
          await p.goto('http://127.0.0.1:8000/ehime_kumamoto_support_geocoded_shelters_20260802.html',{waitUntil:'networkidle2'});
          await p.click('[data-view="needs"]'); await new Promise(r=>setTimeout(r,300));
          const rows=await p.evaluate(()=>[...document.querySelectorAll('#needsView button')].filter(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return s.display!=='none'&&r.width>0&&r.height>0&&r.height<39.5}).slice(0,40).map(el=>({h:el.getBoundingClientRect().height,text:(el.textContent||'').trim(),html:el.outerHTML.slice(0,500),parent:el.parentElement?.className||'',grand:el.parentElement?.parentElement?.className||''})));
          console.log(JSON.stringify(rows,null,2)); await b.close();
          NODE
