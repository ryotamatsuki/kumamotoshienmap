name: One-shot executive summary refresh
on:
  push:
    branches:
      - fix/executive-summary-currentness-20260915
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/executive-summary-currentness-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Build and gate
        run: |
          set -Eeuo pipefail
          npm run build
          git diff --check
          npm run validate:executive-summary
      - name: Commit generated outputs and remove one-shot workflow
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-shot-executive-summary-fix.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'fix: refresh executive decision summary'
          git push origin HEAD:fix/executive-summary-currentness-20260915
