name: Temporary apply full refresh 20260825

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260825-1408
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Apply audited refresh
        run: |
          set -Eeuo pipefail
          mkdir -p operations/audits
          node scripts/tmp-apply-refresh-20260825.mjs
          node scripts/tmp-postpatch-refresh-20260825.mjs
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          npm run build
          npm run test:release-gate
