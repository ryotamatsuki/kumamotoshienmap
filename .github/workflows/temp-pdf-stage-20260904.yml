name: Temporary PDF stage 20260904

on:
  push:
    branches:
      - audit/timepoint-20260904-1509
    paths:
      - '.github/workflows/temp-pdf-stage-20260904.yml'

permissions:
  contents: write

jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[pdf-stage-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260904-1509
          fetch-depth: 0
      - name: Stage official PDFs for visual verification
        run: |
          set -Eeuo pipefail
          curl -fL --retry 3 'https://www.pref.kumamoto.jp/uploaded/life/279299_884808_misc.pdf' -o operations/audits/temp-kumamoto-damage52-20260904.pdf
          curl -fL --retry 3 'https://www.pref.ehime.jp/uploaded/attachment/189500.pdf' -o operations/audits/temp-ehime-support-20260903.pdf
      - name: Commit staged PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operations/audits/temp-kumamoto-damage52-20260904.pdf operations/audits/temp-ehime-support-20260903.pdf
          git commit -m 'chore: stage official PDFs for audit [pdf-stage-result]'
          git push origin HEAD:audit/timepoint-20260904-1509
