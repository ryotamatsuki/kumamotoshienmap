name: Temporary materialize shelter build

on:
  push:
    branches:
      - audit/timepoint-20260828-2213

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260828-2213
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Build and materialize tracked dashboard inputs
        run: npm run build
      - name: Commit generated dashboard shelter snapshot
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ehime_kumamoto_support_geocoded_shelters_20260802.html public/dashboard.html
          if git diff --cached --quiet; then echo 'No generated dashboard changes.'; exit 0; fi
          git commit -m 'data: materialize refreshed shelter snapshot in dashboard'
          git push origin HEAD:audit/timepoint-20260828-2213
