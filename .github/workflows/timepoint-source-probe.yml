name: Timepoint source probe

on:
  push:
    branches:
      - audit/timepoint-20260903-1450

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Probe and validate live current shelters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run update:current-shelters -- --dry-run --candidate-output /tmp/probe/current-shelters-candidate.json
          node scripts/validate-current-shelters.mjs --candidate=/tmp/probe/current-shelters-candidate.json
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('/tmp/probe/current-shelters-candidate.json','utf8'));
          console.log('CURRENT_SHELTER_META='+JSON.stringify(v.meta));
          console.log('CURRENT_SHELTER_COUNT='+v.shelters.length);
          console.log('CURRENT_SHELTER_MUNICIPALITIES='+JSON.stringify([...new Set(v.shelters.map(x=>x.municipality))].sort()));
          NODE

      - name: Probe official current sources
        shell: bash
        run: |
          set -euo pipefail
          echo '=== EHIME SUPPORT PAGE / LATEST PDF ==='
          curl -fLsS 'https://www.pref.ehime.jp/page/154856.html' -o /tmp/probe/ehime.html
          python3 - <<'PY'
          import re, html
          from urllib.parse import urljoin
          text=open('/tmp/probe/ehime.html',encoding='utf-8').read()
          for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', text, re.I|re.S):
              visible=re.sub(r'<[^>]+>','',m.group(2))
              visible=html.unescape(visible).strip()
              if '9月1日12時00分時点' in visible and '熊本地震' in visible:
                  print('EHIME_PDF_URL='+urljoin('https://www.pref.ehime.jp/page/154856.html',m.group(1)))
                  print('EHIME_PDF_TEXT='+visible)
          PY

          echo '=== KUMAMOTO DAMAGE PAGE RECENT LINKS ==='
          curl -fLsS 'https://www.pref.kumamoto.jp/soshiki/222/276831.html' -o /tmp/probe/kumamoto-damage.html
          python3 - <<'PY'
          import re, html
          text=open('/tmp/probe/kumamoto-damage.html',encoding='utf-8').read()
          plain=html.unescape(re.sub(r'<[^>]+>',' ',text))
          plain=re.sub(r'\s+',' ',plain)
          for pat in [r'第\s*5[0-9]\s*報.{0,150}', r'9月\s*[123]日.{0,150}']:
              for x in re.findall(pat,plain): print(x)
          PY

      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: timepoint-source-probe
          path: /tmp/probe
          if-no-files-found: error
