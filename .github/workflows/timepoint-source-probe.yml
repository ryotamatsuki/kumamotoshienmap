          dump(dp,disc)

          dap='sender-audit/discovery-additions.json'; da=load(dap); da['reference_at']=REF; da['checked_at']=REF; da['rechecked_at']=REF
          existing={(r[0],r[1]) for r in da.get('source_mentions',[]) if isinstance(r,list) and len(r)>=2}
          for row in [('徳島県','阿南市','tokushima-housing-wave3-0903'),('徳島県','佐那河内村','tokushima-liaison-wave10-0901'),('徳島県','石井町','tokushima-housing-wave3-0903'),('大分県','竹田市','taketa-cert-wave-0903')]:
              if row[:2] not in existing: da.setdefault('source_mentions',[]).append(list(row)); existing.add(row[:2])
          dump(dap,da)

          # Recompute sender summary from canonical entity files.
