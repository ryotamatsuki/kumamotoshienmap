name: Apply timepoint refresh

on:
  push:
    branches:
      - audit/timepoint-20260903-1450

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Refresh live shelter snapshot
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run update:current-shelters
      - name: Apply audited 2026-09-03 metadata and sender changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          REF='2026-09-03T14:57:25+09:00'
          NEXT='2026-09-04T09:00:00+09:00'
          RELEASE='20260903-1457'
          BASE='cca0eb8fbbcc293d515eb99570ade50b8af660f6'

          def load(p): return json.loads((root/p).read_text(encoding='utf-8'))
          def dump(p,obj): (root/p).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def touch(obj):
              if isinstance(obj,dict):
                  for k,v in list(obj.items()):
                      if k in ('checked_at','rechecked_at'): obj[k]=REF
                      elif k=='next_review_at': obj[k]=NEXT
                      else: touch(v)
              elif isinstance(obj,list):
                  for v in obj: touch(v)

          # Receiver-side and national audits: full recheck timestamp; factual source_as_of/state retained unless new direct evidence below.
          for p in ['municipal-support-audit.json','national-support-audit.json']:
              d=load(p); d['reference_at']=REF; d['checked_at']=REF; d['release_id']=RELEASE; touch(d); dump(p,d)

          manifest=load('sender-municipality-audit.json')
          manifest['reference_at']=REF; manifest['checked_at']=REF; manifest['rechecked_at']=REF; manifest['base_main_sha']=BASE; manifest['release_id']=RELEASE
          entity_files=list(manifest['entity_files'])
          for p in entity_files:
              d=load(p); d['reference_at']=REF; d['checked_at']=REF; d['rechecked_at']=REF; touch(d); dump(p,d)

          # New Tier-1 sources discovered in the 2026-09-03 nationwide sender re-audit.
          sp='sender-audit/sources-additions.json'; s=load(sp); s['reference_at']=REF; s['checked_at']=REF; s['rechecked_at']=REF; touch(s)
          byid={x['source_id']:x for x in s['sources']}
          additions=[
            {'source_id':'tokushima-housing-wave3-0903','publisher':'徳島県','title':'令和8年熊本地震に係る熊本県への「住家被害認定調査チーム(第3陣)」の派遣について','url':'https://www.pref.tokushima.lg.jp/anshin/kinkyu/saigai-info/7316123/','tier':1,'source_as_of':'2026-09-03T00:00:00+09:00','checked_at':REF,'rechecked_at':REF,'note':'県公式が県職員3名、小松島市1名、阿南市1名、石井町1名を9月3日に宇土市へ派遣したと明示。'},
            {'source_id':'tokushima-liaison-wave10-0901','publisher':'徳島県','title':'令和8年熊本地震に係る熊本県への「リエゾン（第10陣）」及び「避難所支援チーム（第9陣）」の派遣について','url':'https://www.pref.tokushima.lg.jp/anshin/kinkyu/saigai-info/7316047/','tier':1,'source_as_of':'2026-09-01T00:00:00+09:00','checked_at':REF,'rechecked_at':REF,'note':'県公式が阿南市1名・佐那河内村1名を含む計8名を9月1日に被災地へ派遣したと明示。派遣期間は9月1日～7日。'},
            {'source_id':'taketa-cert-wave-0903','publisher':'竹田市','title':'令和8年熊本地震の被災地に職員を派遣します（証明発行事務支援）','url':'https://www.city.taketa.oita.jp/kurashi_tetsuzuki/bosai_kyukyu/reiwa8nenkumamotojishin/13115.html','tier':1,'source_as_of':'2026-09-03T00:00:00+09:00','checked_at':REF,'rechecked_at':REF,'note':'市公式が八代市への罹災証明発行事務支援を9月3日～9日に2名派遣すると公表。実出発確認ではないためCURRENTへ推定しない。'}]
          for x in additions: byid[x['source_id']]=x
          s['sources']=list(byid.values()); dump(sp,s)

          # Promote existing Komatsushima adjudication using today's explicit dispatch confirmation.
          updated=False
          for p in entity_files:
              d=load(p)
              rows=d.get('entities',[])
              for e in rows:
                  if e.get('prefecture')=='徳島県' and e.get('entity')=='小松島市':
                      e['state']='CURRENT'; e['support_types']=sorted(set(e.get('support_types',[])+['住家被害認定調査']))
                      e['destinations']=sorted(set(e.get('destinations',[])+['宇土市']))
                      e['source_ids']=list(dict.fromkeys(e.get('source_ids',[])+['tokushima-housing-wave3-0903']))
                      e['sources_checked']=list(dict.fromkeys(e.get('sources_checked',[])+['tokushima-housing-wave3-0903']))
                      e['evidence_note']='徳島県公式が2026年9月3日に小松島市職員1名を含む住家被害認定調査チームを宇土市へ派遣したと明示。'
                      e['current_evidence_type']='actual_dispatch_confirmed'; e['source_as_of']='2026-09-03T00:00:00+09:00'; e['checked_at']=REF; e['rechecked_at']=REF; e['next_review_at']=NEXT
                      e.pop('reason',None); updated=True
              if rows: dump(p,d)
          if not updated: raise SystemExit('existing 小松島市 adjudication not found')

          new_path='sender-audit/timepoint-20260903-additions.json'
          new_entities=[
            {'entity':'阿南市','prefecture':'徳島県','municipality_type':'city','kind':'basic_municipality_sender','required':False,'state':'CURRENT','support_types':['住家被害認定調査','避難所支援'],'destinations':['宇土市'],'source_ids':['tokushima-housing-wave3-0903','tokushima-liaison-wave10-0901'],'evidence_note':'徳島県公式が9月1日の派遣に続き、9月3日にも阿南市職員1名を含む住家被害認定調査チームを実際に派遣したと明示。','checked_at':REF,'rechecked_at':REF,'next_review_at':NEXT,'current_evidence_type':'actual_dispatch_confirmed','source_as_of':'2026-09-03T00:00:00+09:00','sources_checked':['tokushima-housing-wave3-0903','tokushima-liaison-wave10-0901']},
            {'entity':'佐那河内村','prefecture':'徳島県','municipality_type':'village','kind':'basic_municipality_sender','required':False,'state':'CURRENT','support_types':['避難所支援'],'destinations':['宇土市'],'source_ids':['tokushima-liaison-wave10-0901'],'evidence_note':'徳島県公式が佐那河内村職員1名を含む避難所支援チームを9月1日に実際に派遣し、派遣期間を9月1日～7日と明示。','checked_at':REF,'rechecked_at':REF,'next_review_at':NEXT,'current_evidence_type':'actual_dispatch_confirmed','source_as_of':'2026-09-01T00:00:00+09:00','sources_checked':['tokushima-liaison-wave10-0901']},
            {'entity':'石井町','prefecture':'徳島県','municipality_type':'town','kind':'basic_municipality_sender','required':False,'state':'CURRENT','support_types':['住家被害認定調査'],'destinations':['宇土市'],'source_ids':['tokushima-housing-wave3-0903'],'evidence_note':'徳島県公式が2026年9月3日に石井町職員1名を含む住家被害認定調査チームを宇土市へ派遣したと明示。','checked_at':REF,'rechecked_at':REF,'next_review_at':NEXT,'current_evidence_type':'actual_dispatch_confirmed','source_as_of':'2026-09-03T00:00:00+09:00','sources_checked':['tokushima-housing-wave3-0903']},
            {'entity':'竹田市','prefecture':'大分県','municipality_type':'city','kind':'basic_municipality_sender','required':False,'state':'PLANNED','support_types':['罹災証明発行事務支援'],'destinations':['八代市'],'source_ids':['taketa-cert-wave-0903'],'evidence_note':'竹田市公式が9月3日～9日に八代市へ2名を派遣すると公表。基準時点で実出発・実活動を直接確認できないため予定期間開始のみでCURRENTへ昇格しない。','checked_at':REF,'rechecked_at':REF,'next_review_at':NEXT,'reason':'「派遣します」という予定公表であり、実出発・実活動の直接根拠ではないためPLANNED。','source_as_of':'2026-09-03T00:00:00+09:00','sources_checked':['taketa-cert-wave-0903']}
          ]
          dump(new_path,{'region':'timepoint-20260903-additions','reference_at':REF,'entities':new_entities,'checked_at':REF,'rechecked_at':REF})
          if new_path not in manifest['entity_files']: manifest['entity_files'].append(new_path)

          # 47-prefecture discovery refresh and new discovered candidates.
          dp='sender-audit/discovery.json'; disc=load(dp); disc['reference_at']=REF; disc['checked_at']=REF; disc['rechecked_at']=REF
          for row in disc['prefecture_discovery']:
