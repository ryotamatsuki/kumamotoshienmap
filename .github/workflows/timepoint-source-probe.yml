          states={k:0 for k in ['CURRENT','PLANNED','HISTORICAL','UNKNOWN','NO_EVIDENCE','CONFLICT']}
          for e in rows: states[e['state']]=states.get(e['state'],0)+1
          eh=[e for e in rows if e.get('prefecture')=='愛媛県' and e.get('required') is True]
          ehstates={k:0 for k in states}
          for e in eh: ehstates[e['state']]=ehstates.get(e['state'],0)+1
          manifest['summary']['ehime'].update({'required_count':20,'adjudicated_count':20,'missing_required':[],'unadjudicated_source_mentions':[],'blocking_unresolved':0,'states':ehstates,'blocking_conflicts':0})
          mention_count=len(manifest.get('source_mentions',[]))+len(da.get('source_mentions',[]))
          manifest['summary']['nationwide'].update({'prefecture_discovery_checked':47,'discovered_basic_municipality_senders':len(rows),'adjudicated_basic_municipality_senders':len(rows),'unadjudicated_discovered_senders':[],'source_mentions':mention_count,'orphan_source_mentions':[],'invalid_current':[],'blocking_conflicts':0,'states':states})
          manifest['blocking_unresolved']=[]
          manifest['timepoint_note']='2026年9月3日14:57基準。愛媛20市町と全国47都道府県discoveryを再監査。徳島県9月3日一次情報で小松島市・阿南市・石井町の実派遣をCURRENT、9月1日実派遣が継続期間内の佐那河内村をCURRENT追加。竹田市は「派遣します」の予定公表のみのためPLANNED。予定期間到来だけではCURRENTにしない。'
          dump('sender-municipality-audit.json',manifest)

          # Sender audit helper's generated review time must remain future relative to this refresh.
          p=root/'scripts/sender-coverage-lib.mjs'; txt=p.read_text(encoding='utf-8'); txt=txt.replace('const NEXT_REVIEW_AT = "2026-09-03T09:00:00+09:00";','const NEXT_REVIEW_AT = "2026-09-04T09:00:00+09:00";'); p.write_text(txt,encoding='utf-8')

          # Canonical PAGE_RECHECK_META. Volunteer sub-snapshot stays on its independently verified 9/2 timestamp.
          hp=root/'ehime_kumamoto_support_geocoded_shelters_20260802.html'; html=hp.read_text(encoding='utf-8')
          m=re.search(r'const PAGE_RECHECK_META=(\{[^\n]*\});',html)
          if not m: raise SystemExit('PAGE_RECHECK_META not found')
          meta=json.loads(m.group(1)); meta['checkedAt']=REF
          for row in meta.get('rows',[]):
              sec=row.get('section')
              if sec=='被害・支援':
                  row.update(status='再確認',current='9月3日14:57再確認：熊本県最新県報は9月2日14時の第51報',previous='9月2日14時の第51報',difference='9月3日再確認で県報は第51報が最新。避難者2,035人、避難所38か所、人的被害404人、住家被害61,996棟を維持。現在避難所は公式ライブJSONを別定義で更新。')
              elif sec=='愛媛県支援':
                  row.update(status='差分あり',current='9月3日再確認：県総括の最新掲載は9月1日12時版',previous='8月28日12時資料',difference='愛媛県公式ページで9月1日12時版の県総括掲載を確認。個別senderは9月3日基準で別監査。')
              elif sec=='避難所':
                  row.update(status='再確認',current='熊本県第51報：38か所・避難者2,035人／公式JSON現在40施設／位置履歴206点',previous='熊本県第51報38か所／公式JSON 9月2日取得40施設',difference='県報は第51報を維持。公式ライブJSONは9月3日14:51更新で現在40施設、座標40/40 confirmed。県報38か所とは時点・定義を分離。')
              elif sec=='支援ニーズ見通し':
                  row.update(status='再確認',current='県全体最新は熊本県第51報を維持。市町別内訳は旧スナップショットとして分離',difference='9月3日再確認でも県全体の最新県報は第51報。市町別旧内訳を最新県計へ機械的に再配分しない。')
              elif sec=='発災後タイムライン':
                  row.update(status='差分あり',current='9月3日の徳島県・竹田市sender情報を追加。熊本県被害県報は第51報を維持',difference='9月3日実派遣・派遣予定のsender情報を追加し、CURRENT/PLANNEDを直接根拠に沿って区別。')
              elif sec=='支援ダッシュボード':
                  row.update(status='差分あり',current='熊本県第51報を維持／他自治体支援・全国senderは9月3日14:57全件再監査',difference='被害・避難は第51報を維持。全国senderは徳島県・竹田市の新規一次情報を反映し、予定のみはCURRENTにしない。')
              elif sec=='災害ボランティア':
                  row.update(status='再確認',current='9月3日サイト全体再確認。ボランティア個別監査は9月2日確認値を維持',difference='ボランティア実績・募集条件は独立スナップショットとして9月2日確認値を維持し、未確認の9月3日値を推測で補完しない。')
              elif sec=='地図・境界':
                  row.update(status='再確認',current='公式JSON現在40施設・40/40公式座標 confirmed',difference='9月3日14:51更新のライブ避難所JSONを再取得。件数40は不変、conflict 0・unresolved 0。')
              elif sec=='他自治体等':
                  row.update(status='差分あり',current='9月3日14:57に対口支援・他自治体支援を全件再監査',difference='既存割当履歴と現況を分離したまま、全国sender新規一次情報を追加し全件再裁定。')
          html=html[:m.start(1)]+json.dumps(meta,ensure_ascii=False,separators=(',',':'))+html[m.end(1):]
          # Release asset query id in canonical HTML.
          html=re.sub(r'volunteer-data\.js\?v=[A-Za-z0-9._-]+',f'volunteer-data.js?v={RELEASE}',html)
          hp.write_text(html,encoding='utf-8')

          # Keep validators that pin the current asset release id synchronized, without rewriting historical ledgers.
          for pp in [root/'scripts/validate-current-state-audit.mjs',root/'scripts/validate-built-site.mjs']:
              t=pp.read_text(encoding='utf-8'); t=re.sub(r'volunteer-data\.js\?v=[A-Za-z0-9._-]+',f'volunteer-data.js?v={RELEASE}',t); pp.write_text(t,encoding='utf-8')

          # Build ledger from previous canonical values plus this refresh's exact classifications.
          shelter=load('current-shelters.json')
          ledger={
            'schema_version':2,'repository':'ryotamatsuki/kumamotoshienmap','update_type':'timepoint_refresh','gate_phase':'pre_merge','update_id':'refresh-20260903-1457','release_id':RELEASE,'reference_at':REF,'rechecked_at':REF,'page_checked_at':None,'base_main_sha':BASE,'expected_changed_files':[],
            'sources':[
              {'source_id':'kumamoto-damage51-0902','publisher':'熊本県','url':'https://www.pref.kumamoto.jp/soshiki/222/276831.html','source_as_of':'2026-09-02T14:00:00+09:00','checked_at':REF},
              {'source_id':'kumamoto-current-shelters-0903','publisher':'熊本県 防災情報ポータル','url':'https://portal.bousai.pref.kumamoto.jp/data/shelter/shelter.json','source_as_of':shelter['meta']['source_last_modified'],'checked_at':REF},
              {'source_id':'kumamoto-volunteer-activity-0902','publisher':'熊本県社会福祉協議会','url':'https://www.fukushi-kumamoto.or.jp/files/libs/8662/202609021133091423.pdf','source_as_of':'2026-09-02','checked_at':'2026-09-02T16:35:00+09:00'},
              {'source_id':'ehime-support-0901','publisher':'愛媛県','url':'https://www.pref.ehime.jp/page/154856.html','source_as_of':'2026-09-01T12:00:00+09:00','checked_at':REF},
              {'source_id':'mlit-report51-0831','publisher':'国土交通省','url':'https://www.mlit.go.jp/saigai/saigai_260728.html','source_as_of':'2026-08-31T17:00:00+09:00','checked_at':REF},
              {'source_id':'mod-hakuo2-0901-reservation','publisher':'防衛省・自衛隊','url':'https://www.mod.go.jp/j/approach/defense/saigai/index.html','source_as_of':'2026-09-01T09:00:00+09:00','checked_at':REF},
              {'source_id':'tokushima-housing-wave3-0903','publisher':'徳島県','url':'https://www.pref.tokushima.lg.jp/anshin/kinkyu/saigai-info/7316123/','source_as_of':'2026-09-03','checked_at':REF},
              {'source_id':'tokushima-liaison-wave10-0901','publisher':'徳島県','url':'https://www.pref.tokushima.lg.jp/anshin/kinkyu/saigai-info/7316047/','source_as_of':'2026-09-01','checked_at':REF},
              {'source_id':'taketa-cert-wave-0903','publisher':'竹田市','url':'https://www.city.taketa.oita.jp/kurashi_tetsuzuki/bosai_kyukyu/reiwa8nenkumamotojishin/13115.html','source_as_of':'2026-09-03','checked_at':REF}
            ],
            'coverage':{'recipient_municipalities':45,'institution_missing':0,'institution_orphan_source_mentions':0,'current_shelters':len(shelter['shelters']),'current_shelter_coordinates_confirmed':sum(1 for x in shelter['shelters'] if x.get('coordinate_status')=='confirmed'),'current_shelter_unresolved':sum(1 for x in shelter['shelters'] if x.get('coordinate_status')=='unresolved'),'ehime_required':20,'ehime_adjudicated':20,'ehime_missing':0,'prefecture_discovery_checked':47,'sender_entities_discovered':len(rows),'sender_entities_adjudicated':len(rows),'sender_orphan_source_mentions':0,'sender_blocking_conflicts':0,'sender_states':states,'municipal_support':'audited','national_support':'audited','current_count':len(shelter['shelters']),'unresolved_count':0,'conflict_count':0},
            'snapshots':{'page_reference_at':REF,'damage_source_as_of':'2026-09-02T14:00:00+09:00','damage_report':51,'current_shelters':len(shelter['shelters']),'shelter_source_last_modified':shelter['meta']['source_last_modified'],'sender_reference_at':REF,'volunteer_activity_0902':{'participants':108,'new_requests':60,'activities':24,'completed':24}},
