name: One-shot update-flow v2.8 hardening
on:
  push:
    branches: [fix/update-flow-currentness-coverage-20260915]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/update-flow-currentness-coverage-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Patch workflow contract and source selection
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'{label}: target not found')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Needs sync/validator must follow the latest audit file, never a date-hardcoded filename.
          for path in ['scripts/sync-needs-kpis.mjs','scripts/validate-needs-kpis.mjs']:
              p=Path(path); s=p.read_text(encoding='utf-8')
              if "readdir" not in s.split('\n',1)[0]:
                  s=s.replace("import { readFile, writeFile } from 'node:fs/promises';", "import { readFile, readdir, writeFile } from 'node:fs/promises';")
                  s=s.replace("import { readFile } from 'node:fs/promises';", "import { readFile, readdir } from 'node:fs/promises';")
              old="const auditPath=resolve(root,'operations/audits/needs-kpi-source-recheck-20260915-1942.json');"
              new="const auditNames=(await readdir(resolve(root,'operations','audits'))).filter(name=>/^needs-kpi-source-recheck-\\d{8}-\\d{4}\\.json$/u.test(name)).sort();\nconst latestNeedsAudit=auditNames.at(-1);\nif(!latestNeedsAudit)throw new Error('latest needs KPI audit missing');\nconst auditPath=resolve(root,'operations','audits',latestNeedsAudit);"
              if old in s:
                  s=s.replace(old,new,1)
              elif 'latestNeedsAudit' not in s:
                  raise SystemExit(f'{path}: auditPath target not found')
              p.write_text(s,encoding='utf-8')

          # Operational playbook v2.8.
          p=Path('時点修正更新オペレーション.md'); s=p.read_text(encoding='utf-8')
          if 'Version 2.8（2026-09-15改訂）' not in s:
              header='# 時点修正更新オペレーション\n\n'
              v28='''> Version 2.8（2026-09-15改訂）\n>\n> Version 2.7までの全Gateを維持したうえで、**Current Surface Coverage Gate**、**Source Link Closure Gate**、**Production Completion Gate**を追加する。一次情報・内部監査データだけ更新され、Needs KPIや知事・幹部向けサマリー等の派生表示が旧時点のまま残る更新を禁止する。\n>\n> 「merge済み」と「公開完了」を分離する。GitHub Pagesのbuild/deployおよびDesktop/Mobile post-deploy smokeがsuccessになるまでは `MERGED_PENDING_DEPLOY` であり、完了報告してはならない。\n>\n'''
              if not s.startswith(header): raise SystemExit('operation header mismatch')
              s=header+v28+s[len(header):]
          if '### 6.1 Current surface / source-link coverage（Version 2.8）' not in s:
              marker='## 7. Institution Coverage / Source Mention Closure'
              block='''### 6.1 Current surface / source-link coverage（Version 2.8）\n\n時点修正のledgerには、数値の取得元だけでなく「どの表示面まで同期したか」を明記する。最低限、`coverage.current_surface_sync` に `overview`、`executive_summary`、`needs_kpis`、`page_recheck_meta`、`timeline`、`dashboard`、`map` を持たせ、全て `synced` とする。\n\n`coverage.source_link_closure` では、現在値として表示するKPI/カードについて、一次情報URLを持つべきカード数、リンク欠落数、公式一次情報限定かを記録する。現在値カードに根拠リンクが必要なのにhrefがない状態はblockingとする。\n\n`coverage.production_verification` では、Pages deploy、Desktop smoke、Mobile smokeを必須とし、smoke前の完了宣言を禁止する。\n\n'''
              if marker not in s: raise SystemExit('operation section 7 marker missing')
              s=s.replace(marker,block+marker,1)
          if '### 16.2 Current Surface Coverage / Source Link Closure Gate（Version 2.8追加）' not in s:
              marker='## 17. Sender Gate自己破壊テスト'
              block='''### 16.2 Current Surface Coverage / Source Link Closure Gate（Version 2.8追加）\n\n時点修正では、一次情報→監査JSON→全派生表示→根拠リンク→実配信の5層を一続きの更新単位として扱う。データ層だけ更新して表示層を残すこと、又は表示値だけ更新して根拠リンクを残すことを禁止する。\n\ncanonical currentness sourceは、`operations/audits/needs-kpi-source-recheck-*.json` のうち最新ファイルとする。sync/validatorで特定日付の監査ファイル名をhard-codeしてはならない。\n\nHard Gate対象：\n\n- 支援ニーズ見通し4KPI（値、注記、href、publisher、`target`/`rel`）\n- 知事・幹部向け意思決定サマリー（避難者、人的被害、住家被害、現行避難所JSON、主要数値時点）\n- `PAGE_RECHECK_META` の全主要row\n- 発災後タイムラインのcurrent snapshot\n- `PROVINCE_NEEDS` / 支援ダッシュボード / Map等のcurrent snapshot\n- 現行避難所JSONの別定義表示\n- source / public / dist parity\n\n`npm run validate:currentness-surfaces` は最新監査JSONから期待値を動的に導出し、旧数値・旧時点・リンク欠落・runtime overlay不一致のいずれかがあればFAILする。`npm run test:currentness-surfaces` は少なくとも、旧KPI値、href欠落、幹部サマリー旧値、`PAGE_RECHECK_META`旧時点、runtime overlay旧値を故障注入し、全てFAILすることを確認する。\n\n`npm run build` はこの横断Gateを必ず含める。個別validatorがPASSしても横断GateがFAILならmerge不可。\n\n'''
              if marker not in s: raise SystemExit('operation section 17 marker missing')
              s=s.replace(marker,block+marker,1)
          if '### 20.0 Production Completion Gate（Version 2.8追加）' not in s:
              marker='### 20.1 配信一致'
              block='''### 20.0 Production Completion Gate（Version 2.8追加）\n\n状態を次の3段階で管理する。\n\n- `PR_VALIDATED`: PR CIがgreen。未merge。\n- `MERGED_PENDING_DEPLOY`: mainへmerge済みだが、Pages deploy又はpost-deploy smokeが未完了。\n- `DEPLOYED_VERIFIED`: Pages build/deploy、配信byte一致、currentness/source-link static smoke、Desktop/Mobile runtime smokeが全てsuccess。\n\n「完了」「公開反映済み」「完全終了」と報告できるのは `DEPLOYED_VERIFIED` のみ。`MERGED_PENDING_DEPLOY` では、merge済みであることと未完了の検証を明示し、完了扱いしない。\n\npost-deploy smokeは、4つのNeeds KPIが実配信HTMLで `<a>` として存在し、最新監査JSONの一次情報URLへ一致していること、知事・幹部向けサマリーが同じcanonical snapshotを表示していることも検証する。\n\n'''
              if marker not in s: raise SystemExit('operation 20.1 marker missing')
              s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')

          # Post-deploy must verify the deployed KPI values AND href closure, not only byte parity/runtime errors.
          p=Path('.github/workflows/post-deploy-pages-smoke.yml'); s=p.read_text(encoding='utf-8')
          if 'Verify deployed currentness and source-link closure' not in s:
              marker='      - name: Install browser driver\n'
              step='''      - name: Verify deployed currentness and source-link closure\n        shell: bash\n        run: |\n          set -Eeuo pipefail\n          node --input-type=module - <<'NODE'\n          import { readFileSync, readdirSync } from 'node:fs';\n          const auditName=readdirSync('operations/audits').filter(name=>/^needs-kpi-source-recheck-\\d{8}-\\d{4}\\.json$/u.test(name)).sort().at(-1);\n          if(!auditName) throw new Error('latest needs currentness audit missing');\n          const audit=JSON.parse(readFileSync(`operations/audits/${auditName}`,'utf8'));\n          const shelters=JSON.parse(readFileSync('current-shelters.json','utf8'));\n          const html=readFileSync('/tmp/deployed-dashboard.html','utf8');\n          const snapshot=audit.prefectural_snapshot;\n          const sources=new Map(audit.sources.map(s=>[s.source_id,s]));\n          const expected=new Map([\n            ['evacuees',sources.get(snapshot.source_id)?.url],\n            ['housing',sources.get(snapshot.source_id)?.url],\n            ['water',sources.get(audit.water.source_id)?.url],\n            ['waste',sources.get(audit.waste.source_id)?.url],\n          ]);\n          const start=html.indexOf('<div class="needs-kpis">'), end=html.indexOf('<div class="needs-phasebar"',start);\n          if(start<0||end<0) throw new Error('deployed needs KPI block missing');\n          const block=html.slice(start,end);\n          const tags=[...block.matchAll(/<a class="needs-kpi"[^>]*data-needs-kpi="([^"]+)"[^>]*href="([^"]+)"[^>]*>/gu)];\n          if(tags.length!==4) throw new Error(`deployed needs KPI links must be 4, got ${tags.length}`);\n          for(const match of tags){\n            if(expected.get(match[1])!==match[2]) throw new Error(`deployed KPI href mismatch: ${match[1]} ${match[2]}`);\n            if(!/target="_blank"/u.test(match[0])||!/rel="[^"]*noopener/u.test(match[0])) throw new Error(`deployed KPI link safety attrs missing: ${match[1]}`);\n          }\n          const n=v=>Number(v).toLocaleString('ja-JP');\n          for(const value of [`${n(snapshot.evacuees)}人`,`${n(snapshot.housing_damage)}棟`,audit.water.display_value,audit.waste.display_value]) if(!block.includes(value)) throw new Error(`deployed needs KPI value missing: ${value}`);\n          const es=html.indexOf('<div aria-labelledby="overviewViewTab"'), ee=html.indexOf('<div aria-labelledby="needsViewTab"',es);\n          if(es<0||ee<0) throw new Error('deployed executive summary missing');\n          const executive=html.slice(es,ee);\n          for(const value of [`${n(snapshot.evacuees)}<span class="overview-kpi-unit">人</span>`,`${n(snapshot.human_damage)}<span class="overview-kpi-unit">人</span>`,`${n(snapshot.housing_damage)}<span class="overview-kpi-unit">棟</span>`,`${shelters.meta.current_count}<span class="overview-kpi-unit">か所</span>`]) if(!executive.includes(value)) throw new Error(`deployed executive value missing: ${value}`);\n          console.log(JSON.stringify({status:'PASS',audit:auditName,needsLinks:tags.length,evacuees:snapshot.evacuees,humanDamage:snapshot.human_damage,housingDamage:snapshot.housing_damage,currentShelters:shelters.meta.current_count}));\n          NODE\n\n'''
              if marker not in s: raise SystemExit('post-deploy install marker missing')
              s=s.replace(marker,step+marker,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build and run hard gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
          npm run validate:currentness-surfaces
          npm run test:currentness-surfaces
          npm run test:release-gate
          git diff --check

      - name: Commit hardened flow and remove one-shot workflow
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-shot-update-flow-v28.yml
          git add -A
          git commit -m 'feat: harden timepoint update currentness flow'
          git push origin HEAD:fix/update-flow-currentness-coverage-20260915
