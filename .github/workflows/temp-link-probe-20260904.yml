name: Temporary link probe 20260904

on:
  push:
    branches:
      - audit/timepoint-20260904-1509
    paths:
      - 'scripts/temp-link-probe-20260904.mjs'
      - '.github/workflows/temp-link-probe-20260904.yml'

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[link-probe-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260904-1509
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: node scripts/temp-link-probe-20260904.mjs
      - name: Commit link report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operations/audits/temp-link-probe-20260904.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: capture 2026-09-04 source links [link-probe-result]'
          git push origin HEAD:audit/timepoint-20260904-1509
