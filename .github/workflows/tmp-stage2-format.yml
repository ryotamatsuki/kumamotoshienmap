name: Temporary Stage2 CSS EOF formatter

on:
  push:
    branches:
      - design/major-screen-restructure

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/major-screen-restructure
          fetch-depth: 0
      - name: Normalize CSS EOF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('volunteer.css')
          s=p.read_text(encoding='utf-8')
          p.write_text(s.rstrip('\n')+'\n',encoding='utf-8')
          PY
      - name: Commit if needed
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- volunteer.css; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volunteer.css
          git commit -m "style: normalize css eof"
          git push origin HEAD:design/major-screen-restructure
