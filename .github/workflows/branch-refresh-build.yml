name: Branch refresh build
on:
  push:
    branches:
      - refresh/20260925-1611
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Build and validate
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
      - name: Commit generated canonical outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ehime_kumamoto_support_geocoded_shelters_20260802.html public/dashboard.html volunteer-data.js
          if ! git diff --cached --quiet; then
            git commit -m "build: sync generated Sep 25 dashboard"
            git push
          fi
