name: Inspect sync constants
on:
  push:
    branches: [audit/timepoint-20260915-0028]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: audit/timepoint-20260915-0028}
      - name: Inspect
        run: |
          python3 - <<'PY'
          import re
          s=open('scripts/sync-current-release.mjs',encoding='utf-8').read()
          print('SETC',sorted(set(re.findall(r"setc\('([^']+)'",s))))
          print('JC',sorted(set(re.findall(r"jc\('([^']+)'",s))))
          print('JSON WRITES',re.findall(r"writeFile\(resolve\(root,'([^']+)'",s))
          for k in ['PAGE_RECHECK_META','AUDIT_SNAPSHOTS','CURRENT','currentSnapshot20260821','releaseId','municipal-support-audit.json','national-support-audit.json']:
            print(k, s.find(k))
          print('TAIL',s[-6000:])
          PY
      - name: Cleanup
        if: always()
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/inspect-sync-constants.yml; git add -A
          if ! git diff --cached --quiet; then git commit -m 'chore: remove sync constant inspector' && git push origin HEAD:audit/timepoint-20260915-0028; fi
