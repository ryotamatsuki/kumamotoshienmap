name: Ledger gate 20260915
on:
  push:
    branches:
      - audit/timepoint-20260915-0028
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260915-0028
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Rebuild and verify deterministic outputs
        run: |
          set -Eeuo pipefail
          npm run build
          git diff --exit-code
      - name: Validate release ledger against main diff
        run: |
          set -Eeuo pipefail
          npm run validate:release -- --ledger=operations/ledgers/refresh-20260915-0105.json --base=e4379d4053ed23838597d0a6b15b83c78aa74e8f --head=HEAD^
          npm run test:release-gate
      - name: Remove one-shot workflow
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ledger-gate-20260915.yml
          git add -A
          git commit -m 'chore: remove 2026-09-15 ledger gate'
          git push origin HEAD:audit/timepoint-20260915-0028
