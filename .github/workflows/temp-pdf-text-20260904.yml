name: Temporary PDF text probe 20260904

on:
  push:
    branches:
      - audit/timepoint-20260904-1509
    paths:
      - '.github/workflows/temp-pdf-text-20260904.yml'

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[pdf-text-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260904-1509
          fetch-depth: 0
      - name: Install PDF text tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Extract staged PDF text
        run: |
          set -Eeuo pipefail
          pdftotext -layout operations/audits/temp-kumamoto-damage52-20260904.pdf /tmp/damage52.txt
          pdftotext -layout operations/audits/temp-ehime-support-20260903.pdf /tmp/ehime.txt
          {
            echo '=== KUMAMOTO DAMAGE52 ==='
            cat /tmp/damage52.txt
            echo
            echo '=== EHIME SUPPORT 20260903 ==='
            cat /tmp/ehime.txt
          } > operations/audits/temp-pdf-text-20260904.txt
      - name: Commit text probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operations/audits/temp-pdf-text-20260904.txt
          git commit -m 'chore: capture PDF text for audit [pdf-text-result]'
          git push origin HEAD:audit/timepoint-20260904-1509
