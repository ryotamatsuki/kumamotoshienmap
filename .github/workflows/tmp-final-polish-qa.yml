name: Temporary final visual polish QA
on:
  push:
    branches:
      - design/final-visual-polish
permissions:
  contents: read
jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install browser tooling
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false puppeteer-core
      - name: Run browser hard gates
        run: |
          set -euo pipefail
          sed -i 's/const optionalHeightOkay=v=>v===null||v>=target;/const optionalHeightOkay=v=>v===null||v===0||v>=target;/' tmp-final-polish-qa.mjs
          python3 -m http.server 8000 >/tmp/final-polish-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tmp-final-polish-qa.mjs
