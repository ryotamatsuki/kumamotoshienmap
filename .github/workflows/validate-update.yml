name: Validate timepoint update

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ledger_path:
        description: "Optional ledger path; normally auto-detected from operations/ledgers/"
        required: false
        default: ""
        type: string
      base_sha:
        description: "Base commit for changed-file validation; blank uses origin/main"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: validate-timepoint-update-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the PR or selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: false

      - name: Resolve validation base and ledger
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          INPUT_BASE_SHA: ${{ inputs.base_sha || '' }}
          INPUT_LEDGER_PATH: ${{ inputs.ledger_path || '' }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
          else
            base_ref="$INPUT_BASE_SHA"
            if [[ -z "$base_ref" ]]; then
              git fetch --no-tags origin main --prune
              base_ref="origin/main"
            fi
          fi
          if [[ -z "$base_ref" ]]; then
            echo "::error title=Release Gate context missing::Could not resolve the base commit."
            exit 1
          fi
          if ! base_sha="$(git rev-parse --verify "${base_ref}^{commit}")"; then
            echo "::error title=Invalid Release Gate base::Unable to resolve base commit: ${base_ref}"
            exit 1
          fi

          ledger_path="${INPUT_LEDGER_PATH:-}"
          if [[ -z "$ledger_path" ]]; then
            mapfile -t ledger_candidates < <(
              git diff --name-only "${base_sha}...HEAD" \
                | grep -E '^(UPDATE_LEDGER\.json|operations/ledgers/refresh-[0-9]{8}-[0-9]{4}\.json)$' \
                || true
            )
            if (( ${#ledger_candidates[@]} > 1 )); then
              echo "::error title=Multiple ledgers::Exactly one update ledger may change per PR: ${ledger_candidates[*]}"
              exit 1
            elif (( ${#ledger_candidates[@]} == 1 )); then
              ledger_path="${ledger_candidates[0]}"
            fi
          fi

          if [[ -n "$ledger_path" && ! "$ledger_path" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error title=Invalid ledger path::Unsupported characters: ${ledger_path}"
            exit 1
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "ledger_path=$ledger_path" >> "$GITHUB_OUTPUT"
          {
            echo "### Release Gate context"
            echo "- Base commit: $base_sha"
            echo "- Head commit: $(git rev-parse HEAD)"
            if [[ -n "$ledger_path" ]]; then
              echo "- Ledger path: $ledger_path"
            else
              echo "- Ledger path: (none; required automatically if sensitive timepoint data changes)"
            fi
            echo "- Sender audit manifest: sender-municipality-audit.json"
            echo "- Live official JSON fetch: not used"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install npm metadata without assuming a lockfile
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build from repository fixtures and current files
        run: |
          set -Eeuo pipefail
          npm run build

      - name: Ensure build did not rewrite tracked inputs
        run: |
          set -Eeuo pipefail
          if ! git diff --quiet; then
            echo "::error title=Non-reproducible build::npm run build modified tracked files."
            git status --short
            git diff --stat
            exit 1
          fi
          if ! git diff --cached --quiet; then
            echo "::error title=Unexpected staged files::The CI checkout contains staged changes after the build."
            git diff --cached --name-status
            exit 1
          fi
          untracked_files="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked_files" ]]; then
            echo "::error title=Untracked files present::The checkout contains files outside the reviewed diff:"
            printf '%s\n' "$untracked_files"
            exit 1
          fi

      - name: Check JavaScript syntax
        run: |
          set -Eeuo pipefail
          node --check volunteer.js
          node --check volunteer-data.js
          node --check scripts/build-sites.mjs
          node --check scripts/validate-update-release.mjs
          node --check scripts/test-release-gate.mjs
          node --check scripts/sync-national-support-audit.mjs
          node --check scripts/validate-national-support-audit.mjs
          node --check scripts/sender-coverage-lib.mjs
          node --check scripts/validate-sender-coverage.mjs
          node --check scripts/test-sender-coverage-gates.mjs
          node --check scripts/validate-release-with-sender.mjs
          node --check scripts/sync-sender-dist.mjs
          node --check scripts/validate-sender-dist.mjs

      - name: Run sender coverage hard gates explicitly
        run: |
          set -Eeuo pipefail
          npm run validate:ehime-sender-coverage
          npm run validate:nationwide-sender-coverage
          npm run validate:sender-source-mentions
          npm run validate:sender-coverage
          npm run validate:sender-dist

      - name: Run Release Gate self-tests
        run: |
          set -Eeuo pipefail
          npm run test:release-gate

      - name: Check committed and working-tree diffs
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
        run: |
          set -Eeuo pipefail
          git diff --check
          git diff --check "${BASE_SHA}...HEAD"

      - name: Run the timepoint and sender Release Gates
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          LEDGER_PATH: ${{ steps.context.outputs.ledger_path }}
        run: |
          set -Eeuo pipefail
          validator_args=("--base=${BASE_SHA}" "--require-ledger-if-data-change")
          if [[ -n "$LEDGER_PATH" ]]; then
            if [[ ! -f "$LEDGER_PATH" ]]; then
              echo "::error file=${LEDGER_PATH},title=UPDATE_LEDGER missing::Selected ledger does not exist."
              exit 1
            fi
            validator_args+=("--ledger=${LEDGER_PATH}")
          fi
          npm run validate:release -- "${validator_args[@]}"

      - name: Final release-gate status
        if: ${{ success() }}
        run: |
          set -Eeuo pipefail
          echo "Release Gate passed: existing v2.5 gates, Ehime 20/20 sender gate, nationwide 47-prefecture discovery gate, source-mention closure, build, self-tests, syntax checks and diff checks all succeeded."
