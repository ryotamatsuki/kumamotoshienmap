name: Temporary self-deleting final v2.5 gate

on:
  push:
    branches:
      - audit/timepoint-20260825-1408
    paths:
      - .github/workflows/tmp-self-delete-final-gate-20260825.yml

permissions:
  contents: write

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260825-1408
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Remove this helper and synchronize final ledger
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-self-delete-final-gate-20260825.yml
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const p='operations/ledgers/refresh-20260825-1408.json';
          const ledger=JSON.parse(fs.readFileSync(p,'utf8'));
          const files=cp.execSync('git diff --name-only origin/main',{encoding:'utf8'}).trim().split(/\n/).filter(Boolean).sort();
          ledger.expected_changed_files=[...new Set(files)];
          fs.writeFileSync(p,JSON.stringify(ledger,null,2)+'\n');
          console.log(JSON.stringify({expectedChangedFiles:ledger.expected_changed_files.length,files:ledger.expected_changed_files}));
          NODE
          git add operations/ledgers/refresh-20260825-1408.json
          git commit -m 'chore: finalize v2.5 release ledger and remove helpers'
      - name: Build exact final candidate
        run: |
          set -Eeuo pipefail
          npm run build
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo '::error title=Non-reproducible final candidate::Build changed the committed final candidate.'
            exit 1
          fi
      - name: Release Gate on exact final HEAD
        run: |
          set -Eeuo pipefail
          npm run test:release-gate
          npm run validate:release -- --base=origin/main --ledger=operations/ledgers/refresh-20260825-1408.json --require-ledger-if-data-change
      - name: Push exact validated final HEAD
        run: |
          set -Eeuo pipefail
          git push origin HEAD:audit/timepoint-20260825-1408
