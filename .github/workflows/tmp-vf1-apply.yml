name: Temporary VF1 applicator

on:
  push:
    branches:
      - design/visual-foundation-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/visual-foundation-v1
          fetch-depth: 0
      - name: Apply visual foundation override
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -q 'VF1_VISUAL_FOUNDATION_START' volunteer.css; then
            echo 'Visual foundation already applied.'
            exit 0
          fi
          printf '\n' >> volunteer.css
          cat scripts/tmp-vf1-overrides.css >> volunteer.css
          git add volunteer.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'design: apply dashboard visual foundation'
          git push origin HEAD:design/visual-foundation-v1
