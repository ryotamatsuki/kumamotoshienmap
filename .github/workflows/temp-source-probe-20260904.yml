name: Temporary source probe 20260904

on:
  push:
    branches:
      - audit/timepoint-20260904-1509
    paths:
      - 'scripts/temp-source-probe-20260904.mjs'
      - '.github/workflows/temp-source-probe-20260904.yml'

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[probe-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260904-1509
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Generate and validate current shelter candidate
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run update:current-shelters -- --dry-run --candidate-output /tmp/current-shelters-candidate.json
          node scripts/validate-current-shelters.mjs --candidate=/tmp/current-shelters-candidate.json
      - name: Probe primary sources
        run: node scripts/temp-source-probe-20260904.mjs
      - name: Commit probe report
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operations/audits/temp-source-probe-20260904.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: capture 2026-09-04 source probe [probe-result]'
          git push origin HEAD:audit/timepoint-20260904-1509
