name: Temporary timepoint shelter capture

on:
  push:
    branches:
      - audit/timepoint-20260828-2213

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Fetch official current shelters safely
        run: node scripts/update-current-shelters.mjs --dry-run --candidate-output /tmp/current-shelters-candidate.json
      - name: Summarize candidate
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('/tmp/current-shelters-candidate.json','utf8'));
          console.log(JSON.stringify({meta:x.meta,count:x.shelters.length,unresolved:x.shelters.filter(r=>r.coordinate_status!=='confirmed').map(r=>({id:r.facility_id,name:r.name,status:r.coordinate_status}))},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: current-shelters-candidate
          path: /tmp/current-shelters-candidate.json
          if-no-files-found: error
