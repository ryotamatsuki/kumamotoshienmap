name: Temporary timepoint audit inspector

on:
  push:
    branches:
      - audit/timepoint-20260828-2213

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260828-2213
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Inspect canonical audit baselines
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          import {loadSenderAudit} from './scripts/sender-coverage-lib.mjs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const municipal=read('municipal-support-audit.json');
          const national=read('national-support-audit.json');
          const institution=read('operations/audits/institution-coverage-20260826-1926.json');
          const sender=loadSenderAudit();
          console.log('MUNICIPAL_META',JSON.stringify({reference_at:municipal.reference_at,checked_at:municipal.checked_at,release_id:municipal.release_id,summary:municipal.summary,records:(municipal.records||[]).map(r=>({id:r.record_id,state:r.state,source_ids:r.source_ids,display:r.display}))},null,2));
          console.log('NATIONAL_META',JSON.stringify({reference_at:national.reference_at,checked_at:national.checked_at,release_id:national.release_id,summary:national.summary,records:(national.records||[]).map(r=>({id:r.record_id,state:r.state,source_ids:r.source_ids,display:r.display}))},null,2));
          console.log('INSTITUTION_META',JSON.stringify({reference_at:institution.reference_at,checked_at:institution.checked_at,summary:institution.summary,required_count:(institution.required_entities||[]).length,source_mentions:(institution.source_mentions||[]).length,accepted_unresolved_count:(institution.accepted_unresolved||[]).length,newly_discovered:institution.newly_discovered_entities||institution.summary?.newly_discovered_entities},null,2));
          console.log('SENDER_STATES',JSON.stringify(sender.entities.map(e=>({key:`${e.prefecture}/${e.entity}`,state:e.state,support:e.support_types,dest:e.destinations,source_ids:e.source_ids})),null,2));
          NODE
