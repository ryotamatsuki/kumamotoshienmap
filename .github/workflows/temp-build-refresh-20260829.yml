name: Temporary build refresh 20260829

on:
  push:
    branches:
      - audit/timepoint-20260829-1258

permissions:
  contents: write

jobs:
  build-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260829-1258
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install npm metadata
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build and validate generated public files
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build
          git diff --check
          git status --short

      - name: Commit generated files and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/temp-build-refresh-20260829.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'No generated-file changes.'
            exit 0
          fi
          git commit -m 'build: sync public dashboard with 2026-08-29 shelter snapshot'
          git push origin HEAD:audit/timepoint-20260829-1258
