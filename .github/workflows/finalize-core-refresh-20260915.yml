name: Finalize audited core refresh 20260915
on:
  push:
    branches:
      - audit/timepoint-20260915-0028
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260915-0028
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare audited refresh
        run: python3 scripts/finalize-refresh-20260915.py
      - name: Run build and release gates
        run: |
          set -Eeuo pipefail
          npm run build
          npm run validate:release
          npm run test:release-gate
      - name: Commit audited refresh
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-core-refresh-20260915.yml scripts/finalize-refresh-20260915.py
          git add -A
          git commit -m 'data: refresh audited dashboard state for 2026-09-15'
          git push origin HEAD:audit/timepoint-20260915-0028
