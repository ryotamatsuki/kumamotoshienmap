name: Finalize audited core refresh 20260915
on:
  push:
    branches: [audit/timepoint-20260915-0028]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260915-0028
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Reapply prior audited patch and align Hakuo II overview
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import subprocess, textwrap, pathlib
          raw=subprocess.check_output(['git','show','787df99b1e7e3ea0d1974c0af6836b56c813a4e0:.github/workflows/finalize-core-refresh-20260915.yml'],text=True)
          start=raw.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=raw.index("\n          PY\n",start)
          body=textwrap.dedent(raw[start:end])
          exec(compile(body,'recovered-finalize.py','exec'),{'__name__':'__main__'})
          root=pathlib.Path('.')
          p=root/'scripts/sync-current-overview-summary.mjs'
          s=p.read_text(encoding='utf-8')
          old='const line = `はくおうⅡ宿泊支援：${hakuo.display?.status || hakuo.state}／${hakuo.display?.period || "期間要確認"}`;'
          new='const line = `はくおうⅡ入浴・休憩・宿泊支援：${hakuo.display?.status || hakuo.state}／${hakuo.display?.period || "期間要確認"}`;'
          if old not in s: raise SystemExit('Hakuo overview target missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          v=root/'scripts/validate-dashboard-current.mjs'
          t=v.read_text(encoding='utf-8')
          t=t.replace('はくおうⅡの入浴・休憩・宿泊支援は9月13日に終了','はくおうⅡ入浴・休憩・宿泊支援：HISTORICAL／9月13日終了')
          v.write_text(t,encoding='utf-8')
          PY
      - name: Run build and release gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build
          npm run validate:release
          npm run test:release-gate
      - name: Commit audited refresh and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-core-refresh-20260915.yml
          git add -A
          git commit -m 'data: refresh audited dashboard state for 2026-09-15'
          git push origin HEAD:audit/timepoint-20260915-0028
