name: Promote current shelters 20260915
on:
  push:
    branches: [audit/timepoint-20260915-0028]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260915-0028
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate candidate and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run update:current-shelters -- --dry-run --candidate-output /tmp/current-shelters-candidate.json
          node scripts/validate-current-shelters.mjs --candidate=/tmp/current-shelters-candidate.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/current-shelters-candidate.json'))
          print(json.dumps({
            'fetched_at':d['meta']['fetched_at'],
            'source_last_modified':d['meta']['source_last_modified'],
            'current_count':d['meta']['current_count'],
            'confirmed':sum(x['coordinate_status']=='confirmed' for x in d['shelters']),
            'conflicts':sum(x['coordinate_status']=='conflict' for x in d['shelters']),
            'unresolved':sum(x['coordinate_status']=='unresolved' for x in d['shelters']),
          },ensure_ascii=False))
          PY
          cp /tmp/current-shelters-candidate.json current-shelters.json
      - name: Commit promoted candidate and remove workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/promote-current-shelters-20260915.yml
          git add current-shelters.json .github/workflows/promote-current-shelters-20260915.yml
          git commit -m 'data: promote validated current shelters for 2026-09-15'
          git push origin HEAD:audit/timepoint-20260915-0028
