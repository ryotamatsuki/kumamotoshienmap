name: Temporary fix quotepath
on:
  push:
    branches:
      - fix/page-snapshot-consistency-20260902
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/page-snapshot-consistency-20260902
      - name: Patch temporary applicator whitelist
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/tmp-page-snapshot-consistency-fix.yml')
          s=p.read_text()
          old='changed="$(git diff --name-only)"'
          new='changed="$(git -c core.quotepath=false diff --name-only)"'
          if old in s:
              p.write_text(s.replace(old,new,1))
          PY
          if git diff --quiet; then
            echo 'quotepath patch already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-page-snapshot-consistency-fix.yml
          git commit -m 'chore: fix temporary workflow quotepath'
          git push origin HEAD:fix/page-snapshot-consistency-20260902
