              if x.get('state') in ('CURRENT','PLANNED'):
                print(r['id'],x)
          n=json.load(open('national-support-audit.json'))
          print('=== NATIONAL RECORDS ===')
          for r in n['records']:
            print(r.get('record_id'),r.get('state'),r.get('display'),r.get('evidence_source_ids') or r.get('source_ids'))
