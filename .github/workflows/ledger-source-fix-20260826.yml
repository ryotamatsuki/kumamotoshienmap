name: Temporary ledger source registry fix 20260826

on:
  push:
    branches:
      - audit/timepoint-20260826-1926
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ledger-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260826-1926
          fetch-depth: 0
      - name: Register accepted-unresolved sources in ledger
        run: |
          set -Eeuo pipefail
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='operations/ledgers/refresh-20260826-1926.json';
          const ledger=JSON.parse(readFileSync(path,'utf8'));
          ledger.sources ||= [];
          const upsert=(source)=>{
            const index=ledger.sources.findIndex(item=>item.source_id===source.source_id);
            if(index>=0)ledger.sources[index]={...ledger.sources[index],...source};
            else ledger.sources.push(source);
          };
          upsert({
            source_id:'kkr-tec5-0824',
            publisher:'国土交通省近畿地方整備局',
            url:'https://www.kkr.mlit.go.jp/news/top/press/2026/20260824-2tec-forcedai5jin.html',
            primary:true,
            source_as_of:'2026-08-24T00:00:00+09:00',
            checked_at:'2026-08-26T20:05:00+09:00'
          });
          upsert({
            source_id:'kumamoto-volunteer-0824',
            publisher:'熊本県 災害ボランティアへの積極的な参加をお願いします',
            url:'https://www.pref.kumamoto.jp/soshiki/27/275523.html',
            primary:true,
            source_as_of:'2026-08-24T00:00:00+09:00',
            checked_at:'2026-08-26T20:05:00+09:00'
          });
          writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          console.log(JSON.stringify({sources:ledger.sources.length,registered:['kkr-tec5-0824','kumamoto-volunteer-0824']}));
          NODE
          git diff --check
      - name: Commit ledger registry fix
        run: |
          set -Eeuo pipefail
          git add operations/ledgers/refresh-20260826-1926.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: register accepted-unresolved sources in release ledger [skip ledger-fix]'
          git push origin HEAD:audit/timepoint-20260826-1926
