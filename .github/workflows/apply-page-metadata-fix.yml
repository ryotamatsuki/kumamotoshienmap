name: Apply page metadata fix

on:
  push:
    branches:
      - fix/page-checked-at-sync-20260822
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify page metadata fix
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/page-checked-at-sync-20260822
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Apply reviewed patch
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main --prune
          cat scripts/.page-metadata-fix.part-* > /tmp/page-metadata-fix.patch
          git apply --check /tmp/page-metadata-fix.patch
          git apply /tmp/page-metadata-fix.patch
      - name: Build and test
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
          npm run test:release-gate
          node --check scripts/current-page-metadata.mjs
          node --check scripts/sync-current-page-metadata.mjs
          node --check scripts/validate-update-release.mjs
          node --check scripts/validate-current-state-audit.mjs
          cmp --silent ehime_kumamoto_support_geocoded_shelters_20260802.html public/dashboard.html
          git diff --check
      - name: Commit final reviewed diff
        env:
          BRANCH_NAME: fix/page-checked-at-sync-20260822
        run: |
          set -Eeuo pipefail
          git rm \
            scripts/.page-metadata-fix.part-00 \
            scripts/.page-metadata-fix.part-01 \
            scripts/.page-metadata-fix.part-02 \
            scripts/.page-metadata-fix.part-03 \
            .github/workflows/apply-page-metadata-fix.yml
          git add \
            .github/workflows/post-deploy-pages-smoke.yml \
            operations/ledgers/refresh-20260822-1544.json \
            package.json \
            scripts/current-page-metadata.mjs \
            scripts/sync-current-page-metadata.mjs \
            scripts/validate-current-state-audit.mjs \
            scripts/validate-update-release.mjs \
            scripts/test-release-gate.mjs \
            ehime_kumamoto_support_geocoded_shelters_20260802.html \
            public/dashboard.html \
            時点修正更新オペレーション.md
          git diff --cached --check
          if ! git diff --quiet; then
            echo '::error title=Unexpected unstaged changes::Build or patch modified files outside the reviewed final diff.'
            git status --short
            git diff --name-only
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked" ]]; then
            echo '::error title=Unexpected untracked files::Unreviewed files remain.'
            printf '%s\n' "$untracked"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: sync visible page checked-at metadata'
          npm run validate:release -- \
            --base=origin/main \
            --ledger=operations/ledgers/refresh-20260822-1544.json \
            --require-ledger-if-data-change
          git push origin "HEAD:${BRANCH_NAME}"
