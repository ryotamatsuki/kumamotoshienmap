name: Finalize Ehime 2026-09-07 correction

on:
  push:
    branches:
      - audit/ehime-20260907-v2
    paths:
      - .github/workflows/finalize-ehime-20260907-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Patch canonical Ehime producer as correction to 15:22 release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('scripts/sync-current-release.mjs')
          s = p.read_text()
          U = {
            "ehime-management": {"status":"現行派遣・終期未定（9月7日12時資料）","scale":"96人（県38・市町58）／延481人日","period":"8月1日～終期未定","detail":"先遣隊は8月8日活動終了。災害応急対策職員は氷川町で8月1日～終期未定。第1～7陣、第9陣まで準備済み。竜北中学校での避難所支援は9月7日まで、住家被害認定調査の二次調査は9月7日から。","asOf":"愛媛県 9月7日12時"},
            "ehime-dmat": {"status":"活動終了（8月25日）","scale":"4人（延20人日）","period":"8月7日～8月25日","detail":"DMATコーディネーションチーム第1～3陣は活動終了。","asOf":"愛媛県 9月7日12時"},
            "ehime-dpat": {"status":"活動終了（8月12日）","scale":"8人（延32人日）","period":"8月2日～8月12日","detail":"愛媛DPAT第1～2陣は活動終了。","asOf":"愛媛県 9月7日12時"},
            "ehime-health": {"status":"第1～12班派遣予定（9月30日まで）","scale":"29人（延158人日）","period":"8月2日～9月30日予定","detail":"保健師等第1～12班（予定）は氷川町健康センターで支援。","asOf":"愛媛県 9月7日12時"},
            "ehime-dwat": {"status":"第1～17班派遣予定（9月30日まで）","scale":"28人（延84人日）","period":"8月12日～9月30日予定","detail":"DWAT第1～17班（予定）は八代・宇城市内避難所等で支援。","asOf":"愛媛県 9月7日12時"},
            "ehime-police": {"status":"派遣継続予定を含む（9月7日12時資料）","scale":"58人（延396人日）","period":"8月1日～9月8日予定を含む","detail":"特別自動車警ら部隊等の予定を掲載。予定期間のみで当日実働を推定しない。","asOf":"愛媛県 9月7日12時"},
            "ehime-base": {"status":"項目別提供状況（9月7日12時資料）","scale":"提供可能住宅175戸／県大型トイレカー9月7日運用終了／キッチンカー1,920食提供済み","period":"9月7日12時資料","detail":"県大型トイレカーは竜北中学校で9月7日に運用終了。循環式シャワー・手洗機等は8月26日運用終了。","asOf":"愛媛県 9月7日12時"},
            "ehime-redcross": {"status":"第1～4班派遣予定（9月21日まで）","scale":"20人（延94人日）","period":"8月8日～9月21日予定","detail":"救護班第1～4班（予定）は宇城市・氷川町で活動。","asOf":"愛媛県 9月7日12時"},
            "ehime-redcross-medcoord": {"status":"活動終了（8月25日）","scale":"3人（延18人日）","period":"8月20日～8月25日","detail":"災害医療コーディネートチームは活動終了。","asOf":"愛媛県 9月7日12時"},
            "ehime-redcross-mental": {"status":"活動終了（8月27日）","scale":"4人（延20人日）","period":"8月23日～8月27日","detail":"こころのケア班は活動終了。","asOf":"愛媛県 9月7日12時"},
            "ehime-jrat": {"status":"第1～5班派遣予定（9月25日まで）","scale":"12人（延45人日）","period":"8月17日～9月25日予定","detail":"JRAT第1～5班（予定）は八代市・氷川町を中心とした被災地域で支援。","asOf":"愛媛県 9月7日12時"},
            "ehime-social-welfare": {"status":"第1～7班派遣予定（10月15日まで）","scale":"9人（延45人日）","period":"8月16日～10月15日予定","detail":"社協職員第1～7班（予定）は宇城市災害ボランティアセンターで支援。","asOf":"愛媛県 9月7日12時"}
          }
          prefix = "const src='https://www.pref.ehime.jp/uploaded/attachment/189556.pdf';const U=" + json.dumps(U, ensure_ascii=False, separators=(',', ':'))
          pat = r"const src='https://www\.pref\.ehime\.jp/uploaded/attachment/189500\.pdf';const U=.*?;for\(const \[id,v\] of Object\.entries\(U\)\)"
          s, n = re.subn(pat, prefix + ";for(const [id,v] of Object.entries(U))", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'failed to replace Ehime U block: {n}')

          marker = "const mutate=(name)=>"
          overview_sync = "html=html.replace('対口支援96人（県38・市町58）、延439人日。災害応急対策職員は終期未定','対口支援96人（県38・市町58）、延481人日。災害応急対策職員は終期未定').replace('保健師等25人・DWAT25人は9月30日まで予定','保健師等29人・DWAT28人は9月30日まで予定').replace('県大型トイレカーは竜北中学校で運用中。人的支援総計253人・延1,228人日','県大型トイレカーは9月7日に運用終了。人的支援総計260人・延1,307人日');\n"
          if overview_sync not in s:
              if marker not in s:
                  raise SystemExit('mutate marker missing')
              s = s.replace(marker, overview_sync + marker, 1)

          replacements = {
            "9月4日12時版：対口支援96人・延439人日、人的支援総計253人・延1,228人日": "9月7日12時版：対口支援96人・延481人日、人的支援総計260人・延1,307人日",
            "氷川町支援は8月1日～終期未定。保健師等・DWATは9月30日まで予定。": "氷川町支援は8月1日～終期未定。保健師等29人・DWAT28人は9月30日まで予定。県大型トイレカーは9月7日運用終了。",
            "愛媛県 9月4日12時版": "愛媛県 9月7日12時版",
            "熊本県第52報（9月3日14時）と愛媛県9月4日12時版まで更新": "熊本県第52報（9月3日14時）と愛媛県9月7日12時版まで更新",
            "熊本県第52報／愛媛県9月4日12時版／国関係9月7日再監査": "熊本県第52報／愛媛県9月7日12時版／国関係9月7日再監査",
            "愛媛県9月4日12時資料により愛媛県をCURRENTへ更新。その他主体は前回裁定を継承。": "愛媛県9月7日12時資料により愛媛県をCURRENTへ更新。その他主体は前回裁定を継承。"
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected producer string: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Install and build corrected candidate
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
      - name: Verify rendered Ehime correction
        run: |
          set -euo pipefail
          for f in ehime_kumamoto_support_geocoded_shelters_20260802.html public/dashboard.html; do
            grep -F '対口支援96人（県38・市町58）、延481人日' "$f"
            grep -F '保健師等29人・DWAT28人は9月30日まで予定' "$f"
            grep -F '人的支援総計260人・延1,307人日' "$f"
            grep -F '県大型トイレカーは9月7日に運用終了' "$f"
            grep -F '29人（延158人日）' "$f"
            grep -F '28人（延84人日）' "$f"
            grep -F '58人（延396人日）' "$f"
            grep -F '20人（延94人日）' "$f"
            grep -F '12人（延45人日）' "$f"
          done
          ! grep -F '人的支援総計253人・延1,228人日' ehime_kumamoto_support_geocoded_shelters_20260802.html
          ! grep -F 'attachment/189500.pdf' scripts/sync-current-release.mjs
      - name: Remove temporary acquisition and finalizer workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/ehime-source-fetch-20260907.yml
          rm -f .github/workflows/finalize-ehime-20260907.yml
          rm -f .github/workflows/finalize-ehime-20260907-v2.yml
          rm -f operations/audits/ehime-source-20260907.txt
          rm -f operations/audits/ehime-source-20260907-meta.txt
          rm -f operations/audits/ehime-site-matches-20260907.txt
      - name: Correct existing 15:22 release ledger
        env:
          BASE: f484fbb5b526c69a0ba758cbb183ff0583b210a5
          LEDGER: operations/ledgers/refresh-20260907-1522.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          base=os.environ['BASE']; ledger_path=os.environ['LEDGER']
          p=Path(ledger_path)
          ledger=json.loads(p.read_text())
          ledger['rechecked_at']='2026-09-07T17:04:00+09:00'
          for source in ledger['sources']:
              if source.get('source_id') == 'ehime-support-0904':
                  source.update({
                    'source_id':'ehime-support-0907',
                    'publisher':'愛媛県',
                    'url':'https://www.pref.ehime.jp/uploaded/attachment/189556.pdf',
                    'source_as_of':'2026-09-07T12:00:00+09:00',
                    'checked_at':'2026-09-07T17:04:00+09:00'
                  })
                  break
          else:
              raise SystemExit('Ehime source entry not found in release ledger')
          ledger.setdefault('snapshots',{}).update({
            'ehime_support_as_of':'2026-09-07T12:00:00+09:00',
            'ehime_human_support_persons':260,
            'ehime_human_support_person_days':1307,
            'ehime_counterpart_persons':96,
            'ehime_counterpart_person_days':481,
            'ehime_donations_yen':26880978,
            'ehime_donations_as_of':'2026-09-03'
          })
          changed=subprocess.check_output(['git','diff','--name-only',base],text=True).splitlines()
          changed=[x for x in changed if x and x != ledger_path]
          ledger['expected_changed_files']=sorted(set(changed+[ledger_path]))
          p.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print('\n'.join(ledger['expected_changed_files']))
          PY
      - name: Commit corrected candidate locally
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: refresh Ehime support to 2026-09-07 official results'
      - name: Rebuild and run release gate against committed candidate
        env:
          BASE: f484fbb5b526c69a0ba758cbb183ff0583b210a5
          LEDGER: operations/ledgers/refresh-20260907-1522.json
        run: |
          set -euo pipefail
          npm run build
          git diff --exit-code
          npm run test:release-gate
          npm run validate:release -- --base="$BASE" --ledger="$LEDGER" --require-ledger-if-data-change
      - name: Push validated correction
        run: |
          set -euo pipefail
          git push origin HEAD:audit/ehime-20260907-v2
