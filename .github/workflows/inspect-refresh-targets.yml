name: Inspect refresh targets
on:
  push:
    branches: [audit/timepoint-20260915-0028]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260915-0028
      - name: Inspect targets
        shell: bash
        run: |
          python3 - <<'PY'
          import json, glob
          m=json.load(open('municipal-support-audit.json'))
          for r in m['records']:
            if r['id'] in ['pair-uto','pair-hikawa']:
              print('MUNICIPAL',r['id'],json.dumps(r,ensure_ascii=False,indent=2))
          n=json.load(open('national-support-audit.json'))
          for r in n['records']:
            if r.get('record_id') in ['national-water','national-tec','national-bath','national-accommodation-hakuo2']:
              print('NATIONAL',r['record_id'],json.dumps(r,ensure_ascii=False,indent=2))
          for f in glob.glob('research_official_*.json'):
            d=json.load(open(f)); print('RESEARCH',f,[x.get('municipality') for x in d.get('municipalities',[])])
          PY
          echo '=== validator refs ==='
          grep -nE '2026-09-0|20260907|D\+38|2000|2,000|1,780|283|1396|1,396' scripts/validate-current-state-audit.mjs scripts/validate-ehime-current.mjs scripts/validate-national-support-audit.mjs scripts/validate-volunteer-data.mjs scripts/validate-institution-coverage.mjs | head -n 260 || true
      - name: Cleanup
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/inspect-refresh-targets.yml
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'chore: remove refresh target inspector' && git push origin HEAD:audit/timepoint-20260915-0028; fi
