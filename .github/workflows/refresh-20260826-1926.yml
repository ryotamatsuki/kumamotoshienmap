name: Temporary v2.5 full refresh 20260826-1926

on:
  push:
    branches:
      - audit/timepoint-20260826-1926
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260826-1926
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Candidate shelter refresh and strict validation
        run: |
          set -Eeuo pipefail
          node scripts/update-current-shelters.mjs --dry-run --candidate-output=current-shelters.candidate.json
          node scripts/validate-current-shelters.mjs --candidate current-shelters.candidate.json
      - name: Apply current shelters and v2.5 adjudication refresh
        run: |
          set -Eeuo pipefail
          node scripts/update-current-shelters.mjs
          node scripts/refresh-20260826-1926.mjs
          node scripts/finalize-current-point-20260826.mjs
      - name: Generate and synchronize derived data
        run: |
          set -Eeuo pipefail
          npm run generate:volunteer
          npm run generate:current-shelter-data
          npm run sync:municipal-support
          npm run sync:national-support
          npm run sync:page-metadata
      - name: Apply final report 45 runtime overlay
        run: |
          set -Eeuo pipefail
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const anchor='/* MUNICIPAL_SUPPORT_AUDIT_END */';
          const block=`/* CURRENT_STATE_REFRESH_20260826_FINAL_START */
          {const event=TIMELINE_EVENTS.find(item=>item.id==='t-current-status');if(event)Object.assign(event,{date:'2026-08-26',dateLabel:'8月26日',weekday:'水',time:'08:00',phase:'recovery',actor:'kumamoto',title:'熊本県第45報で被害・避難状況を更新',summary:'避難者2,589人、開設避難所64か所、人的被害402人、住家被害39,567棟。',detail:'熊本県第45報（8月26日8時現在）の県全体値。市町別24行の旧スナップショットは時点が異なるため、第45報の県計へ機械的に再配分しない。現行公式避難所JSONは別定義・別時点で表示。',place:'熊本県内',sourceLabel:'熊本県 被害情報 第45報',sourceUrl:'https://www.pref.kumamoto.jp/soshiki/222/276831.html',recordIds:['national-water','national-tec','national-medical','national-cert'],hubIds:['kumamoto-hq','yatsushiro','uto','uki','misato','hikawa'],tags:['熊本県第45報','8月26日8時','最新確認']});}
          {const item=PROVINCE_NEEDS.find(value=>value.id==='p-shelter');if(item)item.observed='熊本県第45報（8月26日8時）では避難所64か所、避難者2,589人。現行公式避難所JSONは取得時点の開設施設を別定義で表示する。';}
          {const item=PROVINCE_NEEDS.find(value=>value.id==='p-admin');if(item)item.observed='熊本県第45報では住家被害39,567棟。市町別旧スナップショットとは時点が異なるため、県計と旧内訳を分離して表示する。';}
          {const item=PROVINCE_NEEDS.find(value=>value.id==='p-housing');if(item)item.observed='熊本県第45報では住家被害39,567棟。被害区分別の現況は確認できた県計の範囲を超えて推測せず、旧区分値を現況として流用しない。';}
          if(typeof PAGE_RECHECK_META!=='undefined'){PAGE_RECHECK_META.checkedAt='2026-08-26T19:26:53+09:00';PAGE_RECHECK_META.volunteerCheckedAt='2026-08-26T19:26:53+09:00';}
          /* CURRENT_STATE_REFRESH_20260826_FINAL_END */`;
          for(const p of ['ehime_kumamoto_support_geocoded_shelters_20260802.html','public/dashboard.html']){
            let t=readFileSync(p,'utf8');
            if(!t.includes(anchor))throw new Error('municipal audit end anchor missing: '+p);
            const start='/* CURRENT_STATE_REFRESH_20260826_FINAL_START */';
            const end='/* CURRENT_STATE_REFRESH_20260826_FINAL_END */';
            const s=t.indexOf(start),e=t.indexOf(end);
            if(s>=0&&e>s)t=t.slice(0,s)+t.slice(e+end.length);
            t=t.replace(anchor,block+'\n'+anchor);
            writeFileSync(p,t);
          }
          NODE
      - name: Patch post-deploy expected shelter count
        run: |
          set -Eeuo pipefail
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const count=JSON.parse(readFileSync('current-shelters.json','utf8')).shelters.length;
          const p='.github/workflows/post-deploy-pages-smoke.yml';
          let t=readFileSync(p,'utf8');
          t=t.replace(/current_count!==\d+/g,`current_count!==${count}`)
             .replace(/shelters\.length!==\d+/g,`shelters.length!==${count}`)
             .replace(/current shelters count must be \d+/g,`current shelters count must be ${count}`);
          writeFileSync(p,t);
          console.log(JSON.stringify({currentShelters:count}));
          NODE
      - name: Validate generated dashboard and build dist
        run: |
          set -Eeuo pipefail
          npm run validate:dashboard
          npm run validate:current-state
          npm run validate:timeline
          npm run validate:volunteer
          npm run validate:shelters
          npm run validate:current-shelters
          npm run validate:municipal-support
          npm run validate:national-support
          npm run validate:institution-coverage
          node scripts/build-sites.mjs
          npm run validate:dist
      - name: Remove temporary runner and finalize release ledger
        run: |
          set -Eeuo pipefail
          rm -f current-shelters.candidate.json
          git rm .github/workflows/refresh-20260826-1926.yml scripts/refresh-20260826-1926.mjs scripts/finalize-current-point-20260826.mjs
          git add -N .
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const base='96d0aa6513703634f7355a2cf9fd95a78d0e9de1';
          const lp='operations/ledgers/refresh-20260826-1926.json';
          const ledger=JSON.parse(readFileSync(lp,'utf8'));
          const shelters=JSON.parse(readFileSync('current-shelters.json','utf8'));
          const unresolved=shelters.shelters.filter(x=>x.coordinate_status==='unresolved').length;
          const conflict=shelters.shelters.filter(x=>x.coordinate_status==='conflict').length;
          ledger.coverage.current_count=shelters.shelters.length;
          ledger.coverage.unresolved_count=unresolved;
          ledger.coverage.conflict_count=conflict;
          ledger.snapshots.current_shelters=shelters.shelters.length;
          let files=execFileSync('git',['diff','--name-only',base],{encoding:'utf8'}).trim().split(/\n/u).filter(Boolean);
          files=files.filter(p=>!['.github/workflows/refresh-20260826-1926.yml','scripts/refresh-20260826-1926.mjs','scripts/finalize-current-point-20260826.mjs','current-shelters.candidate.json'].includes(p));
          if(!files.includes(lp))files.push(lp);
          ledger.expected_changed_files=[...new Set(files)].sort();
          writeFileSync(lp,JSON.stringify(ledger,null,2)+'\n');
          console.log(JSON.stringify({expectedChangedFiles:ledger.expected_changed_files,currentShelters:shelters.shelters.length,unresolved,conflict}));
          NODE
          git add -A
      - name: Release self-test and gate
        run: |
          set -Eeuo pipefail
          npm run test:release-gate
          npm run validate:release
          git diff --check --cached
      - name: Commit generated refresh
        run: |
          set -Eeuo pipefail
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: 2026-08-26時点の全面再監査を反映 [skip refresh]'
          git push origin HEAD:audit/timepoint-20260826-1926
