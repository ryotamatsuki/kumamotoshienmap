name: Inspect audit state
on:
  push:
    branches: [audit/timepoint-20260915-0028]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260915-0028
      - name: Inspect current audits and MLIT water section
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '===== MUNICIPAL ACTIVE/NONUNKNOWN ====='
          python3 - <<'PY'
          import json
          a=json.load(open('municipal-support-audit.json',encoding='utf-8'))
          print('reference',a['reference_at'],'release',a['release_id'])
          for r in a['records']:
              all_=r['provider_statuses']+r.get('additional_statuses',[])
              print('\n',r['id'],r.get('destination'),r['display']['status'])
              for x in all_:
                  if x['state']!='UNKNOWN': print(x['name'],x['state'],','.join(x['source_ids']),x['note'])
          print('\n===== SOURCE COUNT =====',len(a['sources']))
          n=json.load(open('national-support-audit.json',encoding='utf-8'))
          print('NATIONAL reference',n['reference_at'],'release',n['release_id'],'summary',n.get('summary'))
          for r in n['records']:
              if r['record_id'] in ('national-water','national-tec','national-accommodation-hakuo2','national-bath'):
                  print('\nNATIONAL',json.dumps(r,ensure_ascii=False,indent=2))
          PY
          curl -fsSL -A 'Mozilla/5.0' https://www.mlit.go.jp/common/002021337.pdf -o /tmp/mlit.pdf
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          pdftotext -layout /tmp/mlit.pdf /tmp/mlit.txt
          echo '===== MLIT WATER 280-365 ====='
          sed -n '280,365p' /tmp/mlit.txt
      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/inspect-audit-state.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove audit inspection workflow'
            git push origin HEAD:audit/timepoint-20260915-0028
          fi
