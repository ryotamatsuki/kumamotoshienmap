name: Fetch Ehime 2026-09-07 source

on:
  push:
    branches:
      - audit/ehime-20260907-v2
    paths-ignore:
      - operations/audits/ehime-source-20260907.txt
      - operations/audits/ehime-source-20260907-meta.txt
      - operations/audits/ehime-site-matches-20260907.txt

permissions:
  contents: write

jobs:
  fetch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Fetch official Ehime source and inspect current site values
        run: |
          set -euo pipefail
          mkdir -p operations/audits
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://www.pref.ehime.jp/uploaded/attachment/189556.pdf' \
            -o /tmp/ehime-20260907.pdf
          pdftotext -layout /tmp/ehime-20260907.pdf operations/audits/ehime-source-20260907.txt
          {
            echo 'url=https://www.pref.ehime.jp/uploaded/attachment/189556.pdf'
            echo "fetched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sha256sum /tmp/ehime-20260907.pdf
            pdfinfo /tmp/ehime-20260907.pdf
          } > operations/audits/ehime-source-20260907-meta.txt
          {
            echo '=== source matches ==='
            grep -nE '合計|義援金額|対口支援|災害ボランティア|県営住宅|相談窓口' operations/audits/ehime-source-20260907.txt || true
            echo '=== repository matches for old/current aggregate values ==='
            grep -RInE --exclude-dir=.git --exclude='ehime-source-20260907.txt' --exclude='ehime-site-matches-20260907.txt' '1,228|1,773|26,880,978|35,624,556|253人|457人|延べ1,228|延べ1,773|96人|119人|439人日|512人日' . || true
          } > operations/audits/ehime-site-matches-20260907.txt
      - name: Commit extracted source and inspection
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operations/audits/ehime-source-20260907.txt operations/audits/ehime-source-20260907-meta.txt operations/audits/ehime-site-matches-20260907.txt
          if git diff --cached --quiet; then
            echo 'No source changes'
            exit 0
          fi
          git commit -m 'audit: inspect Ehime 2026-09-07 support values'
          git push
