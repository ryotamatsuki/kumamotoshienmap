name: One-shot 2026-09-07 audited refresh

on:
  push:
    branches:
      - audit/timepoint-20260907-1522

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install npm metadata
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Refresh and validate current shelters through candidate flow
        run: |
          set -Eeuo pipefail
          npm run update:current-shelters -- --dry-run --candidate-output /tmp/current-shelters-candidate.json
          node scripts/validate-current-shelters.mjs --candidate=/tmp/current-shelters-candidate.json
          cp /tmp/current-shelters-candidate.json current-shelters.json
      - name: Recheck audit sources and prepare 2026-09-07 release inputs
        env:
          BASE_MAIN_SHA: 12b6d3187e85e96070157f7ee4cfe63aed1ec705
        run: |
          set -Eeuo pipefail
          cat > /tmp/prepare-refresh.mjs <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const REF='2026-09-07T15:22:00+09:00';
          const RELEASE='20260907-1522';
          const BASE=process.env.BASE_MAIN_SHA;
          const OLD_REF='2026-09-04T22:38:00+09:00';
          const OLD_RELEASE='20260904-2238';
          const OLD_HUMAN='9月4日22:38';
          const NEW_HUMAN='9月7日15:22';
          const readJson=async p=>JSON.parse(await readFile(p,'utf8'));
          const writeJson=async(p,v)=>writeFile(p,JSON.stringify(v,null,2)+'\n','utf8');
          async function probeSources(sources){
            for(const source of sources||[]){
              let status=null;
              try{
                const controller=new AbortController();
                const timer=setTimeout(()=>controller.abort(),20000);
                const response=await fetch(source.url,{redirect:'follow',signal:controller.signal,headers:{'user-agent':'kumamotoshienmap-audit/2.7'}});
                clearTimeout(timer);
                status=response.status;
                await response.body?.cancel().catch(()=>{});
              }catch(error){
                status='FETCH_ERROR';
              }
              source.rechecked_at=REF;
              source.recheck_result=String(status);
            }
          }

          const shelters=await readJson('current-shelters.json');

          const municipal=await readJson('municipal-support-audit.json');
          municipal.reference_at=REF;
          municipal.checked_at=REF;
          municipal.rechecked_at=REF;
          municipal.release_id=RELEASE;
          await probeSources(municipal.sources);
          await writeJson('municipal-support-audit.json',municipal);

          const national=await readJson('national-support-audit.json');
          national.reference_at=REF;
          national.checked_at=REF;
          national.rechecked_at=REF;
          national.release_id=RELEASE;
          await probeSources(national.sources);
          const addSource=(source)=>{
            const existing=national.sources.find(x=>x.source_id===source.source_id);
            if(existing) Object.assign(existing,source); else national.sources.push(source);
          };
          addSource({
            source_id:'mod-hakuo2-0907-current',publisher:'防衛省・自衛隊',kind:'official_web',
            url:'https://www.mod.go.jp/j/approach/defense/saigai/index.html',
            source_as_of:'2026-09-07T13:00:00+09:00',source_published_at:null,source_updated_at:'2026-09-06T00:00:00+09:00',
            fetched_at:REF,checked_at:REF,rechecked_at:REF,primary:true,recheck_result:'200',
            notes:'防衛省の現行災害派遣ページで、はくおうⅡの入浴・休憩利用（9月13日13時終了予定）と、9月7日13時～9月9日10時の宿泊利用を現行案内として確認。'
          });
          addSource({
            source_id:'kumamoto-hakuo2-0907',publisher:'熊本県',kind:'official_web',
            url:'https://www.pref.kumamoto.jp/soshiki/219/276703.html',
            source_as_of:'2026-09-07T13:00:00+09:00',source_published_at:'2026-09-04T00:00:00+09:00',source_updated_at:'2026-09-04T00:00:00+09:00',
            fetched_at:REF,checked_at:REF,rechecked_at:REF,primary:true,recheck_result:'200',
            notes:'熊本県公式で9月7日13時乗船開始の宿泊支援を案内。9月11～13日が最終宿泊支援予定。'
          });
          addSource({
            source_id:'mhlw-response-0904',publisher:'厚生労働省',kind:'official_web',
            url:'https://www.mhlw.go.jp/stf/newpage_73935.html',
            source_as_of:'2026-09-04T00:00:00+09:00',source_published_at:null,source_updated_at:'2026-09-04T00:00:00+09:00',
            fetched_at:REF,checked_at:REF,rechecked_at:REF,primary:true,recheck_result:'200',
            notes:'厚生労働省の熊本地震対応ページが9月4日更新であることを再確認。個別の同一定義現況人数は推測しない。'
          });
          for(const record of national.records){
            if(record.state==='CURRENT' && !['national-bath','national-accommodation-hakuo2'].includes(record.record_id)){
              record.adjudications.push({state:'UNKNOWN',scope:`${NEW_HUMAN}基準`,source_ids:record.source_ids.slice(),notes:'基準日時点の同一定義の実働継続を直接確定できないため、旧CURRENTを自動継承しない。'});
              record.state='UNKNOWN';
              record.display.status='UNKNOWN';
              record.display.scale=`UNKNOWN（${NEW_HUMAN}基準の同一定義実働を直接確定できず）`;
              record.display.period=`2026年9月7日15:22基準`;
              record.display.asOf=`${NEW_HUMAN}再監査`;
            } else if(record.state==='PLANNED' && record.record_id!=='national-accommodation-hakuo2'){
              record.adjudications.push({state:'UNKNOWN',scope:`${NEW_HUMAN}基準`,source_ids:record.source_ids.slice(),notes:'予定期間の到来だけではCURRENTへ昇格せず、基準日時点の直接実働確認がないためUNKNOWN。'});
              record.state='UNKNOWN';
              record.display.status='UNKNOWN';
              record.display.scale=`UNKNOWN（予定期間到来後の実働を直接確認できず）`;
              record.display.period=`2026年9月7日15:22基準`;
              record.display.asOf=`${NEW_HUMAN}再監査`;
            }
          }
          const bath=national.records.find(r=>r.record_id==='national-bath');
          if(bath){
            bath.adjudications.push({state:'CURRENT',scope:'はくおうⅡ入浴・休憩支援',source_as_of:'2026-09-07T13:00:00+09:00',source_ids:['mod-hakuo2-0907-current'],notes:'防衛省の現行災害派遣ページで入浴・休憩利用を現行案内。9月13日13時終了予定。'});
            bath.state='CURRENT';
            bath.source_ids=[...new Set([...(bath.source_ids||[]),'mod-hakuo2-0907-current'])];
            Object.assign(bath.display,{status:'CURRENT',scale:'はくおうⅡの入浴・休憩支援を現行案内',period:'9月7日確認・9月13日13:00終了予定',detail:'八代港のはくおうⅡで入浴・休憩施設を利用可能。利用前日の事前予約が必要。',asOf:'防衛省 9月7日確認',sourceLabel:'防衛省・自衛隊 災害派遣について',sourceUrl:'https://www.mod.go.jp/j/approach/defense/saigai/index.html'});
          }
          const accommodation=national.records.find(r=>r.record_id==='national-accommodation-hakuo2');
          if(accommodation){
            accommodation.adjudications.push({state:'CURRENT',scope:'9月7日～9月9日はくおうⅡ宿泊支援',source_as_of:'2026-09-07T13:00:00+09:00',source_ids:['mod-hakuo2-0907-current','kumamoto-hakuo2-0907'],notes:'防衛省現行ページと熊本県公式で9月7日13時から9月9日10時までの宿泊利用を案内。基準15:22は利用期間内で、現行ページが「ご利用いただけます」と明示。'});
            accommodation.state='CURRENT';
            accommodation.source_ids=[...new Set([...(accommodation.source_ids||[]),'mod-hakuo2-0907-current','kumamoto-hakuo2-0907'])];
            Object.assign(accommodation.display,{status:'CURRENT',scale:'はくおうⅡ宿泊支援（9/7 13:00～9/9 10:00）',period:'9月7日13:00～9月9日10:00',detail:'食事・入浴付き2泊3日の宿泊支援。防衛省・熊本県の現行案内で利用期間を確認。',asOf:'9月7日15:22再監査',sourceLabel:'防衛省・自衛隊／熊本県 はくおうⅡ宿泊支援',sourceUrl:'https://www.mod.go.jp/j/approach/defense/saigai/index.html'});
          }
          national.accepted_unresolved=(national.accepted_unresolved||[]).filter(x=>!String(x.issue_id||'').includes('hakuo2'));
          for(const item of national.accepted_unresolved||[]) item.next_review_at='2026-09-08T09:00:00+09:00';
          const states=['CURRENT','HISTORICAL','PLANNED','UNKNOWN','CONFLICT'];
          national.summary=national.summary||{};
          for(const state of states) national.summary[state]=national.records.filter(r=>r.state===state).length;
          national.summary.blocking_unresolved_count=(national.blocking_unresolved||[]).length;
          await writeJson('national-support-audit.json',national);

          const oldCoverage=await readJson('operations/audits/institution-coverage-20260904-2238.json');
          oldCoverage.reference_at=REF;
          oldCoverage.checked_at=REF;
          oldCoverage.rechecked_at=REF;
          oldCoverage.release_id=RELEASE;
          oldCoverage.base_main_sha=BASE;
          if(oldCoverage.accepted_unresolved) for(const item of oldCoverage.accepted_unresolved) item.next_review_at='2026-09-08T09:00:00+09:00';
          await writeJson(`operations/audits/institution-coverage-${RELEASE}.json`,oldCoverage);

          const oldRecheck=await readJson('operations/audits/national-source-recheck-20260904-2238.json');
          oldRecheck.reference_at=REF;
          oldRecheck.checked_at=REF;
          oldRecheck.rechecked_at=REF;
          oldRecheck.release_id=RELEASE;
          oldRecheck.base_main_sha=BASE;
          oldRecheck.notes=[...(Array.isArray(oldRecheck.notes)?oldRecheck.notes:[]),'2026-09-07: 防衛省はくおうⅡ現行支援、厚労省9月4日更新を追加確認。予定期間のみのCURRENT推定は行わない。'];
          await writeJson(`operations/audits/national-source-recheck-${RELEASE}.json`,oldRecheck);

          const oldLedger=await readJson('operations/ledgers/refresh-20260904-2238.json');
          const sources=oldLedger.sources.map(s=>({...s,checked_at:REF}));
          const upsert=(s)=>{const i=sources.findIndex(x=>x.source_id===s.source_id);if(i>=0)sources[i]=s;else sources.push(s);};
          const shelterSource=sources.find(s=>String(s.source_id).startsWith('kumamoto-current-shelters'));
          if(shelterSource){shelterSource.source_id='kumamoto-current-shelters-0907';shelterSource.source_as_of=shelters.meta.source_last_modified||shelters.meta.fetched_at;shelterSource.checked_at=REF;}
          upsert({source_id:'mod-hakuo2-0907-current',publisher:'防衛省・自衛隊',url:'https://www.mod.go.jp/j/approach/defense/saigai/index.html',source_as_of:'2026-09-07T13:00:00+09:00',checked_at:REF});
          upsert({source_id:'kumamoto-hakuo2-0907',publisher:'熊本県',url:'https://www.pref.kumamoto.jp/soshiki/219/276703.html',source_as_of:'2026-09-07T13:00:00+09:00',checked_at:REF});
          upsert({source_id:'mhlw-response-0904',publisher:'厚生労働省',url:'https://www.mhlw.go.jp/stf/newpage_73935.html',source_as_of:'2026-09-04T00:00:00+09:00',checked_at:REF});
          const ledger={...oldLedger,update_id:`refresh-${RELEASE}`,release_id:RELEASE,reference_at:REF,rechecked_at:REF,page_checked_at:null,base_main_sha:BASE,expected_changed_files:[],sources,
            coverage:{...oldLedger.coverage,current_shelters:shelters.meta.current_count,current_shelter_coordinates_confirmed:shelters.shelters.filter(x=>x.coordinate_status==='confirmed').length,current_shelter_unresolved:shelters.shelters.filter(x=>x.coordinate_status==='unresolved').length,current_count:shelters.meta.current_count,unresolved_count:shelters.shelters.filter(x=>x.coordinate_status==='unresolved').length,conflict_count:shelters.shelters.filter(x=>x.coordinate_status==='conflict').length},
            snapshots:{...oldLedger.snapshots,page_reference_at:REF,current_shelters:shelters.meta.current_count,shelter_source_last_modified:shelters.meta.source_last_modified},
            accepted_unresolved:(oldLedger.accepted_unresolved||[]).filter(x=>!String(x.issue_id||'').includes('hakuo2')).map(x=>({...x,next_review_at:'2026-09-08T09:00:00+09:00'})),blocking_unresolved:[]};
          await writeJson(`operations/ledgers/refresh-${RELEASE}.json`,ledger);

          const textFiles=['scripts/sync-current-release.mjs','scripts/validate-current-state-audit.mjs','scripts/validate-dashboard-current.mjs','scripts/validate-institution-coverage.mjs','scripts/validate-national-support-audit.mjs'];
          for(const path of textFiles){
            let text=await readFile(path,'utf8');
            text=text.replaceAll(OLD_REF,REF).replaceAll(OLD_RELEASE,RELEASE).replaceAll(OLD_HUMAN,NEW_HUMAN)
              .replaceAll('2026年9月4日 22:38','2026年9月7日 15:22')
              .replaceAll('9月4日サイト全体再確認','9月7日サイト全体再確認')
              .replaceAll('9月4日22:38基準で国関係15件を再監査','9月7日15:22基準で国関係15件を再監査')
              .replaceAll('9月4日22:38までに確認できた一次情報','9月7日15:22までに確認できた一次情報')
              .replaceAll('国関係9月4日再監査','国関係9月7日再監査')
              .replaceAll('9月4日22:38愛媛県の氷川町支援を差分再監査','9月7日15:22、愛媛県9月4日12時版が最新であることを再確認');
            await writeFile(path,text,'utf8');
          }
          NODE
          node /tmp/prepare-refresh.mjs
      - name: Build generated site and update ledger changed-file seal
        env:
          BASE_MAIN_SHA: 12b6d3187e85e96070157f7ee4cfe63aed1ec705
        run: |
          set -Eeuo pipefail
          npm run build
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const path='operations/ledgers/refresh-20260907-1522.json';
          const ledger=JSON.parse(await readFile(path,'utf8'));
          const changed=execFileSync('git',['diff','--name-only',process.env.BASE_MAIN_SHA,'--'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          if(!changed.includes(path)) changed.push(path);
          ledger.expected_changed_files=[...new Set(changed)].sort();
          await writeFile(path,JSON.stringify(ledger,null,2)+'\n','utf8');
          NODE
          npm run build
          npm run test:release-gate
          npm run validate:release -- --base="$BASE_MAIN_SHA" --ledger=operations/ledgers/refresh-20260907-1522.json
          git diff --check
      - name: Commit generated audited refresh and remove helper workflow
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/refresh-helper-20260907.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: refresh Kumamoto support dashboard to 2026-09-07'
          git push origin HEAD:audit/timepoint-20260907-1522
