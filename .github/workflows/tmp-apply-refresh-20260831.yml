name: Temporary apply full timepoint refresh 20260831

on:
  push:
    branches:
      - audit/timepoint-20260831-1416
    paths:
      - .github/workflows/tmp-apply-refresh-20260831.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Fetch latest official current-shelter candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run update:current-shelters -- --dry-run --candidate-output /tmp/current-shelters-candidate.json
          node scripts/validate-current-shelters.mjs --candidate=/tmp/current-shelters-candidate.json
          cp /tmp/current-shelters-candidate.json current-shelters.json
      - name: Apply audited 2026-08-31 point-in-time changes
        run: node scripts/tmp-apply-refresh-20260831.mjs
      - name: Normalize already-adjudicated Sasebo compact sender
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const write=(p,x)=>writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          const manifest=read('sender-municipality-audit.json');
          let removed=0;
          for(const p of manifest.entity_files.filter(p=>p!=='sender-audit/timepoint-20260831-additions.json')){
            const x=read(p);
            if(!Array.isArray(x.compact_entities)) continue;
            const before=x.compact_entities.length;
            x.compact_entities=x.compact_entities.filter(row=>!(row?.[0]==='長崎県'&&row?.[1]==='佐世保市'));
            const delta=before-x.compact_entities.length;
            if(delta){ removed+=delta; write(p,x); }
          }
          if(removed!==1) throw new Error(`佐世保市 compact sender expected 1, removed ${removed}`);
          const {loadSenderAudit,senderSummary}=await import('./scripts/sender-coverage-lib.mjs');
          const ss=senderSummary(loadSenderAudit());
          const m=read('sender-municipality-audit.json');
          m.summary.ehime.states=ss.ehime.states;
          m.summary.nationwide.prefecture_discovery_checked=ss.prefecturesChecked;
          m.summary.nationwide.discovered_basic_municipality_senders=ss.nationwide.entities;
          m.summary.nationwide.adjudicated_basic_municipality_senders=ss.nationwide.entities;
          m.summary.nationwide.source_mentions=ss.sourceMentions;
          m.summary.nationwide.states=ss.nationwide.states;
          m.timepoint_note='2026年8月31日14:16基準。愛媛20市町をゼロベース再確認し、全国47都道府県discoveryを再実施。予定期間到来のみではCURRENTにせず、長崎県8月31日発表で新たに発見した5市町をPLANNED追加し、既収載4市も翌日派遣予定としてPLANNEDへ更新。';
          write('sender-municipality-audit.json',m);
          const ledger=read('operations/ledgers/refresh-20260831-1416.json');
          ledger.coverage.prefecture_discovery_checked=ss.prefecturesChecked;
          ledger.coverage.sender_entities_discovered=ss.nationwide.entities;
          ledger.coverage.sender_entities_adjudicated=ss.nationwide.entities;
          ledger.coverage.sender_states=ss.nationwide.states;
          write('operations/ledgers/refresh-20260831-1416.json',ledger);
          for(const p of ['ehime_kumamoto_support_geocoded_shelters_20260802.html','public/dashboard.html']){
            let s=readFileSync(p,'utf8');
            s=s.replaceAll('新規6基礎自治体をPLANNED追加。既存3市も翌日派遣予定をPLANNEDへ更新。','新規5基礎自治体をPLANNED追加。既存4市も翌日派遣予定をPLANNEDへ更新。');
            s=s.replaceAll('翌日派遣6新規市町','翌日派遣5新規市町');
            writeFileSync(p,s);
          }
          console.log(JSON.stringify({removedCompactSasebo:removed,senderSummary:ss},null,2));
          NODE
      - name: Advance exact volunteer reference-date assertion
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate-volunteer-data.mjs')
          s=p.read_text()
          old='assert(data.meta.reference_at.startsWith("2026-08-30"),"ボランティア情報の基準日が2026-08-30ではありません");'
          new='assert(data.meta.reference_at.startsWith("2026-08-31"),"ボランティア情報の基準日が2026-08-31ではありません");'
          if old not in s:
              raise SystemExit('expected volunteer reference-date assertion not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Align post-deploy smoke with refreshed page wording
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/post-deploy-pages-smoke.yml')
          s=p.read_text()
          s=s.replace('8/30ははくおう2宿泊支援をCURRENT','8/31もはくおう2宿泊支援をCURRENT')
          s=s.replace('8月30日実働主体を再監査','8月31日実働主体を再監査')
          p.write_text(s)
          PY
      - name: Build and run all content gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build
          npm run test:release-gate
      - name: Remove temporary diagnostics and finalize ledger changed-file set
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=1
          rm -f .github/workflows/tmp-timepoint-audit-20260831.yml \
                .github/workflows/tmp-inspect-targets-20260831.yml \
                .github/workflows/tmp-apply-refresh-20260831.yml \
                scripts/tmp-apply-refresh-20260831.mjs
          mapfile -t tracked < <(git diff --name-only origin/main)
          mapfile -t untracked < <(git ls-files --others --exclude-standard)
          printf '%s\n' "${tracked[@]}" "${untracked[@]}" | sed '/^$/d' | sort -u > /tmp/expected-files.txt
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='operations/ledgers/refresh-20260831-1416.json';
          const ledger=JSON.parse(readFileSync(path,'utf8'));
          ledger.expected_changed_files=readFileSync('/tmp/expected-files.txt','utf8').trim().split(/\r?\n/u).filter(Boolean);
          writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          console.log(JSON.stringify({expectedChangedFiles:ledger.expected_changed_files},null,2));
          NODE
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: full timepoint refresh at 2026-08-31 14:16 JST'
      - name: Run final release gate against latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run validate:release -- --ledger=operations/ledgers/refresh-20260831-1416.json --base=origin/main --head=HEAD --require-ledger-if-data-change
          npm run validate:institution-coverage
          npm run validate:sender-coverage
          npm run validate:sender-dist
      - name: Publish clean data-only transport commit
        shell: bash
        env:
          FINAL_BRANCH: audit/timepoint-20260831-1416-final
        run: |
          set -Eeuo pipefail
          parent="$(git rev-parse origin/main)"
          git checkout origin/main -- .github/workflows/post-deploy-pages-smoke.yml
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='operations/ledgers/refresh-20260831-1416.json';
          const ledger=JSON.parse(readFileSync(path,'utf8'));
          ledger.expected_changed_files=ledger.expected_changed_files.filter(p=>p!=='.github/workflows/post-deploy-pages-smoke.yml');
          writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
          git add -A
          tree_sha="$(git write-tree)"
          transport_commit="$(printf '%s\n' 'data: transport validated 2026-08-31 refresh' | git commit-tree "$tree_sha" -p "$parent")"
          echo "TRANSPORT_COMMIT=${transport_commit}"
          npm run validate:release -- --ledger=operations/ledgers/refresh-20260831-1416.json --base=origin/main --head="$transport_commit" --require-ledger-if-data-change
          git push origin "$transport_commit:refs/heads/${FINAL_BRANCH}"
