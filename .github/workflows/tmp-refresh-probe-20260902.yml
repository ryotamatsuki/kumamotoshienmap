name: Temporary 2026-09-02 refresh probe

on:
  push:
    branches:
      - audit/timepoint-20260902-1616
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh current shelters
        run: npm run update:current-shelters
      - name: Validate current shelters
        run: npm run validate:current-shelters
      - name: Probe official source URLs and audit digest
        run: node scripts/tmp-source-probe-20260902.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-probe-20260902-${{ github.run_id }}
          path: |
            current-shelters.json
            /tmp/source-probe-20260902.json
            /tmp/audit-digest-20260902.json
          if-no-files-found: error
      - name: Commit refreshed current shelters
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-shelters.json
          if git diff --cached --quiet; then
            echo "No current-shelter changes"
            exit 0
          fi
          git commit -m "data: refresh current shelters for 2026-09-02 audit"
          git push origin HEAD:audit/timepoint-20260902-1616
