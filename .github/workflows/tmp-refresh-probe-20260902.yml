name: Temporary 2026-09-02 full refresh finalizer

on:
  push:
    branches:
      - audit/timepoint-20260902-1616

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh official current shelters
        run: |
          set -Eeuo pipefail
          npm run update:current-shelters
          npm run validate:current-shelters

      - name: Apply 2026-09-02 full refresh
        run: |
          set -Eeuo pipefail
          node scripts/tmp-source-probe-20260902.mjs

      - name: Normalize validators and live shelter timestamp
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const patch=(path,fn)=>{const before=readFileSync(path,'utf8');const after=fn(before);writeFileSync(path,after);console.log(JSON.stringify({path,changed:before!==after}));};
          patch('scripts/validate-dashboard-current.mjs',text=>text
            .replaceAll('9月1日閣議の非常災害復旧復興本部設置を確認し、9月1日実働主体を再監査','9月1日設置の非常災害復旧復興本部を確認し、9月2日実働主体を再監査')
            .replaceAll('2026年9月1日 15:04','2026年9月2日 16:16')
            .replaceAll('国交省第51報（8/31 17:00）を最新インフラ履歴として確認。はくおうIIは9/3宿泊分の予約受付をCURRENT、宿泊実施はPLANNED','国交省第51報（8/31 17:00）を最新インフラ履歴として確認。はくおうIIは予約受付終了、9/3宿泊実施はPLANNED')
            .replace('assert.equal(runtime.TIMELINE_EVENTS.find((event) => event.id === "t-current-status").date, "2026-08-28"','assert.equal(runtime.TIMELINE_EVENTS.find((event) => event.id === "t-current-status").date, "2026-09-02"'));
          patch('scripts/sync-national-support-audit.mjs',text=>text
            .replace('date:"2026-08-28",dateLabel:"8月28日",weekday:"金",time:"08:00"','date:"2026-09-02",dateLabel:"9月2日",weekday:"水",time:"14:00"'));
          for (const path of ['ehime_kumamoto_support_geocoded_shelters_20260802.html','public/dashboard.html']) {
            patch(path,text=>text
              .replaceAll('熊本県第49報（8月28日8時）では避難所61か所、避難者2,442人。現行公式避難所JSONは取得時点の開設施設を別定義で表示する。','熊本県第51報（9月2日14時）では避難所38か所、避難者2,035人。現行公式避難所JSONは取得時点の開設施設を別定義で表示する。')
              .replaceAll('熊本県第49報では住家被害43,292棟。市町別旧スナップショットとは時点が異なるため、県計と旧内訳を分離して表示する。','熊本県第51報では住家被害61,996棟。市町別旧スナップショットとは時点が異なるため、県計と旧内訳を分離して表示する。')
              .replaceAll('熊本県第49報では住家被害43,292棟。被害区分別の現況は確認できた県計の範囲を超えて推測せず、旧区分値を現況として流用しない。','熊本県第51報では住家被害61,996棟。被害区分別の現況は確認できた県計の範囲を超えて推測せず、旧区分値を現況として流用しない。')
              .replaceAll('"id":"t-current-status","date":"2026-08-28","dateLabel":"8月28日","weekday":"金","time":"08:00"','"id":"t-current-status","date":"2026-09-02","dateLabel":"9月2日","weekday":"水","time":"14:00"')
              .replaceAll('"title":"熊本県第49報で被害・避難状況を更新"','"title":"熊本県第51報で被害・避難状況を更新"')
              .replaceAll('"summary":"避難者2,442人、開設避難所61か所、人的被害402人、住家被害43,292棟。"','"summary":"避難者2,035人、開設避難所38か所、人的被害404人、住家被害61,996棟。"')
              .replaceAll('"detail":"熊本県第49報（8月28日8時現在）の県全体値。市町別旧スナップショットは時点が異なるため、第49報の県計へ機械的に再配分しない。現行公式避難所JSONは別定義・別時点で表示。"','"detail":"熊本県第51報（9月2日14時現在）の県全体値。市町別旧スナップショットは時点が異なるため、第51報の県計へ機械的に再配分しない。現行公式避難所JSONは別定義・別時点で表示。"')
              .replaceAll('"sourceLabel":"熊本県 被害情報 第49報"','"sourceLabel":"熊本県 被害情報 第51報"')
              .replaceAll('"tags":["熊本県第49報","8月28日8時","最新確認"]','"tags":["熊本県第51報","9月2日14時","最新確認"]'));
          }
          const shelters=JSON.parse(readFileSync('current-shelters.json','utf8'));
          const sourceAt=shelters.meta.source_last_modified;
          patch('.github/workflows/post-deploy-pages-smoke.yml',text=>text
            .replaceAll('2026-09-02T15:42:44+09:00',sourceAt)
            .replaceAll('2026-09-01T14:56:29+09:00',sourceAt));
          const ledgerPath='operations/ledgers/refresh-20260902-1616.json';
          const ledger=JSON.parse(readFileSync(ledgerPath,'utf8'));
          const shelterSource=ledger.sources.find(source=>source.source_id==='kumamoto-current-shelters-0902');
          if(shelterSource)shelterSource.source_as_of=sourceAt;
          ledger.snapshots.shelter_source_last_modified=sourceAt;
          ledger.snapshots.current_shelters=shelters.meta.current_count;
          ledger.coverage.current_shelters=shelters.meta.current_count;
          ledger.coverage.current_shelter_coordinates_confirmed=shelters.shelters.filter(row=>row.coordinate_status==='confirmed').length;
          ledger.coverage.current_count=shelters.meta.current_count;
          writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+'\n');
          console.log(JSON.stringify({liveShelterSourceLastModified:sourceAt,currentShelters:shelters.meta.current_count}));
          NODE

      - name: Build and run semantic gates
        run: |
          set -Eeuo pipefail
          npm run build
          npm run test:release-gate
          npm run validate:ehime-sender-coverage
          npm run validate:nationwide-sender-coverage
          npm run validate:sender-source-mentions

      - name: Remove temporary machinery and finalize ledger
        run: |
          set -Eeuo pipefail
          rm scripts/tmp-source-probe-20260902.mjs .github/workflows/tmp-refresh-probe-20260902.yml
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const base='62e4c9c805ba0c2333d44b10706b0cf30d59041e';
          const ledgerPath='operations/ledgers/refresh-20260902-1616.json';
          const ledger=JSON.parse(readFileSync(ledgerPath,'utf8'));
          let files=execFileSync('git',['-c','core.quotePath=false','diff','--name-only',base],{encoding:'utf8'}).trim().split(/\r?\n/u).filter(Boolean);
          files=files.filter(p=>!['scripts/tmp-source-probe-20260902.mjs','.github/workflows/tmp-refresh-probe-20260902.yml'].includes(p));
          files=[...new Set([...files,ledgerPath])].sort();
          ledger.expected_changed_files=files;
          writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+'\n');
          console.log(JSON.stringify({expectedChangedFiles:files.length,files}));
          NODE

      - name: Create local final-head commit
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "data: full timepoint refresh at 2026-09-02 16:16 JST"

      - name: Full Release Gate on final head
        run: |
          set -Eeuo pipefail
          npm run validate:release -- --base=62e4c9c805ba0c2333d44b10706b0cf30d59041e --ledger=operations/ledgers/refresh-20260902-1616.json
          git diff --check 62e4c9c805ba0c2333d44b10706b0cf30d59041e...HEAD
          test ! -e scripts/tmp-source-probe-20260902.mjs
          test ! -e .github/workflows/tmp-refresh-probe-20260902.yml

      - name: Push validated final head
        run: git push origin HEAD:audit/timepoint-20260902-1616
