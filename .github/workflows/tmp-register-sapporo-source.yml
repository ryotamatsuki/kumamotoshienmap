name: Temporary register Sapporo source

on:
  push:
    branches:
      - audit/timepoint-20260825-1408
    paths:
      - .github/workflows/tmp-register-sapporo-source.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260825-1408
          fetch-depth: 0
      - name: Register source and repair semantic validation
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='municipal-support-audit.json';
          const a=JSON.parse(fs.readFileSync(p,'utf8'));
          const source={source_id:'sapporo-current',name:'札幌市 令和8年熊本地震に伴う札幌市の対応',role:'dispatch_origin_official',url:'https://www.city.sapporo.jp/kinkyu/202607_kumamotojishin.html',as_of:'2026-08-10',checked_at:'2026-08-25T14:36:00+09:00',rechecked_at:'2026-08-25T15:17:00+09:00',primary:true,note:'8月10日更新で罹災証明発行支援の職員4名が熊本市で従事開始と確認。8月25日基準の継続・終了を直接示す更新は未確認のためUNKNOWN根拠として使用。'};
          const i=a.sources.findIndex(x=>x.source_id===source.source_id);if(i>=0)a.sources[i]={...a.sources[i],...source};else a.sources.push(source);
          fs.writeFileSync(p,JSON.stringify(a,null,2)+'\n');
          const v='scripts/validate-municipal-support-audit.mjs';
          let s=fs.readFileSync(v,'utf8');
          s=s.replace("assert.ok(html.includes('同一定義の基準日時点総数はUNKNOWN') || html.includes('同一定義の8月25日総数はUNKNOWN'),'8月19日行政応援総数が現況値として残っています');","assert.ok(audit.records.flatMap((r)=>[...(r.provider_statuses||[]),...(r.additional_statuses||[])]).some((x)=>x.state==='UNKNOWN'),'UNKNOWN裁定が構造化データにありません');\nassert.ok(html.includes('8月19日行政応援971人は履歴スナップショット'),'8月19日行政応援971人を履歴として分離していません');");
          fs.writeFileSync(v,s);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add municipal-support-audit.json scripts/validate-municipal-support-audit.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'test: validate municipal UNKNOWN semantics'
            git push origin HEAD:audit/timepoint-20260825-1408
          fi
