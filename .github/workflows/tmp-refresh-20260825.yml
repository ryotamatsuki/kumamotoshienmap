name: Temporary live shelter refresh

on:
  push:
    branches:
      - audit/timepoint-20260825-1408

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260825-1408
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Fetch and validate candidate
        run: |
          set -Eeuo pipefail
          npm run update:current-shelters -- --dry-run --candidate-output /tmp/current-shelters-candidate.json
          node scripts/validate-current-shelters.mjs --candidate=/tmp/current-shelters-candidate.json
      - name: Refresh production current shelters
        run: npm run update:current-shelters
      - name: Commit refreshed official snapshot
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add current-shelters.json
          if git diff --cached --quiet; then
            echo 'No current-shelter change.'
            exit 0
          fi
          git commit -m 'data: refresh current shelters from official JSON'
          git push origin HEAD:audit/timepoint-20260825-1408
