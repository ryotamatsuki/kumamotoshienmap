name: Recover audited core refresh 20260915
on:
  push:
    branches: [audit/timepoint-20260915-0028]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260915-0028
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Reapply audited patch and fix overview compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import subprocess, textwrap, pathlib, json
          raw=subprocess.check_output(['git','show','2a7e0136b863bcaf786a70f79f51b243ee92ce9a:.github/workflows/apply-core-refresh-20260915.yml'],text=True)
          start=raw.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=raw.index("\n          PY\n",start)
          body=textwrap.dedent(raw[start:end])
          exec(compile(body,'recovered-core-refresh.py','exec'),{'__name__':'__main__'})
          root=pathlib.Path('.')
          p=root/'operations/audits/ehime-source-recheck-20260915-0105.json'
          a=json.loads(p.read_text(encoding='utf-8'))
          a['human_support']={
            'total':{'persons':283,'person_days':1396},
            'counterpart_support':{'persons':109,'person_days':534},
            'public_health':{'persons':33,'person_days':178,'planned_through':None},
            'dwat':{'persons':34,'person_days':96,'planned_through':None}
          }
          a['material_support']={'prefectural_large_toilet_truck':{'location':'竜北中学校','ended_on':'2026-09-07'}}
          p.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          q=root/'scripts/sync-current-overview-summary.mjs'
          s=q.read_text(encoding='utf-8')
          old='const line1 = `対口支援${counterpart.persons}人（県${counterpart.prefecture_persons}・市町${counterpart.municipal_persons}）、延${Number(counterpart.person_days).toLocaleString("ja-JP")}人日。災害応急対策職員は終期未定`;'
          new='const split = Number.isFinite(Number(counterpart.prefecture_persons)) && Number.isFinite(Number(counterpart.municipal_persons)) ? `（県${counterpart.prefecture_persons}・市町${counterpart.municipal_persons}）` : "";\n  const line1 = `対口支援${counterpart.persons}人${split}、延${Number(counterpart.person_days).toLocaleString("ja-JP")}人日。災害応急対策職員は最新資料で継続確認`;'
          if old not in s: raise SystemExit('overview line1 target missing')
          s=s.replace(old,new,1)
          q.write_text(s,encoding='utf-8')
          for f in ['operations/.core-refresh-trigger-20260915','operations/.refresh-trigger-20260915']:
            pathlib.Path(f).unlink(missing_ok=True)
          PY
      - name: Build and run all core gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build
          npm run validate:release
          npm run test:release-gate
      - name: Commit core refresh and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/recover-core-refresh-20260915.yml
          git add -A
          git commit -m 'data: refresh Kumamoto support dashboard for 2026-09-15'
          git push origin HEAD:audit/timepoint-20260915-0028
