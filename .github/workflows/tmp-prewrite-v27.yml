name: Temporary prewrite operation v2.7
on:
  push:
    branches:
      - fix/page-snapshot-consistency-20260902
permissions:
  contents: write
jobs:
  update-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/page-snapshot-consistency-20260902
      - name: Record current snapshot consistency gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('時点修正更新オペレーション.md')
          s=p.read_text()
          if '> Version 2.7（2026-09-02改訂）' not in s:
              version='''> Version 2.7（2026-09-02改訂）
>
> Version 2.6までのGate・監査・sender coverage・Pages Production QAをすべて維持する。
>
> Version 2.7では、同一ページ内で「最新」として表示する被害・避難スナップショットをrelease ledgerと一致させる **Current Snapshot Consistency Gate** を追加する。タイムラインだけ更新して再確認サマリー、Overview、Map、Needs等が旧報のまま残る更新を禁止する。
>
'''
              s=s.replace('> Version 2.6（2026-08-27改訂）',version+'> Version 2.6（2026-08-27改訂）',1)
          gate='''### 16.1 同一ページ Current Snapshot Consistency Gate（Version 2.7追加）

最新被害・避難スナップショットのcanonical基準は、当該releaseの `operations/ledgers/refresh-*.json` にある `reference_at`、`snapshots.damage_report`、`snapshots.damage_source_as_of` とする。

次のCURRENT／「直近」表示は、同じ報番号・同じ県全体値へ揃わなければならない。

- Overviewの被害・避難KPI（避難者、人的被害、住家被害）
- `PAGE_RECHECK_META` の「被害・支援」「避難所」「支援ニーズ見通し」「発災後タイムライン」「支援ダッシュボード」
- 発災後タイムライン上部の「ページ全体再確認」表示
- `TIMELINE_EVENTS` の `t-current-status`（title / summary / sourceLabel / tags）
- Needsの県全体被害・避難観測値
- Mapの県報スナップショットと県報由来metric
- decision board等で「現在の判断根拠」として示す県全体値

現行避難所公式JSONは県報とは別定義・別時点であるため、`current_shelters` を県報避難所数へ合わせてはならない。両者を併記する場合は「県報スナップショット」と「公式JSON現在」を明示して分離する。

市町別内訳等で新しい同一定義資料を取得できない場合、旧資料を残すことは許容する。ただし必ず「旧スナップショット」「HISTORICAL」「時点が異なる」等を明示し、`直近`、`最新`、`CURRENT`として表示してはならない。旧市町別値を新しい県計へ機械的に再配分しない。

producer isolationを守る。`sync:municipal-support`、`sync:national-support` 等の個別監査syncが、自分の担当外である被害報番号・被害一次情報URL・他sectionのrecheck metadataを旧値へ書き戻してはならない。やむを得ずcurrent damage overlayを生成する処理は、必ずrelease ledgerと同値でなければならない。

`renderPageRecheck()` 等のrendererへ報番号や県報件数をhard-codeしてはならない。rendererはcanonical metadataを表示するだけとし、報番号・件数の意味論を別経路で上書きしない。

`npm run build` 内の `validate:dashboard` は、effective runtime data、初期表示HTML、release ledgerを相互比較し、上記のいずれかが不一致ならFAILする。時刻だけ一致していてもsemantic snapshotが不一致ならRelease Gateは通さない。

PR前に最低限、次を確認する。

```sh
npm run build
npm run validate:dashboard
npm run validate:current-state
npm run validate:timeline
npm run test:release-gate
npm run validate:release
git diff --check
```

Pages反映後はDesktop 1440×1000、Mobile 390×844の双方で、Overview → 発災後タイムライン → Needs → Mapを実際に切り替え、同じ最新県報番号がcurrent表示面で維持されていることを確認する。

'''
          if '### 16.1 同一ページ Current Snapshot Consistency Gate（Version 2.7追加）' not in s:
              s=s.replace('## 17. Sender Gate自己破壊テスト',gate+'## 17. Sender Gate自己破壊テスト',1)
          p.write_text(s)
          PY
          git diff --check
          if git diff --quiet; then
            echo 'Operation v2.7 already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '時点修正更新オペレーション.md'
          git commit -m 'docs: add current snapshot consistency gate'
          git push origin HEAD:fix/page-snapshot-consistency-20260902
