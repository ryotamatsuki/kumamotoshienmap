name: Temporary finalize timepoint 20260904

on:
  push:
    branches:
      - audit/timepoint-20260904-1509
    paths:
      - 'scripts/temp-finalize-timepoint-20260904.mjs'
      - '.github/workflows/temp-finalize-timepoint-20260904.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[finalize-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260904-1509
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install npm metadata
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Refresh live current shelters
        run: |
          set -Eeuo pipefail
          npm run update:current-shelters
          npm run validate:current-shelters
      - name: Apply audited 2026-09-04 release
        run: node scripts/temp-finalize-timepoint-20260904.mjs
      - name: Align final release overlay and validation wording
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          const syncPath='scripts/sync-current-release.mjs';
          let sync=readFileSync(syncPath,'utf8');
          const wordingMarker="html=html.replaceAll('旧割当履歴＋9月3日14:57個別再監査'";
          if (!sync.includes(wordingMarker)) throw new Error('sync-current-release wording marker not found');
          sync=sync.replace(wordingMarker,"html=html.replaceAll('9月4日22:38に対口支援・他自治体支援を全件再監査','9月3日14:57全件再監査を基礎に、9月4日22:38愛媛県差分を再監査').replaceAll('旧割当履歴＋9月3日14:57個別再監査'");
          const writeMarker="await writeFile(SOURCE,html,'utf8');";
          if (!sync.includes(writeMarker)) throw new Error('sync-current-release write marker not found');
          const overlayCode=`const finalOverlay=cs+'\\n{const event=TIMELINE_EVENTS.find(item=>item.id==="t-current-status");if(event)Object.assign(event,{date:"2026-09-03",dateLabel:"9月3日",weekday:"木",time:"14:00",phase:"recovery",actor:"kumamoto",title:"熊本県第52報で被害・避難状況を更新",summary:"避難者2,000人、開設避難所38か所、人的被害404人、住家被害63,878棟。",detail:"熊本県第52報（9月3日14時現在）の県全体値。市町別旧スナップショットは時点が異なるため、第52報の県計へ機械的に再配分しない。現行公式避難所JSONは別定義・別時点で表示。",place:"熊本県内",sourceLabel:"熊本県 被害情報 第52報",sourceUrl:"https://www.pref.kumamoto.jp/soshiki/222/276831.html",recordIds:["national-water","national-tec","national-medical","national-cert"],hubIds:["kumamoto-hq","yatsushiro","uto","uki","misato","hikawa"],tags:["熊本県第52報","9月3日14時","最新確認"]});}\\n{const item=PROVINCE_NEEDS.find(value=>value.id==="p-shelter");if(item)item.observed="熊本県第52報（9月3日14時）では避難所38か所、避難者2,000人。現行公式避難所JSONは取得時点の開設施設を別定義で表示する。";}\\n{const item=PROVINCE_NEEDS.find(value=>value.id==="p-admin");if(item)item.observed="熊本県第52報では住家被害63,878棟。市町別旧スナップショットとは時点が異なるため、県計と旧内訳を分離して表示する。";}\\n{const item=PROVINCE_NEEDS.find(value=>value.id==="p-housing");if(item)item.observed="熊本県第52報では住家被害63,878棟。被害区分別の現況は確認できた県計の範囲を超えて推測せず、旧区分値を現況として流用しない。";}\\nif(typeof PAGE_RECHECK_META!=="undefined"){PAGE_RECHECK_META.checkedAt="2026-09-04T22:38:00+09:00";PAGE_RECHECK_META.volunteerCheckedAt="2026-09-02T16:35:00+09:00";}\\n'+ce;const mend=html.indexOf('/* MUNICIPAL_SUPPORT_AUDIT_END */');if(mend<0)throw new Error('municipal audit end missing for final overlay');html=html.slice(0,mend)+'\\n'+finalOverlay+'\\n'+html.slice(mend);`;
          sync=sync.replace(writeMarker,overlayCode+writeMarker);
          writeFileSync(syncPath,sync);

          const validatorPath='scripts/validate-dashboard-current.mjs';
          let validator=readFileSync(validatorPath,'utf8');
          validator=validator
            .replaceAll('9月3日14:57全件再監査を基礎に、9月4日22:38愛媛県差分を再監査','9月3日14:57全件再監査を基礎に、9月4日22:38愛媛県の氷川町支援を差分再監査')
            .replaceAll('9月1日設置の非常災害復旧復興本部を確認し、9月4日国関係主体を再監査','9月4日22:38基準で国関係15件を再監査');
          writeFileSync(validatorPath,validator);
          NODE
      - name: Build and validate generated site
        run: |
          set -Eeuo pipefail
          npm run build
          npm run validate:sender-coverage
          npm run test:release-gate
      - name: Remove temporary audit/probe machinery
        run: |
          set -Eeuo pipefail
          git rm -f \
            .github/workflows/temp-link-probe-20260904.yml \
            .github/workflows/temp-pdf-stage-20260904.yml \
            .github/workflows/temp-pdf-text-20260904.yml \
            .github/workflows/temp-source-probe-20260904.yml \
            .github/workflows/temp-finalize-timepoint-20260904.yml \
            scripts/temp-link-probe-20260904.mjs \
            scripts/temp-source-probe-20260904.mjs \
            scripts/temp-finalize-timepoint-20260904.mjs \
            operations/audits/temp-ehime-support-20260903.pdf \
            operations/audits/temp-kumamoto-damage52-20260904.pdf \
            operations/audits/temp-link-probe-20260904.json \
            operations/audits/temp-pdf-text-20260904.txt \
            operations/audits/temp-source-probe-20260904.json
      - name: Commit canonical release content
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finalize 2026-09-04 timepoint refresh [finalize-result]'
      - name: Finalize ledger changed-file manifest
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main --prune
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='operations/ledgers/refresh-20260904-2238.json';
          const ledger=JSON.parse(readFileSync(path,'utf8'));
          const files=execFileSync('git',['diff','--name-only','origin/main...HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean).sort();
          ledger.expected_changed_files=files;
          ledger.base_main_sha=execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim();
          writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
          git add operations/ledgers/refresh-20260904-2238.json
          git commit -m 'chore: seal 2026-09-04 release ledger [finalize-result]'
      - name: Push finalized branch
        run: git push origin HEAD:audit/timepoint-20260904-1509
      - name: Rebuild reproducibly from committed inputs
        run: |
          set -Eeuo pipefail
          npm run build
          if ! git diff --quiet; then
            echo 'Build rewrote tracked files:'
            git status --short
            git diff --stat
            exit 1
          fi
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Run final Release Gate
        run: |
          set -Eeuo pipefail
          npm run validate:ehime-sender-coverage
          npm run validate:nationwide-sender-coverage
          npm run validate:sender-source-mentions
          npm run validate:sender-coverage
          npm run validate:sender-dist
          npm run test:release-gate
          npm run validate:release -- --base=origin/main --ledger=operations/ledgers/refresh-20260904-2238.json --require-ledger-if-data-change
          git diff --check origin/main...HEAD
