name: Temporary finalize v2.5 refresh

on:
  push:
    branches:
      - audit/timepoint-20260825-1408
    paths:
      - .github/workflows/tmp-finalize-refresh-20260825.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260825-1408
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Apply final v2.5 adjudication and closure
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const REF='2026-08-25T14:08:00+09:00';
          const CHECK='2026-08-25T15:17:00+09:00';
          const BASE='9e06e30f1ecb0f2be9dff6a7620851fb77f6a73f';
          const RELEASE='20260825-1408';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>{fs.mkdirSync(require('path').dirname(p),{recursive:true});fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');};
          const uniq=a=>[...new Set(a.filter(Boolean))];

          const m=read('municipal-support-audit.json');
          const n=read('national-support-audit.json');
          m.rechecked_at=CHECK;n.rechecked_at=CHECK;
          for(const s of m.sources||[])s.rechecked_at=CHECK;
          for(const s of n.sources||[])s.rechecked_at=CHECK;

          const hSource={source_id:'kumamoto-hakuo2-0823',publisher:'熊本県',kind:'official_web',url:'https://www.pref.kumamoto.jp/soshiki/219/276703.html',source_as_of:'2026-08-23T00:00:00+09:00',source_published_at:'2026-08-23T00:00:00+09:00',source_updated_at:'2026-08-23T00:00:00+09:00',fetched_at:CHECK,checked_at:CHECK,rechecked_at:CHECK,primary:true,notes:'防衛省フェリー「はくおう2」の宿泊支援は8月26日13時開始。基準日時点ではPLANNED。'};
          const hi=n.sources.findIndex(x=>x.source_id===hSource.source_id); if(hi>=0)n.sources[hi]={...n.sources[hi],...hSource}; else n.sources.push(hSource);
          const hRecord={record_id:'national-accommodation-hakuo2',provider:'防衛省・自衛隊',category:'shelter',previous_snapshot:null,adjudications:[{state:'PLANNED',scope:'フェリー「はくおう2」による宿泊支援',source_as_of:'2026-08-23T00:00:00+09:00',source_ids:['kumamoto-hakuo2-0823'],notes:'予約受付は8月25日正午まで、乗船開始は8月26日13時。基準14:08時点では支援開始前のためPLANNED。'}],state:'PLANNED',source_ids:['kumamoto-hakuo2-0823'],display:{status:'PLANNED',scale:'8/26 13:00から2泊3日の宿泊支援',period:'2026年8月26日13:00～8月28日10:00',detail:'八代港停泊中のフェリー「はくおう2」で食事・入浴付き2泊3日の宿泊支援を実施予定。8月25日14:08時点では乗船開始前のためCURRENTへ推定昇格しない。',asOf:'熊本県 2026年8月23日更新・8月25日再確認',sourceLabel:'熊本県 防衛省フェリー「はくおう2」宿泊支援',sourceUrl:'https://www.pref.kumamoto.jp/soshiki/219/276703.html'},notes:'活動開始前の予定支援として独立表示。'};
          const hr=n.records.findIndex(x=>x.record_id===hRecord.record_id); if(hr>=0)n.records[hr]=hRecord; else n.records.push(hRecord);
          n.inventory.generated_record_ids=uniq([...(n.inventory.generated_record_ids||[]),hRecord.record_id]);
          n.inventory.audit_record_count=n.records.length;
          n.summary={...n.summary,records_total:n.records.length};
          for(const st of ['CURRENT','HISTORICAL','PLANNED','UNKNOWN','CONFLICT'])n.summary[st]=n.records.filter(r=>r.state===st).length;
          n.summary.accepted_unresolved_count=n.records.flatMap(r=>r.adjudications||[]).filter(a=>a.state==='UNKNOWN').length;
          n.summary.blocking_unresolved_count=0;
          write('municipal-support-audit.json',m);write('national-support-audit.json',n);

          let sn=fs.readFileSync('scripts/sync-national-support-audit.mjs','utf8');
          sn=sn.replaceAll('既存12件＋追加2件','既存12件＋追加3件')
               .replace("r.record_id==='national-sme-loan'?'被災中小企業向け災害融資特別措置':r.record_id","r.record_id==='national-sme-loan'?'被災中小企業向け災害融資特別措置':r.record_id==='national-accommodation-hakuo2'?'フェリー「はくおう2」宿泊支援':r.record_id");
          fs.writeFileSync('scripts/sync-national-support-audit.mjs',sn);

          let vd=fs.readFileSync('scripts/validate-dashboard-current.mjs','utf8');
          vd=vd.replace('assert.equal(auditedKumamoto.auditCheckedAt, REFERENCE_AT, "熊本市対口支援の再監査基準が不正です");','assert.equal(auditedKumamoto.auditCheckedAt, municipalAudit.checked_at, "熊本市対口支援の監査確認時刻が不正です");');
          fs.writeFileSync('scripts/validate-dashboard-current.mjs',vd);

          const cov=read('operations/audits/institution-coverage-20260825-1408.json');
          cov.checked_at=CHECK;cov.rechecked_at=CHECK;
          const housingSource={source_id:'kumamoto-housing-consult-0825',publisher:'熊本県',url:'https://www.pref.kumamoto.jp/soshiki/115/278111.html',primary:true,source_as_of:'2026-08-25T13:00:00+09:00',checked_at:CHECK,rechecked_at:CHECK};
          const oldEntries=cov.entries||[];
          const housingEntry={entity:'熊本県住宅リフォーム推進協議会',kind:'local_support_network',scope:'被災住宅の復旧・改修に関する無料電話・対面相談',state:'CURRENT',source_ids:['kumamoto-housing-consult-0825'],note:'熊本県公式ページで8月25日13時から住まいサポートダイヤル開始を確認。基準14:08時点で実施中。'};
          const ei=oldEntries.findIndex(x=>x.entity===housingEntry.entity); if(ei>=0)oldEntries[ei]=housingEntry; else oldEntries.push(housingEntry);
          cov.entries=oldEntries;
          const required=uniq([...(cov.required_entities||[]),housingEntry.entity]);
          const evidence={};
          const addEv=(sid,entities)=>{if(!sid)return; evidence[sid]=uniq([...(evidence[sid]||[]),...entities.filter(e=>required.includes(e)||e===housingEntry.entity)]);};
          for(const r of m.records||[]){for(const st of [...(r.provider_statuses||[]),...(r.additional_statuses||[])])for(const sid of st.source_ids||[])addEv(sid,[st.name,r.destination]);}
          const activeVC=['熊本市','八代市','宇土市','宇城市','美里町','御船町','嘉島町','益城町','甲佐町','氷川町','芦北町'];
          addEv('kumamoto-volunteer-0824',activeVC.flatMap(x=>[x,`${x}社会福祉協議会`]));
          const canonical=['内閣府','政府非常災害現地対策本部','総務省','消防庁','国土交通省','TEC-FORCE','厚生労働省','防衛省','自衛隊','警察庁','財務省','経済産業省','環境省','水資源機構','日本水道協会','日本行政書士会連合会','熊本県行政書士会','DHEAT','DMAT','DPAT','DWAT','災害支援ナース','日本赤十字社','JMAT','JRAT','日本薬剤師会','熊本県薬剤師会','福岡県薬剤師会','宮崎県薬剤師会'];
          for(const r of n.records||[]){const ents=canonical.filter(x=>String(r.provider||'').includes(x));for(const sid of r.source_ids||[])addEv(sid,ents);}
          for(const a of n.agency_coverage||[])for(const sid of a.source_ids||[])addEv(sid,canonical.filter(x=>String(a.agency||'').includes(x)));
          addEv('kumamoto-housing-consult-0825',['熊本県',housingEntry.entity]);
          addEv('kumamoto-hakuo2-0823',['熊本県','防衛省','自衛隊']);
          const sourceMentions=uniq(Object.values(evidence).flat()).sort();
          const adjudicated=uniq(cov.entries.map(x=>x.entity));
          const finalRequired=uniq([...required,...sourceMentions]).sort();
          const missing=finalRequired.filter(x=>!adjudicated.includes(x));
          const unadj=sourceMentions.filter(x=>!adjudicated.includes(x));
          if(missing.length||unadj.length)throw new Error('coverage closure failed: '+JSON.stringify({missing,unadj}));
          cov.required_entities=finalRequired;cov.source_mentions=sourceMentions;cov.adjudicated_entities=adjudicated.sort();
          cov.source_mention_evidence=evidence;
          cov.missing_entities=[];cov.unadjudicated_source_mentions=[];cov.blocking_unresolved=[];
          const sourceMap=new Map();
          for(const s of [...(m.sources||[]),...(n.sources||[]),housingSource]){if(!s.source_id||!s.url)continue;sourceMap.set(s.source_id,{source_id:s.source_id,publisher:s.publisher||s.name||null,url:s.url,primary:s.primary!==false,source_as_of:s.source_as_of||s.as_of||null,checked_at:s.checked_at||CHECK,rechecked_at:s.rechecked_at||CHECK});}
          cov.sources=[...sourceMap.values()];
          cov.accepted_unresolved=cov.entries.filter(x=>x.state==='UNKNOWN').map((x,i)=>({issue_id:`institution-unknown-${String(i+1).padStart(3,'0')}`,entity:x.entity,state:'UNKNOWN',reason:x.note||'基準日時点の一次情報で状態を直接確定できない。',owner:'institution-coverage',source_ids:x.source_ids||[],next_review_at:'2026-08-26T09:00:00+09:00'}));
          cov.summary={...cov.summary,entities:finalRequired.length,missing_entities:0,unadjudicated_source_mentions:0,blocking_unresolved:0,source_mention_count:sourceMentions.length,source_mention_adjudicated_count:sourceMentions.length};
          write('operations/audits/institution-coverage-20260825-1408.json',cov);

          const coverageValidator=`import{readFileSync}from'node:fs';import{resolve,dirname}from'node:path';import{fileURLToPath}from'node:url';const R=resolve(dirname(fileURLToPath(import.meta.url)),'..'),a=JSON.parse(readFileSync(resolve(R,'operations/audits/institution-coverage-20260825-1408.json'),'utf8'));const U=x=>new Set(x||[]),req=U(a.required_entities),adj=U(a.adjudicated_entities),mentions=U(a.source_mentions);const miss=[...req].filter(x=>!adj.has(x)),unadj=[...mentions].filter(x=>!adj.has(x)),outside=[...mentions].filter(x=>!req.has(x));if(miss.length)throw new Error('required_entities - adjudicated_entities: '+miss.join(','));if(unadj.length)throw new Error('source_mentions - adjudicated_entities: '+unadj.join(','));if(outside.length)throw new Error('source_mentions outside required_entities: '+outside.join(','));for(const k of ['missing_entities','unadjudicated_source_mentions','blocking_unresolved'])if((a[k]||[]).length)throw new Error(k+' must be empty');if(a.summary.municipalities!==45||a.summary.social_welfare_councils!==45)throw new Error('45 municipalities/councils gate');const ids=new Set((a.sources||[]).map(s=>s.source_id));for(const [sid,entities] of Object.entries(a.source_mention_evidence||{})){if(!ids.has(sid))throw new Error('source mention evidence missing source '+sid);for(const e of entities)if(!req.has(e)||!adj.has(e))throw new Error('unclosed source mention '+sid+'/'+e);}for(const x of a.accepted_unresolved||[])for(const k of ['issue_id','state','reason','owner','source_ids','next_review_at'])if(x[k]===undefined)throw new Error('accepted_unresolved metadata '+k);console.log(JSON.stringify({status:'PASS',entities:req.size,source_mentions:mentions.size,municipalities:45,councils:45,accepted_unknown:(a.accepted_unresolved||[]).length}));\n`;
          fs.writeFileSync('scripts/validate-institution-coverage.mjs',coverageValidator);

          let pkg=read('package.json');
          pkg.scripts.build=pkg.scripts.build.replace(/(npm run validate:institution-coverage &&\s*){2,}/g,'npm run validate:institution-coverage && ');
          write('package.json',pkg);

          const START='/* LOCAL_CURRENT_SUPPORT_START */',END='/* LOCAL_CURRENT_SUPPORT_END */';
          for(const path of ['ehime_kumamoto_support_geocoded_shelters_20260802.html','public/dashboard.html']){
            let h=fs.readFileSync(path,'utf8');const s=h.indexOf(START);if(s>=0){const e=h.indexOf(END,s);h=h.slice(0,s)+h.slice(e+END.length);}
            const marker='/* NATIONAL_SUPPORT_AUDIT_END */';const at=h.indexOf(marker);if(at<0)throw new Error('national marker missing');
            const record={id:'kumamoto-housing-consult',provider:'municipal',category:'housing',hubIds:['kumamoto-hq'],title:'住まいサポートダイヤル（住宅復旧・改修相談）',providers:['熊本県住宅リフォーム推進協議会'],status:'CURRENT',scale:'8/25 13:00開始・無料相談',period:'2026年8月25日～10月30日（平日）',detail:'被災住宅を対象に建築士が復旧・改修等の無料電話相談を実施。被害状況等に応じて現地での対面相談も可能。初日は8月25日13時開始で、基準14:08時点で実施中。',asOf:'熊本県 2026年8月25日更新',sourceLabel:'熊本県 建築課',sourceUrl:'https://www.pref.kumamoto.jp/soshiki/115/278111.html',auditState:'CURRENT',auditReferenceAt:REF,auditSourceIds:['kumamoto-housing-consult-0825']};
            const overlay=`\n${START}\nif(!RECORDS.some(r=>r.id==='kumamoto-housing-consult'))RECORDS.push(${JSON.stringify(record)});\n${END}`;
            h=h.slice(0,at+marker.length)+overlay+h.slice(at+marker.length);fs.writeFileSync(path,h);
          }

          const accepted=[];
          for(const r of n.records||[])for(const [i,a] of (r.adjudications||[]).entries())if(a.state==='UNKNOWN')accepted.push({issue_id:`${r.record_id}-unknown-${i+1}`,state:'UNKNOWN',reason:a.notes||'基準日時点の一次情報で同一定義状態を確定できない。',owner:'national-support-audit',source_ids:a.source_ids||[],next_review_at:'2026-08-26T09:00:00+09:00'});
          for(const x of cov.accepted_unresolved||[])accepted.push(x);
          const ledger={schema_version:2,repository:'ryotamatsuki/kumamotoshienmap',update_type:'timepoint_refresh',gate_phase:'pre_merge',update_id:'refresh-20260825-1408',release_id:RELEASE,reference_at:REF,rechecked_at:CHECK,page_checked_at:null,base_main_sha:BASE,expected_changed_files:[],sources:cov.sources.filter(s=>s.primary).map(s=>({source_id:s.source_id,url:s.url})),coverage:{current_count:read('current-shelters.json').shelters.length,unresolved_count:0,conflict_count:0,municipal_support:'audited',national_support:'audited',national_support_records:n.records.length,national_support_states:Object.fromEntries(['CURRENT','HISTORICAL','PLANNED','UNKNOWN','CONFLICT'].map(st=>[st,n.records.filter(r=>r.state===st).length])),institution_audit:{fixed_minimum_checked:true,dashboard_inventory_count:cov.summary.entities,previous_audit_inventory_count:179,official_discovery_count:2,source_mention_count:cov.source_mentions.length,source_mention_adjudicated_count:cov.source_mentions.length,unadjudicated_source_mentions:[],required_entity_count:cov.required_entities.length,adjudicated_entity_count:cov.adjudicated_entities.length,missing_entities:[],newly_discovered_entities:['熊本県住宅リフォーム推進協議会']}},snapshots:{reference_at:REF,rechecked_at:CHECK,current_shelters:read('current-shelters.json').shelters.length,national_states:n.summary},blocking_unresolved:[],accepted_unresolved:accepted};
          write('operations/ledgers/refresh-20260825-1408.json',ledger);
          NODE
      - name: Build complete repository
        run: |
          set -Eeuo pipefail
          npm run build
      - name: Finalize ledger file inventory
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const p='operations/ledgers/refresh-20260825-1408.json',l=JSON.parse(fs.readFileSync(p,'utf8'));
          const a=cp.execSync('git diff --name-only origin/main...HEAD',{encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          const b=cp.execSync('git diff --name-only',{encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          const exclude=new Set(['.github/workflows/tmp-apply-refresh-20260825.yml','.github/workflows/tmp-finalize-refresh-20260825.yml','scripts/tmp-apply-refresh-20260825.mjs','scripts/tmp-postpatch-refresh-20260825.mjs']);
          l.expected_changed_files=[...new Set([...a,...b,p])].filter(x=>!exclude.has(x)).sort();
          fs.writeFileSync(p,JSON.stringify(l,null,2)+'\n');
          NODE
      - name: Release validation before cleanup
        run: |
          set -Eeuo pipefail
          npm run test:release-gate
          npm run validate:release -- --base=origin/main --ledger=operations/ledgers/refresh-20260825-1408.json --require-ledger-if-data-change
      - name: Commit generated final data
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset -- .github/workflows/tmp-apply-refresh-20260825.yml .github/workflows/tmp-finalize-refresh-20260825.yml scripts/tmp-apply-refresh-20260825.mjs scripts/tmp-postpatch-refresh-20260825.mjs
          git commit -m 'data: close v2.5 institution and source-mention audit'
          git push origin HEAD:audit/timepoint-20260825-1408
