name: Post-deploy Pages smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages-smoke:
    name: Verify deployed GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Wait for complete deployed release
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://ryotamatsuki.github.io/kumamotoshienmap"
          dashboard="ehime_kumamoto_support_geocoded_shelters_20260802.html"
          sender_page="sender-municipalities.html"
          sender_manifest="sender-municipality-audit.json"
          matched=false
          for attempt in $(seq 1 36); do
            if curl -fsSL --connect-timeout 10 --max-time 30 "${base}/${dashboard}" -o /tmp/deployed-dashboard.html \
              && cmp --silent "$dashboard" /tmp/deployed-dashboard.html \
              && curl -fsSL --connect-timeout 10 --max-time 30 "${base}/${sender_page}" -o /tmp/deployed-sender.html \
              && cmp --silent "$sender_page" /tmp/deployed-sender.html \
              && curl -fsSL --connect-timeout 10 --max-time 30 "${base}/${sender_manifest}" -o /tmp/deployed-sender-manifest.json \
              && cmp --silent "$sender_manifest" /tmp/deployed-sender-manifest.json \
              && curl -fsSL --connect-timeout 10 --max-time 30 "${base}/" -o /tmp/root.html \
              && cmp --silent index.html /tmp/root.html; then
              matched=true
              break
            fi
            echo "Pages has not reached complete release ${GITHUB_SHA} yet (attempt ${attempt})."
            sleep 10
          done
          if [[ "$matched" != true ]]; then
            echo "::error title=Pages deployment stale::Dashboard, sender page, sender manifest and root did not converge together."
            exit 1
          fi

          for asset in volunteer.css volunteer.js volunteer-data.js current-shelters.json; do
            curl -fsSL --connect-timeout 10 --max-time 30 "${base}/${asset}" -o "/tmp/${asset}"
            cmp --silent "$asset" "/tmp/${asset}" || { echo "::error title=Pages asset stale::${asset} differs from merged main."; exit 1; }
          done

          sender_assets=(
            sender-municipalities.html
            sender-municipality-audit.json
            sender-audit/ehime.json
            sender-audit/hokkaido-tohoku.json
            sender-audit/kanto.json
            sender-audit/chubu.json
            sender-audit/kinki.json
            sender-audit/chugoku-shikoku.json
            sender-audit/kyushu-okinawa.json
            sender-audit/crosscutting-additions.json
            sender-audit/timepoint-20260830-additions.json
            sender-audit/timepoint-20260831-additions.json
            sender-audit/timepoint-20260901-additions.json
            sender-audit/sources.json
            sender-audit/sources-additions.json
            sender-audit/discovery.json
            sender-audit/discovery-additions.json
          )
          for asset in "${sender_assets[@]}"; do
            tmp="/tmp/sender-$(echo "$asset" | tr '/' '_')"
            curl -fsSL --connect-timeout 10 --max-time 30 "${base}/${asset}" -o "$tmp"
            cmp --silent "$asset" "$tmp" || { echo "::error title=Sender Pages asset stale::${asset} differs from merged main."; exit 1; }
          done

          grep -F './ehime_kumamoto_support_geocoded_shelters_20260802.html' /tmp/root.html
          grep -F './sender-municipalities.html' /tmp/root.html
          grep -F '送出基礎自治体 Coverage' /tmp/root.html
          grep -F 'NATIONAL_SUPPORT_AUDIT_START' /tmp/deployed-dashboard.html
          grep -F '9月1日15:04基準で全件再監査' /tmp/deployed-dashboard.html
          grep -F '国交省第51報（8/31 17:00）を最新インフラ履歴として確認。はくおうIIは9/3宿泊分の予約受付をCURRENT、宿泊実施はPLANNED' /tmp/deployed-dashboard.html
          grep -F '9月1日閣議の非常災害復旧復興本部設置を確認し、9月1日実働主体を再監査' /tmp/deployed-dashboard.html
          grep -F '9/3宿泊分 予約受付中' /tmp/deployed-dashboard.html
          grep -F '第4期・9月3日～6日必要人数到達' /tmp/volunteer-data.js
          grep -F '愛媛県内20市町' /tmp/deployed-sender.html
          grep -F '全国基礎自治体 sender' /tmp/deployed-sender.html
          grep -F '予定期間に入っただけではCURRENTにしません' /tmp/deployed-sender.html

          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const shelters=JSON.parse(readFileSync('/tmp/current-shelters.json','utf8'));
          if(shelters.meta.current_count!==40 || shelters.shelters.length!==40) throw new Error(`deployed current shelters must be 40, got ${shelters.shelters.length}`);
          if(shelters.meta.source_last_modified!=="2026-09-01T14:56:29+09:00") throw new Error(`unexpected shelter source timestamp: ${shelters.meta.source_last_modified}`);
          if(shelters.shelters.some(row=>row.coordinate_status!=='confirmed')) throw new Error('deployed current shelters contain unresolved/conflict coordinates');
          const expected=JSON.parse(readFileSync('sender-municipality-audit.json','utf8'));
          const deployed=JSON.parse(readFileSync('/tmp/deployed-sender-manifest.json','utf8'));
          if(JSON.stringify(expected)!==JSON.stringify(deployed)) throw new Error('deployed sender manifest differs semantically');
          const ehime=expected.summary.ehime;
          const nationwide=expected.summary.nationwide;
          if(ehime.required_count!==20 || ehime.adjudicated_count!==20 || ehime.missing_required.length!==0) throw new Error('Ehime sender coverage must be 20/20 with missing 0');
          if(nationwide.prefecture_discovery_checked!==47) throw new Error('nationwide discovery must be 47/47');
          if(nationwide.adjudicated_basic_municipality_senders!==316 || nationwide.discovered_basic_municipality_senders!==316) throw new Error('nationwide sender count must be 316');
          if(nationwide.orphan_source_mentions.length!==0 || nationwide.blocking_conflicts!==0) throw new Error('sender closure still has blocking items');
          console.log(JSON.stringify({currentShelters:40,allCoordinatesConfirmed:true,ehime:'20/20',prefectureDiscovery:'47/47',senderEntities:316,orphanMentions:0}));
          NODE

      - name: Install browser driver
        run: |
          set -Eeuo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false puppeteer-core
          command -v google-chrome

      - name: Verify Desktop and Mobile runtime
        run: |
          set -Eeuo pipefail
          node --input-type=module - <<'NODE'
          import puppeteer from 'puppeteer-core';
          import { extractPageRecheckMeta, formatPageCheckedAt } from './scripts/current-page-metadata.mjs';
          import { readFileSync } from 'node:fs';
          const expectedHtml=readFileSync('ehime_kumamoto_support_geocoded_shelters_20260802.html','utf8');
          const senderManifest=JSON.parse(readFileSync('sender-municipality-audit.json','utf8'));
          const expectedSenderCount=senderManifest.summary.nationwide.adjudicated_basic_municipality_senders;
          const expectedEhimeCount=senderManifest.summary.ehime.adjudicated_count;
          const meta=extractPageRecheckMeta(expectedHtml);
          const checkedLabel=formatPageCheckedAt(meta.checkedAt);
          const checkedCompact=formatPageCheckedAt(meta.checkedAt,{compact:true});
          const volunteerLabel=formatPageCheckedAt(meta.volunteerCheckedAt||meta.checkedAt);
          const releaseMatch=expectedHtml.match(/volunteer-data\.js\?v=([A-Za-z0-9._-]+)/u);
          if(!releaseMatch) throw new Error('release_id query missing from expected HTML');
          const releaseId=releaseMatch[1];
          const expectedViews=['overview','needs','timeline','dashboard','volunteer','map'];
          const base='https://ryotamatsuki.github.io/kumamotoshienmap';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            for(const spec of [{name:'desktop',width:1440,height:1000,mobile:false},{name:'mobile',width:390,height:844,mobile:true}]) {
              const page=await browser.newPage();
              await page.setViewport({width:spec.width,height:spec.height,isMobile:spec.mobile,deviceScaleFactor:1});
              const pageErrors=[]; const consoleErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());});
              const response=await page.goto(`${base}/ehime_kumamoto_support_geocoded_shelters_20260802.html`,{waitUntil:'networkidle2',timeout:60000});
              if(!response?.ok()) throw new Error(`${spec.name}: dashboard HTTP ${response?.status()}`);
              const state=await page.evaluate(({views,checkedLabel,checkedCompact,volunteerLabel,releaseId})=>{
                const values=[...document.querySelectorAll('[data-view]')].map(el=>el.getAttribute('data-view'));
                const body=document.body.innerText; const subtitle=document.querySelector('.subtitle'); const badge=document.querySelector('.badge');
                return {presentViews:views.filter(v=>values.includes(v)),headerChecked:(subtitle?.textContent||'').includes(`ページ全体の再確認：${checkedLabel}（JST）`),badgeChecked:(badge?.textContent||'').includes(`ページ全体再確認：${checkedCompact}`),badgeVisible:badge?getComputedStyle(badge).display!=='none':false,siteChecked:body.includes(`サイト確認：${checkedLabel}（JST）`),volunteerChecked:body.includes(`ボランティア個別確認：${volunteerLabel}確認済み`),releaseChecked:[...document.scripts].some(s=>(s.getAttribute('src')||'').includes(`volunteer-data.js?v=${releaseId}`)),pageOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth};
              },{views:expectedViews,checkedLabel,checkedCompact,volunteerLabel,releaseId});
              for(const [key,value] of Object.entries({headerChecked:state.headerChecked,badgeChecked:state.badgeChecked,siteChecked:state.siteChecked,volunteerChecked:state.volunteerChecked,releaseChecked:state.releaseChecked})) if(!value) throw new Error(`${spec.name}: ${key} failed`);
              if(spec.mobile&&state.badgeVisible) throw new Error(`${spec.name}: responsive badge should be hidden`);
              if(!spec.mobile&&!state.badgeVisible) throw new Error(`${spec.name}: desktop badge should be visible`);
              if(state.presentViews.length!==expectedViews.length || state.pageOverflow || pageErrors.length || consoleErrors.length) throw new Error(`${spec.name}: dashboard runtime failure`);
              console.log(JSON.stringify({name:`dashboard-${spec.name}`,...state,pageErrors,consoleErrors}));
              await page.close();

              const senderPage=await browser.newPage();
              await senderPage.setViewport({width:spec.width,height:spec.height,isMobile:spec.mobile,deviceScaleFactor:1});
              const senderErrors=[]; const senderConsole=[];
              senderPage.on('pageerror',e=>senderErrors.push(String(e)));
              senderPage.on('console',m=>{if(m.type()==='error')senderConsole.push(m.text());});
              const senderResponse=await senderPage.goto(`${base}/sender-municipalities.html`,{waitUntil:'networkidle2',timeout:60000});
              if(!senderResponse?.ok()) throw new Error(`${spec.name}: sender HTTP ${senderResponse?.status()}`);
              await senderPage.waitForFunction(count=>document.querySelectorAll('#ehimeBody tr[data-entity]').length===count,{timeout:30000},expectedEhimeCount);
              await senderPage.waitForFunction(count=>document.querySelectorAll('#nationalBody tr[data-entity]').length===count,{timeout:30000},expectedSenderCount);
              const senderState=await senderPage.evaluate(()=>({cards:document.getElementById('cards')?.innerText||'',ehimeRows:document.querySelectorAll('#ehimeBody tr[data-entity]').length,nationalRows:document.querySelectorAll('#nationalBody tr[data-entity]').length,pageOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth}));
              for(const expected of ['20/20','47/47','316','0']) if(!senderState.cards.includes(expected)) throw new Error(`${spec.name}: sender summary missing ${expected}`);
              if(senderState.pageOverflow || senderErrors.length || senderConsole.length) throw new Error(`${spec.name}: sender runtime failure`);
              await senderPage.select('#state','CURRENT');
              await senderPage.waitForFunction(()=>document.querySelectorAll('#nationalBody tr[data-entity]').length>0);
              const filtered=await senderPage.$$eval('#nationalBody tr[data-entity]',rows=>rows.length);
              if(filtered!==12) throw new Error(`${spec.name}: CURRENT sender rows must be 12, got ${filtered}`);
              console.log(JSON.stringify({name:`sender-${spec.name}`,...senderState,filteredRows:filtered,pageErrors:senderErrors,consoleErrors:senderConsole}));
              await senderPage.close();
            }
          } finally { await browser.close(); }
          NODE
