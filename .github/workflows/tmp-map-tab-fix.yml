name: Temporary Map tab fix
on:
  push:
    branches:
      - design/final-visual-polish
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/final-visual-polish
      - name: Normalize desktop Map tab hit area
        run: |
          set -euo pipefail
          if ! grep -q 'FINAL_VISUAL_POLISH_MAP_TAB_TARGET_START' volunteer.css; then
            cat >> volunteer.css <<'CSS'
          /* FINAL_VISUAL_POLISH_MAP_TAB_TARGET_START */
          body .tabs > .tab{min-height:40px!important}
          @media(max-width:760px){body .tabs > .tab{min-height:44px!important}}
          /* FINAL_VISUAL_POLISH_MAP_TAB_TARGET_END */
          CSS
            python3 - <<'PY'
          from pathlib import Path
          p=Path('volunteer.css')
          p.write_text(p.read_text().rstrip()+"\n")
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add volunteer.css
            git diff --cached --check
            git commit -m 'design: normalize Map tab hit area'
            git push origin HEAD:design/final-visual-polish
          else
            echo 'Map tab polish already present.'
          fi
