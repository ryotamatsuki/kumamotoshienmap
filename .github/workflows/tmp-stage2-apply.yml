name: Temporary Stage2 applicator

on:
  push:
    branches:
      - design/major-screen-restructure

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/major-screen-restructure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply Stage 2 CSS
        run: |
          python scripts/tmp-stage2-apply.py
          python scripts/tmp-stage2-cascade-bridge.py
      - name: Commit generated visual change if needed
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- volunteer.css; then
            echo "No Stage 2 CSS diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volunteer.css
          git commit -m "fix: complete stage2 editorial cascade"
          git push origin HEAD:design/major-screen-restructure
