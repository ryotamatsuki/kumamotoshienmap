# retry after scoping stale-value checks to the current display
name: Finalize Ehime 2026-09-07 correction v4

on:
  push:
    branches:
      - audit/ehime-20260907-v2
    paths:
      - .github/workflows/finalize-ehime-20260907-v4.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Apply audited Ehime producer patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/finalize-ehime-20260907-v2.yml').read_text()
          a=src.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          b=src.index("\n          PY\n", a)
          lines=src[a:b].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          Path('/tmp/ehime_patch.py').write_text(code)
          PY
          python3 /tmp/ehime_patch.py
      - name: Build and validate corrected candidate
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
      - name: Remove temporary acquisition machinery
        run: |
          set -euo pipefail
          rm -f .github/workflows/ehime-source-fetch-20260907.yml
          rm -f .github/workflows/finalize-ehime-20260907.yml
          rm -f .github/workflows/finalize-ehime-20260907-v2.yml
          rm -f .github/workflows/finalize-ehime-20260907-v3.yml
          rm -f .github/workflows/finalize-ehime-20260907-v4.yml
          rm -f .github/workflows/diagnose-ehime-stale-20260907.yml
          rm -f operations/audits/ehime-source-20260907.txt
          rm -f operations/audits/ehime-source-20260907-meta.txt
          rm -f operations/audits/ehime-site-matches-20260907.txt
      - name: Correct existing 15:22 release ledger
        env:
          BASE: f484fbb5b526c69a0ba758cbb183ff0583b210a5
          LEDGER: operations/ledgers/refresh-20260907-1522.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          base=os.environ['BASE']; path=Path(os.environ['LEDGER'])
          ledger=json.loads(path.read_text())
          ledger['rechecked_at']='2026-09-07T17:04:00+09:00'
          found=False
          for source in ledger.get('sources',[]):
              if source.get('source_id') in {'ehime-support-0904','ehime-support-0907'}:
                  source.update({'source_id':'ehime-support-0907','publisher':'愛媛県','url':'https://www.pref.ehime.jp/uploaded/attachment/189556.pdf','source_as_of':'2026-09-07T12:00:00+09:00','checked_at':'2026-09-07T17:04:00+09:00'})
                  found=True
          if not found: raise SystemExit('Ehime source entry missing')
          ledger.setdefault('snapshots',{}).update({'ehime_support_as_of':'2026-09-07T12:00:00+09:00','ehime_human_support_persons':260,'ehime_human_support_person_days':1307,'ehime_counterpart_persons':96,'ehime_counterpart_person_days':481,'ehime_donations_yen':26880978,'ehime_donations_as_of':'2026-09-03'})
          changed=subprocess.check_output(['git','diff','--name-only',base],text=True).splitlines()
          ledger['expected_changed_files']=sorted(set([x for x in changed if x and x != str(path)]+[str(path)]))
          path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print('\n'.join(ledger['expected_changed_files']))
          PY
      - name: Commit candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: refresh Ehime support to 2026-09-07 official results'
      - name: Rebuild and run release gates
        env:
          BASE: f484fbb5b526c69a0ba758cbb183ff0583b210a5
          LEDGER: operations/ledgers/refresh-20260907-1522.json
        run: |
          set -euo pipefail
          npm run build
          git diff --exit-code
          npm run test:release-gate
          npm run validate:release -- --base="$BASE" --ledger="$LEDGER" --require-ledger-if-data-change
      - name: Push validated correction
        run: git push origin HEAD:audit/ehime-20260907-v2
