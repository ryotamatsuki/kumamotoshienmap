name: Finalize audited refresh 2026-09-07

on:
  push:
    branches:
      - audit/timepoint-20260907-1522

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install npm metadata
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Refresh current shelters through candidate flow
        run: |
          set -Eeuo pipefail
          npm run update:current-shelters -- --dry-run --candidate-output /tmp/current-shelters-candidate.json
          node scripts/validate-current-shelters.mjs --candidate=/tmp/current-shelters-candidate.json
          cp /tmp/current-shelters-candidate.json current-shelters.json
      - name: Reuse audited preparation logic
        env:
          BASE_MAIN_SHA: 12b6d3187e85e96070157f7ee4cfe63aed1ec705
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/refresh-helper-20260907.yml').read_text()
          marker = "          cat > /tmp/prepare-refresh.mjs <<'NODE'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          NODE", start)
          block = src[start:end]
          lines = [(line[10:] if line.startswith('          ') else line) for line in block.splitlines()]
          Path('/tmp/prepare-refresh.mjs').write_text('\n'.join(lines) + '\n')
          PY
          node /tmp/prepare-refresh.mjs
      - name: Build and seal final diff
        env:
          BASE_MAIN_SHA: 12b6d3187e85e96070157f7ee4cfe63aed1ec705
        run: |
          set -Eeuo pipefail
          npm run build
          rm -f .github/workflows/refresh-helper-20260907.yml .github/workflows/finalize-refresh-20260907.yml
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const path='operations/ledgers/refresh-20260907-1522.json';
          const ledger=JSON.parse(await readFile(path,'utf8'));
          const changed=execFileSync('git',['diff','--name-only',process.env.BASE_MAIN_SHA,'--'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          if(!changed.includes(path)) changed.push(path);
          ledger.expected_changed_files=[...new Set(changed)].sort();
          await writeFile(path,JSON.stringify(ledger,null,2)+'\n','utf8');
          NODE
          git diff --check
      - name: Commit candidate locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refresh: audited 2026-09-07 release'
      - name: Run release gates against committed candidate
        env:
          BASE_MAIN_SHA: 12b6d3187e85e96070157f7ee4cfe63aed1ec705
        run: |
          set -Eeuo pipefail
          npm run test:release-gate
          npm run validate:release -- --base="$BASE_MAIN_SHA" --ledger=operations/ledgers/refresh-20260907-1522.json
          git status --porcelain
      - name: Push validated candidate
        run: git push origin HEAD:audit/timepoint-20260907-1522
