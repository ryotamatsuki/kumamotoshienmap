name: Source snapshot 2026-09-11
on:
  push:
    branches: [audit/timepoint-20260911-1521]
    paths: ['.github/workflows/source-snapshot-20260911.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/timepoint-20260911-1521
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Acquire and inspect official sources
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/source-snapshot
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse,time
          from html.parser import HTMLParser
          from pathlib import Path
          OUT=Path('/tmp/source-snapshot')
          UA={'User-Agent':'Mozilla/5.0 (compatible; kumamotoshienmap-audit/1.0)'}
          def get(url,binary=False,timeout=45):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  b=r.read(); return (b if binary else b.decode('utf-8','replace')),r.geturl(),dict(r.headers)
          urls={
            'ehime_support_page':'https://www.pref.ehime.jp/page/154856.html',
            'kumamoto_damage_page':'https://www.pref.kumamoto.jp/soshiki/222/276831.html',
            'kumamoto_info_page':'https://www.pref.kumamoto.jp/soshiki/1/274517.html',
            'kumamoto_recovery_page':'https://www.pref.kumamoto.jp/soshiki/5/278881.html',
            'kumamoto_volunteer_bus':'https://www.pref.kumamoto.jp/soshiki/27/278033.html',
            'mod_disaster':'https://www.mod.go.jp/j/approach/defense/saigai/index.html',
            'mhlw_response':'https://www.mhlw.go.jp/stf/newpage_73935.html',
            'current_shelters':'https://portal.bousai.pref.kumamoto.jp/data/shelter/shelter.json',
          }
          meta={}
          for key,url in urls.items():
              try:
                  data,final,h=get(url,binary=(key=='current_shelters'))
                  p=OUT/(key+('.json' if key=='current_shelters' else '.html'))
                  p.write_bytes(data if isinstance(data,bytes) else data.encode())
                  meta[key]={'url':url,'final_url':final,'ok':True,'bytes':p.stat().st_size,'last_modified':h.get('Last-Modified'),'content_type':h.get('Content-Type')}
              except Exception as e: meta[key]={'url':url,'ok':False,'error':repr(e)}
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]; self.href=None; self.text=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a': self.href=dict(attrs).get('href'); self.text=[]
              def handle_data(self,data):
                  if self.href is not None:self.text.append(data)
              def handle_endtag(self,tag):
                  if tag=='a' and self.href is not None:
                      self.links.append((self.href,''.join(self.text).strip())); self.href=None; self.text=[]
          # Ehime: choose latest date-stamped support PDF link.
          ep=OUT/'ehime_support_page.html'
          if ep.exists():
              parser=P(); parser.feed(ep.read_text(errors='replace')); ms=[]
              for href,text in parser.links:
                  m=re.search(r'[【〖](\d{1,2})月(\d{1,2})日12時00分時点[】〗]',text)
                  if m and '熊本地震' in text and href:
                      if href.startswith('/'): href='https://www.pref.ehime.jp'+href
                      ms.append((int(m.group(1)),int(m.group(2)),href,text))
              ms.sort(reverse=True); meta['ehime_pdf_links']=[{'month':a,'day':b,'href':h,'text':t} for a,b,h,t in ms[:5]]
              if ms:
                  _,_,u,t=ms[0]
                  try:
                      pdf,final,h=get(u,binary=True); (OUT/'ehime_latest.pdf').write_bytes(pdf)
                      meta['ehime_latest_pdf']={'url':u,'final_url':final,'text':t,'ok':True,'bytes':len(pdf)}
                  except Exception as e: meta['ehime_latest_pdf']={'url':u,'text':t,'ok':False,'error':repr(e)}
          # Kumamoto damage: choose highest numbered report PDF from page.
          kp=OUT/'kumamoto_damage_page.html'
          if kp.exists():
              parser=P(); parser.feed(kp.read_text(errors='replace')); reps=[]
              for href,text in parser.links:
                  m=re.search(r'第\s*(\d+)\s*報',text)
                  if m and href:
                      if href.startswith('/'): href='https://www.pref.kumamoto.jp'+href
                      reps.append((int(m.group(1)),href,text))
              reps.sort(reverse=True); meta['damage_report_links']=[{'report':n,'href':h,'text':t} for n,h,t in reps[:5]]
              if reps:
                  n,u,t=reps[0]
                  try:
                      pdf,final,h=get(u,binary=True); (OUT/'damage_latest.pdf').write_bytes(pdf)
                      meta['damage_latest_pdf']={'report':n,'url':u,'final_url':final,'text':t,'ok':True,'bytes':len(pdf)}
                  except Exception as e: meta['damage_latest_pdf']={'report':n,'url':u,'text':t,'ok':False,'error':repr(e)}
          # Recheck stored sender source URLs.
          sender=[]
          for fn in ['sender-audit/sources.json','sender-audit/sources-additions.json']:
              p=Path(fn)
              if not p.exists(): continue
              for s in json.loads(p.read_text()).get('sources',[]):
                  u=s.get('url'); row={'source_id':s.get('source_id'),'url':u,'tier':s.get('tier')}
                  if not u: continue
                  try:
                      req=urllib.request.Request(u,headers=UA)
                      with urllib.request.urlopen(req,timeout=20) as r:
                          prefix=r.read(300000); txt=prefix.decode('utf-8','replace')
                          row.update(ok=True,status=getattr(r,'status',200),final_url=r.geturl(),content_type=r.headers.get('content-type'),mentions_kumamoto=('熊本' in txt),mentions_reiwa8=('令和8' in txt or '令和８' in txt),mentions_current=any(x in txt for x in ['受付中','受け付けています','実施中','派遣中','活動中','派遣している','派遣しています']))
                  except Exception as e: row.update(ok=False,error=repr(e))
                  sender.append(row)
          (OUT/'sender-source-recheck.json').write_text(json.dumps(sender,ensure_ascii=False,indent=2))
          meta['sender_sources']={'total':len(sender),'ok':sum(x.get('ok',False) for x in sender),'failed':sum(not x.get('ok',False) for x in sender),'current_markers':sum(x.get('mentions_current',False) for x in sender)}
          # Re-run all 47 stored discovery queries via DuckDuckGo HTML. Evidence only; do not auto-adjudicate from search snippets.
          disc=json.loads(Path('sender-audit/discovery.json').read_text()).get('prefecture_discovery',[])
          known=set()
          for fn in ['sender-audit/ehime.json']+[str(p) for p in Path('sender-audit').glob('region-*.json')]:
              try:
                  d=json.loads(Path(fn).read_text())
                  for e in d.get('entities',[]): known.add(e.get('entity'))
                  for ce in d.get('compact_entities',[]): known.add(ce[1])
              except Exception: pass
          results=[]; suffix_re=re.compile(r'([一-龠々ヶぁ-んァ-ヶー]{1,14}(?:市|町|村|区))')
          for i,d in enumerate(disc):
              q=d.get('search_query',''); row={'prefecture':d.get('prefecture'),'query':q,'ok':False,'urls':[],'possible_names':[]}
              try:
                  u='https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q)
                  html,final,h=get(u,timeout=25); row['ok']=True
                  # capture visible result links/titles, then municipality-like strings for manual review.
                  pp=P(); pp.feed(html)
                  for href,text in pp.links:
                      if text and href and ('result' in href or href.startswith('http')):
                          row['urls'].append({'href':href,'text':re.sub(r'\s+',' ',text)[:240]})
                  names=[]
                  for x in suffix_re.findall(re.sub('<[^>]+>',' ',html)):
                      if len(x)>=2: names.append(x)
                  row['possible_names']=sorted(set(names))[:80]
              except Exception as e: row['error']=repr(e)
              results.append(row); time.sleep(0.15)
          (OUT/'prefecture-discovery-recheck.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          possible=set(x for r in results for x in r.get('possible_names',[])); new=sorted(x for x in possible if x not in known)
          meta['prefecture_discovery']={'total':len(results),'ok':sum(r.get('ok',False) for r in results),'failed':sum(not r.get('ok',False) for r in results),'possible_new_names':new[:200]}
          (OUT/'snapshot-meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2))
          PY
          for f in ehime_latest damage_latest; do
            if [[ -f "/tmp/source-snapshot/${f}.pdf" ]]; then pdftotext -layout "/tmp/source-snapshot/${f}.pdf" "/tmp/source-snapshot/${f}.txt" || true; fi
          done
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run update:current-shelters -- --dry-run --candidate-output /tmp/source-snapshot/current-shelters-candidate.json
          node scripts/validate-current-shelters.mjs --candidate=/tmp/source-snapshot/current-shelters-candidate.json > /tmp/source-snapshot/current-shelters-validation.txt
          echo '=== SNAPSHOT META ==='; cat /tmp/source-snapshot/snapshot-meta.json
          echo '=== EHIME LATEST ==='; sed -n '1,300p' /tmp/source-snapshot/ehime_latest.txt 2>/dev/null || true
          echo '=== DAMAGE LATEST ==='; sed -n '1,260p' /tmp/source-snapshot/damage_latest.txt 2>/dev/null || true
          echo '=== SHELTER VALIDATION ==='; cat /tmp/source-snapshot/current-shelters-validation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-20260911-1521
          path: /tmp/source-snapshot
          if-no-files-found: error
