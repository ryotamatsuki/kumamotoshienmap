name: One-shot update-flow nonworkflow patch
on:
  push:
    branches: [fix/update-flow-currentness-coverage-20260915]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/update-flow-currentness-coverage-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Patch non-workflow files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for path in ['scripts/sync-needs-kpis.mjs','scripts/validate-needs-kpis.mjs']:
              p=Path(path); s=p.read_text(encoding='utf-8')
              s=s.replace("import { readFile, writeFile } from 'node:fs/promises';", "import { readFile, readdir, writeFile } from 'node:fs/promises';")
              s=s.replace("import { readFile } from 'node:fs/promises';", "import { readFile, readdir } from 'node:fs/promises';")
              old="const auditPath=resolve(root,'operations/audits/needs-kpi-source-recheck-20260915-1942.json');"
              new="const auditNames=(await readdir(resolve(root,'operations','audits'))).filter(name=>/^needs-kpi-source-recheck-\\d{8}-\\d{4}\\.json$/u.test(name)).sort();\nconst latestNeedsAudit=auditNames.at(-1);\nif(!latestNeedsAudit)throw new Error('latest needs KPI audit missing');\nconst auditPath=resolve(root,'operations','audits',latestNeedsAudit);"
              if old in s: s=s.replace(old,new,1)
              elif 'latestNeedsAudit' not in s: raise SystemExit(f'{path}: hardcoded audit path target missing')
              p.write_text(s,encoding='utf-8')

          p=Path('時点修正更新オペレーション.md'); s=p.read_text(encoding='utf-8')
          if 'Version 2.8（2026-09-15改訂）' not in s:
              header='# 時点修正更新オペレーション\n\n'
              v28='''> Version 2.8（2026-09-15改訂）\n>\n> Version 2.7までの全Gateを維持したうえで、**Current Surface Coverage Gate**、**Source Link Closure Gate**、**Production Completion Gate**を追加する。一次情報・内部監査データだけ更新され、Needs KPIや知事・幹部向けサマリー等の派生表示が旧時点のまま残る更新を禁止する。\n>\n> 「merge済み」と「公開完了」を分離する。GitHub Pagesのbuild/deployおよびDesktop/Mobile post-deploy smokeがsuccessになるまでは `MERGED_PENDING_DEPLOY` であり、完了報告してはならない。\n>\n'''
              if not s.startswith(header): raise SystemExit('operation header mismatch')
              s=header+v28+s[len(header):]
          if '### 6.1 Current surface / source-link coverage（Version 2.8）' not in s:
              marker='## 7. Institution Coverage / Source Mention Closure'
              block='''### 6.1 Current surface / source-link coverage（Version 2.8）\n\n時点修正ledgerには、数値の取得元だけでなく「どの表示面まで同期したか」を記録する。`coverage.current_surface_sync` に `overview`、`executive_summary`、`needs_kpis`、`page_recheck_meta`、`timeline`、`dashboard`、`map` を持たせ、全て `synced` とする。\n\n`coverage.source_link_closure` では、現在値カードに必要な一次情報リンク数、リンク欠落数、公式一次情報限定かを記録する。現在値カードに根拠リンクが必要なのにhrefがない状態はblockingとする。\n\n`coverage.production_verification` ではPages deploy、Desktop smoke、Mobile smokeを必須とし、smoke前の完了宣言を禁止する。\n\n'''
              if marker not in s: raise SystemExit('section 7 marker missing')
              s=s.replace(marker,block+marker,1)
          if '### 16.2 Current Surface Coverage / Source Link Closure Gate（Version 2.8追加）' not in s:
              marker='## 17. Sender Gate自己破壊テスト'
              block='''### 16.2 Current Surface Coverage / Source Link Closure Gate（Version 2.8追加）\n\n時点修正では、一次情報→監査JSON→全派生表示→根拠リンク→実配信の5層を一続きの更新単位として扱う。データ層だけ更新して表示層を残すこと、又は表示値だけ更新して根拠リンクを残すことを禁止する。\n\ncanonical currentness sourceは `operations/audits/needs-kpi-source-recheck-*.json` の最新ファイルとする。sync/validatorで特定日付の監査ファイル名をhard-codeしてはならない。\n\nHard Gate対象は、支援ニーズ見通し4KPI、知事・幹部向け意思決定サマリー、`PAGE_RECHECK_META`、発災後タイムライン、`PROVINCE_NEEDS`、支援ダッシュボード、Map、現行避難所JSON別定義表示、source/public/dist parityとする。\n\n`npm run validate:currentness-surfaces` は最新監査JSONから期待値を動的導出し、旧数値・旧時点・リンク欠落・runtime overlay不一致のいずれかでFAILする。`npm run test:currentness-surfaces` は旧KPI値、href欠落、幹部サマリー旧値、`PAGE_RECHECK_META`旧時点、runtime overlay旧値を故障注入し、全てFAILすることを確認する。\n\n`npm run build` はこの横断Gateを必ず含める。個別validatorがPASSしても横断GateがFAILならmerge不可。\n\n'''
              if marker not in s: raise SystemExit('section 17 marker missing')
              s=s.replace(marker,block+marker,1)
          if '### 20.0 Production Completion Gate（Version 2.8追加）' not in s:
              marker='### 20.1 配信一致'
              block='''### 20.0 Production Completion Gate（Version 2.8追加）\n\n状態は `PR_VALIDATED`、`MERGED_PENDING_DEPLOY`、`DEPLOYED_VERIFIED` の3段階で管理する。\n\n- `PR_VALIDATED`: PR CIがgreen。未merge。\n- `MERGED_PENDING_DEPLOY`: mainへmerge済みだがPages deploy又はpost-deploy smokeが未完了。\n- `DEPLOYED_VERIFIED`: Pages build/deploy、配信一致、currentness/source-link smoke、Desktop/Mobile runtime smokeが全てsuccess。\n\n「完了」「公開反映済み」「完全終了」と報告できるのは `DEPLOYED_VERIFIED` のみ。`MERGED_PENDING_DEPLOY` を完了扱いしてはならない。\n\n'''
              if marker not in s: raise SystemExit('section 20.1 marker missing')
              s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate patched flow
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
          npm run validate:currentness-surfaces
          npm run test:currentness-surfaces
          git diff --check
      - name: Commit non-workflow changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sync-needs-kpis.mjs scripts/validate-needs-kpis.mjs '時点修正更新オペレーション.md'
          git commit -m 'docs: harden timepoint update flow v2.8'
          git push origin HEAD:fix/update-flow-currentness-coverage-20260915
