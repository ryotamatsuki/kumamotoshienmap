name: Apply corrected timepoint refresh

on:
  push:
    branches:
      - audit/timepoint-20260903-1450

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Apply audited refresh and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run update:current-shelters
          python3 scripts/apply-timepoint-refresh-20260903.py
          python3 scripts/patch-timepoint-validators-20260903.py

          # Generators require canonical/public parity before they start.
          cp ehime_kumamoto_support_geocoded_shelters_20260802.html public/dashboard.html
          npm run sync:municipal-support
          npm run sync:national-support
          npm run sync:page-metadata
          npm run build

          python3 - <<'PY'
          import json, pathlib, subprocess
          base='cca0eb8fbbcc293d515eb99570ade50b8af660f6'
          ledger=pathlib.Path('operations/ledgers/refresh-20260903-1457.json')
          data=json.loads(ledger.read_text(encoding='utf-8'))
          committed=subprocess.check_output(['git','diff','--name-only',f'{base}...HEAD'],text=True).splitlines()
          working=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          excluded={
            '.github/workflows/apply-timepoint-refresh-v2.yml',
            'scripts/apply-timepoint-refresh-20260903.py',
            'scripts/patch-timepoint-validators-20260903.py',
          }
          files=sorted({x for x in committed+working+untracked if x and x not in excluded})
          if str(ledger) not in files:
              files.append(str(ledger)); files.sort()
          data['expected_changed_files']=files
          ledger.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('FINAL_EXPECTED_FILES', len(files))
          for item in files: print(item)
          PY

          npm run validate:current-shelters
          npm run validate:municipal-support
          npm run validate:national-support
          npm run validate:sender-coverage
          npm run validate:dashboard
          npm run validate:current-state
          npm run validate:timeline
          npm run validate:dist
          npm run validate:sender-dist
          npm run test:release-gate
          git diff --check

      - name: Commit refreshed data
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/apply-timepoint-refresh-v2.yml scripts/apply-timepoint-refresh-20260903.py scripts/patch-timepoint-validators-20260903.py
          if git diff --cached --quiet; then
            echo 'No generated refresh diff to commit.'
            exit 0
          fi
          git commit -m 'data: refresh Kumamoto support dashboard to 2026-09-03'
          git push origin HEAD:audit/timepoint-20260903-1450
