name: One-shot needs KPI source fix
on:
  push:
    branches:
      - fix/needs-kpi-current-sources-20260915
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/needs-kpi-current-sources-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Build and gate
        run: |
          set -Eeuo pipefail
          npm run build
          npm run validate:needs-kpis
          node --check scripts/sync-needs-kpis.mjs
          node --check scripts/validate-needs-kpis.mjs
      - name: Commit deterministic generated outputs and remove one-shot workflow
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-shot-needs-kpi-fix.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'fix: render current needs KPIs with official source links'
            git push origin HEAD:fix/needs-kpi-current-sources-20260915
          fi
