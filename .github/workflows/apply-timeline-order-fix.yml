name: Apply timeline order fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify timeline order fix
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/timeline-chronological-order-20260822
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Apply chronological sort patch
        run: |
          set -Eeuo pipefail
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const files=['ehime_kumamoto_support_geocoded_shelters_20260802.html','public/dashboard.html'];
          const needle=`function renderTimeline(){\n const filtered=timelineFilteredEvents();`;
          const replacement=`function timelineTimeOrder(value){
           const text=String(value||'').trim();
           const match=text.match(/(\\d{1,2}):(\\d{2})/);
           if(match)return Number(match[1])*60+Number(match[2]);
           if(/午前/u.test(text))return 9*60;
           if(/日中|開始/u.test(text))return 12*60;
           if(/午後/u.test(text))return 15*60;
           if(/完了|決定/u.test(text))return 18*60;
           if(/以降毎日|予定延期|予定/u.test(text))return 24*60;
           return 24*60+1;
          }
          function sortTimelineEvents(events){
           return [...events].sort((a,b)=>{
            const dateOrder=String(a.date||'').localeCompare(String(b.date||''),'ja');
            if(dateOrder!==0)return dateOrder;
            const timeOrder=timelineTimeOrder(a.time)-timelineTimeOrder(b.time);
            if(timeOrder!==0)return timeOrder;
            return String(a.id||'').localeCompare(String(b.id||''),'ja');
           });
          }
          function renderTimeline(){
           const filtered=sortTimelineEvents(timelineFilteredEvents());`;
          for(const file of files){
            const source=readFileSync(file,'utf8');
            const count=source.split(needle).length-1;
            if(count!==1) throw new Error(`${file}: renderTimeline patch point count=${count}`);
            writeFileSync(file,source.replace(needle,replacement),'utf8');
          }
          NODE
          cmp --silent ehime_kumamoto_support_geocoded_shelters_20260802.html public/dashboard.html
      - name: Build and regression test
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
          npm run validate:timeline
          npm run test:release-gate
          cmp --silent ehime_kumamoto_support_geocoded_shelters_20260802.html public/dashboard.html
          git diff --check
      - name: Commit patched dashboard
        env:
          BRANCH_NAME: fix/timeline-chronological-order-20260822
        run: |
          set -Eeuo pipefail
          git add ehime_kumamoto_support_geocoded_shelters_20260802.html public/dashboard.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: sort timeline chronologically at render time'
          git push origin "HEAD:${BRANCH_NAME}"
