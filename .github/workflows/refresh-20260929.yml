name: Temporary 20260929 refresh

on:
  push:
    branches:
      - audit/timepoint-20260929-0723

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260929-0723
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Fetch and validate live shelter candidate
        run: |
          set -Eeuo pipefail
          node scripts/update-current-shelters.mjs --dry-run --candidate-output /tmp/current-shelters-candidate.json
          node scripts/validate-current-shelters.mjs --candidate /tmp/current-shelters-candidate.json
          cp /tmp/current-shelters-candidate.json current-shelters.json
          npm run validate:current-shelters
      - name: Build all generated surfaces
        run: |
          set -Eeuo pipefail
          npm run build
          npm run test:release-gate
          git diff --check
      - name: Commit refreshed generated files
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: refresh generated surfaces and live shelters 20260929"
          git push origin HEAD:audit/timepoint-20260929-0723
