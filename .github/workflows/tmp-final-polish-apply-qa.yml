name: Temporary final visual polish applicator
on:
  push:
    branches:
      - design/final-visual-polish
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/final-visual-polish
      - name: Append staged presentation CSS
        run: |
          set -euo pipefail
          changed=false
          if ! grep -q 'FINAL_VISUAL_POLISH_START' volunteer.css; then
            cat tmp-final-visual-polish.css >> volunteer.css
            changed=true
          fi
          if ! grep -q 'FINAL_VISUAL_POLISH_TOUCH_TARGET_FOLLOWUP_START' volunteer.css; then
            cat tmp-final-polish-followup.css >> volunteer.css
            changed=true
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('volunteer.css')
          p.write_text(p.read_text().rstrip()+"\n")
          PY
          if [[ "$changed" == true ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add volunteer.css
            git diff --cached --check
            git commit -m 'design: complete volunteer touch targets'
            git push origin HEAD:design/final-visual-polish
          else
            echo 'Final visual polish already fully present.'
          fi