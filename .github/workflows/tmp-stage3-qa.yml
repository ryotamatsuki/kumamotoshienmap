name: Temporary Stage3 browser QA

on:
  push:
    branches:
      - design/detail-ui-polish

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/detail-ui-polish
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false puppeteer-core
      - name: Serve repository
        run: |
          python3 -m http.server 4173 >/tmp/stage3-http.log 2>&1 &
          echo $! >/tmp/stage3-http.pid
          sleep 2
      - name: Run Desktop and Mobile QA
        run: |
          node --input-type=module - <<'NODE'
          import puppeteer from 'puppeteer-core';
          import {readFileSync} from 'node:fs';
          const manifest=JSON.parse(readFileSync('sender-municipality-audit.json','utf8'));
          const expectedSender=manifest.summary.nationwide.adjudicated_basic_municipality_senders;
          const expectedEhime=manifest.summary.ehime.adjudicated_count;
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
          const base='http://127.0.0.1:4173';
          try{
            for(const spec of [{name:'desktop',width:1440,height:1000,mobile:false},{name:'mobile',width:390,height:844,mobile:true}]){
              const page=await browser.newPage();
              await page.setViewport({width:spec.width,height:spec.height,isMobile:spec.mobile,deviceScaleFactor:1});
              const errors=[],consoleErrors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              let r=await page.goto(`${base}/`,{waitUntil:'networkidle2'}); if(!r || r.status()>=400) throw new Error(`${spec.name}: landing HTTP`);
              const landingOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth);
              if(landingOverflow||errors.length||consoleErrors.length) throw new Error(`${spec.name}: landing runtime failure`);
              r=await page.goto(`${base}/ehime_kumamoto_support_geocoded_shelters_20260802.html`,{waitUntil:'networkidle2',timeout:60000}); if(!r || r.status()>=400) throw new Error(`${spec.name}: dashboard HTTP`);
              const views=['overview','needs','timeline','dashboard','volunteer','map'];
              for(const view of views){
                const tab=await page.$(`[data-view="${view}"]`); if(!tab) throw new Error(`${spec.name}: missing view ${view}`);
                await tab.click(); await new Promise(x=>setTimeout(x,180));
              }
              await page.click('[data-view="overview"]');
              const state=await page.evaluate(()=>{
                const update=document.querySelector('.overview-update,.dashboard-update');
                const record=document.querySelector('.record');
                const source=document.querySelector('.source-link');
                const control=document.querySelector('.control');
                return {
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                  verification:update?getComputedStyle(update,'::before').content:'',
                  recordRadius:record?getComputedStyle(record).borderRadius:null,
                  sourceLabel:source?getComputedStyle(source,'::before').content:'',
                  sourceDecoration:source?getComputedStyle(source).textDecorationLine:'',
                  controlRadius:control?getComputedStyle(control).borderRadius:null,
                  sourceCount:document.querySelectorAll('a.source-link,.source-url a,.popup-link').length
                };
              });
              if(state.overflow||!state.verification.includes('VERIFICATION')||state.recordRadius!=='0px'||!state.sourceLabel.includes('SOURCE')||!state.sourceDecoration.includes('underline')||state.controlRadius!=='6px'||state.sourceCount<1) throw new Error(`${spec.name}: dashboard detail visual gate ${JSON.stringify(state)}`);
              await page.click('[data-view="timeline"]'); await new Promise(x=>setTimeout(x,150));
              const timeline=await page.evaluate(()=>{const e=document.querySelector('.timeline-event');return e?{radius:getComputedStyle(e).borderRadius,bg:getComputedStyle(e).backgroundColor}:null});
              if(!timeline||timeline.radius!=='0px') throw new Error(`${spec.name}: timeline polish missing`);
              await page.click('[data-view="volunteer"]'); await page.waitForSelector('.vol-section,.vol-summary',{timeout:30000});
              const volunteer=await page.evaluate(()=>{const s=document.querySelector('.vol-section');const st=document.querySelector('.vol-status,.vol-current,.vol-stale');return {sectionRadius:s?getComputedStyle(s).borderRadius:null,statusRadius:st?getComputedStyle(st).borderRadius:null,statusBg:st?getComputedStyle(st).backgroundColor:null}});
              if(volunteer.sectionRadius!=='0px'||(volunteer.statusRadius!==null&&volunteer.statusRadius!=='0px')) throw new Error(`${spec.name}: volunteer polish missing ${JSON.stringify(volunteer)}`);
              if(errors.length||consoleErrors.length) throw new Error(`${spec.name}: dashboard errors ${JSON.stringify({errors,consoleErrors})}`);
              console.log(JSON.stringify({name:`dashboard-${spec.name}`,...state,timeline,volunteer,errors,consoleErrors}));
              await page.close();

              const sender=await browser.newPage();
              await sender.setViewport({width:spec.width,height:spec.height,isMobile:spec.mobile,deviceScaleFactor:1});
              const se=[],sc=[]; sender.on('pageerror',e=>se.push(String(e))); sender.on('console',m=>{if(m.type()==='error')sc.push(m.text())});
              r=await sender.goto(`${base}/sender-municipalities.html`,{waitUntil:'networkidle2',timeout:60000}); if(!r || r.status()>=400) throw new Error(`${spec.name}: sender HTTP`);
              await sender.waitForFunction(c=>document.querySelectorAll('#ehimeBody tr[data-entity]').length===c,{timeout:30000},expectedEhime);
              await sender.waitForFunction(c=>document.querySelectorAll('#nationalBody tr[data-entity]').length===c,{timeout:30000},expectedSender);
              let senderState=await sender.evaluate(()=>{const st=document.querySelector('.state');const th=document.querySelector('th');return {overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,ehime:document.querySelectorAll('#ehimeBody tr[data-entity]').length,national:document.querySelectorAll('#nationalBody tr[data-entity]').length,statusRadius:st?getComputedStyle(st).borderRadius:null,statusBg:st?getComputedStyle(st).backgroundColor:null,headerBg:th?getComputedStyle(th).backgroundColor:null,sourceLinks:document.querySelectorAll('tbody a').length,scrollHint:getComputedStyle(document.querySelector('.tablebox'),'::before').content}});
              if(senderState.overflow||senderState.ehime!==20||senderState.national!==316||senderState.statusRadius!=='0px'||senderState.sourceLinks<1) throw new Error(`${spec.name}: sender detail gate ${JSON.stringify(senderState)}`);
              await sender.select('#state','CURRENT'); await sender.waitForFunction(()=>document.querySelectorAll('#nationalBody tr[data-entity]').length>0);
              const filtered=await sender.$$eval('#nationalBody tr[data-entity]',rows=>rows.length); if(filtered!==12) throw new Error(`${spec.name}: CURRENT sender ${filtered}`);
              if(se.length||sc.length) throw new Error(`${spec.name}: sender errors`);
              console.log(JSON.stringify({name:`sender-${spec.name}`,...senderState,filtered,se,sc}));
              await sender.close();
            }
          }finally{await browser.close()}
          NODE
      - name: Regression counts
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const s=JSON.parse(readFileSync('current-shelters.json','utf8'));
          const m=JSON.parse(readFileSync('sender-municipality-audit.json','utf8'));
          if(s.meta.current_count!==40||s.shelters.length!==40||s.shelters.some(x=>x.coordinate_status!=='confirmed')) throw new Error('shelter regression');
          if(m.summary.ehime.required_count!==20||m.summary.ehime.adjudicated_count!==20) throw new Error('Ehime regression');
          if(m.summary.nationwide.prefecture_discovery_checked!==47||m.summary.nationwide.adjudicated_basic_municipality_senders!==316||m.summary.nationwide.orphan_source_mentions.length!==0) throw new Error('sender regression');
          console.log(JSON.stringify({shelters:'40/40',ehime:'20/20',prefectures:'47/47',senders:316,orphans:0}));
          NODE
