name: Temporary prewrite operation v2.7b
on:
  push:
    branches:
      - fix/page-snapshot-consistency-20260902
permissions:
  contents: write
jobs:
  update-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/page-snapshot-consistency-20260902
      - name: Record current snapshot consistency gate
        env:
          VERSION_B64: 
          GATE_B64: 
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const p='時点修正更新オペレーション.md';
          let s=readFileSync(p,'utf8');
          const version=Buffer.from(process.env.VERSION_B64,'base64').toString('utf8');
          const gate=Buffer.from(process.env.GATE_B64,'base64').toString('utf8');
          if(!s.includes('> Version 2.7（2026-09-02改訂）')) s=s.replace('> Version 2.6（2026-08-27改訂）',version+'> Version 2.6（2026-08-27改訂）');
          if(!s.includes('### 16.1 同一ページ Current Snapshot Consistency Gate（Version 2.7追加）')) s=s.replace('## 17. Sender Gate自己破壊テスト',gate+'## 17. Sender Gate自己破壊テスト');
          writeFileSync(p,s);
          NODE
          git diff --check
          if git diff --quiet; then echo 'Operation v2.7 already present.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '時点修正更新オペレーション.md'
          git commit -m 'docs: add current snapshot consistency gate'
          git push origin HEAD:fix/page-snapshot-consistency-20260902
