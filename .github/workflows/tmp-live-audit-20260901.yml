name: Temporary live audit 20260901

on:
  push:
    branches:
      - audit/timepoint-20260901-1504
    paths:
      - .github/workflows/tmp-live-audit-20260901.yml

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Fetch official current shelters
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run update:current-shelters
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const data=JSON.parse(readFileSync('current-shelters.json','utf8'));
          console.log(JSON.stringify({meta:data.meta,currentCount:data.shelters.length,confirmed:data.shelters.filter(x=>x.coordinate_status==='confirmed').length,conflicts:data.shelters.filter(x=>x.coordinate_status==='conflict').length,unresolved:data.shelters.filter(x=>x.coordinate_status==='unresolved').length,municipalities:[...new Set(data.shelters.map(x=>x.municipality))].sort()},null,2));
          NODE
          git diff --stat -- current-shelters.json ehime_kumamoto_support_geocoded_shelters_20260802.html public/dashboard.html
