name: Temporary live audit 20260901

on:
  push:
    branches:
      - audit/timepoint-20260901-1504
    paths:
      - .github/workflows/tmp-live-audit-20260901.yml

permissions:
  contents: write

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Apply full timepoint refresh
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --prune
          npm run update:current-shelters
          node scripts/tmp-apply-refresh-20260901.mjs
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            '2026年8月31日 14:16':'2026年9月1日 15:04',
            '2026-08-26T20:05:00+09:00':'2026-09-01T15:12:00+09:00',
          }
          for name in ['scripts/validate-dashboard-current.mjs','scripts/sync-national-support-audit.mjs']:
            p=Path(name); text=p.read_text()
            for old,new in replacements.items(): text=text.replace(old,new)
            p.write_text(text)
          PY
          npm run build
          git diff --check
          npm run test:release-gate
          npm run validate:sender-coverage
          npm run validate:sender-dist
          echo '=== changed files before commit ==='
          git status --short
      - name: Commit refreshed data and code
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: full timepoint refresh at 2026-09-01 15:04 JST'
          git push origin HEAD:audit/timepoint-20260901-1504
