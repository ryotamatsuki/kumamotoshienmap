name: Temporary fix public smoke wording 20260831

on:
  push:
    branches:
      - fix/public-smoke-20260831
    paths:
      - .github/workflows/tmp-fix-public-smoke-20260831.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Correct national support summary wording and ledger
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=1
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              '8/30ははくおう2宿泊支援をCURRENT': '8/31もはくおう2宿泊支援をCURRENT',
              '8月30日実働主体を再監査': '8月31日実働主体を再監査',
          }
          for name in [
              'scripts/sync-national-support-audit.mjs',
              'ehime_kumamoto_support_geocoded_shelters_20260802.html',
              'public/dashboard.html',
          ]:
              p = Path(name)
              text = p.read_text()
              before = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text == before:
                  raise SystemExit(f'expected stale wording not found in {name}')
              p.write_text(text)
          PY
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const source='operations/ledgers/refresh-20260831-1416.json';
          const target='operations/ledgers/refresh-20260831-1500.json';
          const ledger=JSON.parse(readFileSync(source,'utf8'));
          ledger.update_id='refresh-20260831-1500';
          ledger.gate_phase='pre_merge';
          ledger.page_checked_at=null;
          ledger.base_main_sha=execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim();
          ledger.expected_changed_files=[
            'ehime_kumamoto_support_geocoded_shelters_20260802.html',
            'operations/ledgers/refresh-20260831-1500.json',
            'public/dashboard.html',
            'scripts/sync-national-support-audit.mjs'
          ];
          writeFileSync(target,JSON.stringify(ledger,null,2)+'\n');
          NODE
      - name: Build and check reproducibility
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build
          git diff --check
          npm run test:release-gate
          git diff --name-only
      - name: Commit corrected generated output
        shell: bash
        run: |
          set -Eeuo pipefail
          git add scripts/sync-national-support-audit.mjs \
                  ehime_kumamoto_support_geocoded_shelters_20260802.html \
                  public/dashboard.html \
                  operations/ledgers/refresh-20260831-1500.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align 8/31 national support public summary'
          git push origin HEAD:fix/public-smoke-20260831
