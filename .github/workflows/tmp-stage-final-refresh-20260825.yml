name: Temporary stage final v2.5 refresh

on:
  push:
    branches:
      - audit/timepoint-20260825-1408
    paths:
      - .github/workflows/tmp-stage-final-refresh-20260825.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260825-1408
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Reuse audited finalization logic
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/tmp-finalize-refresh-20260825.yml').read_text()
          start=s.index("          node <<'NODE'\n")+len("          node <<'NODE'\n")
          end=s.index("\n          NODE",start)
          lines=s[start:end].splitlines()
          Path('/tmp/finalize.cjs').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n')
          PY
          node /tmp/finalize.cjs
      - name: Build and validate all data gates
        run: |
          set -Eeuo pipefail
          npm run build
      - name: Finalize ledger against current branch diff
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const p='operations/ledgers/refresh-20260825-1408.json';
          const l=JSON.parse(fs.readFileSync(p,'utf8'));
          const committed=cp.execSync('git diff --name-only origin/main...HEAD',{encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          const working=cp.execSync('git diff --name-only',{encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          l.expected_changed_files=[...new Set([...committed,...working,p])].sort();
          fs.writeFileSync(p,JSON.stringify(l,null,2)+'\n');
          NODE
          git add -A
      - name: Release Gate on staged candidate
        run: |
          set -Eeuo pipefail
          npm run test:release-gate
          npm run validate:release -- --base=origin/main --ledger=operations/ledgers/refresh-20260825-1408.json --require-ledger-if-data-change
      - name: Commit final generated candidate
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'data: close v2.5 institution and source-mention audit'
          git push origin HEAD:audit/timepoint-20260825-1408
