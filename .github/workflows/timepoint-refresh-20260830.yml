name: Temporary full timepoint refresh 20260830

on:
  push:
    branches:
      - audit/timepoint-20260830-1420
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/timepoint-20260830-1420
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install npm metadata
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Generate and validate current-shelter candidate
        run: |
          set -Eeuo pipefail
          npm run update:current-shelters -- --dry-run --candidate-output /tmp/current-shelters-candidate.json
          node scripts/validate-current-shelters.mjs --candidate=/tmp/current-shelters-candidate.json
          cp /tmp/current-shelters-candidate.json current-shelters.json
      - name: Apply exhaustive sender and page-wide refresh
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/timepoint-refresh-core-20260830.mjs')
          s=p.read_text()
          bad="  html=html.replace(/熊本県第45報（8月26日8時）（?:（2026年8月24日8時）)?の避難所65か所/u,'熊本県第49報（8月28日8時）の避難所61か所');"
          good="  html=html.split('熊本県第45報（8月26日8時）（2026年8月24日8時）の避難所65か所').join('熊本県第49報（8月28日8時）の避難所61か所');\n  html=html.split('熊本県第45報（8月26日8時）の避難所65か所').join('熊本県第49報（8月28日8時）の避難所61か所');"
          if bad not in s:
              raise SystemExit('target regex line not found')
          p.write_text(s.replace(bad,good))
          PY
          node --check scripts/timepoint-refresh-core-20260830.mjs
          node scripts/timepoint-refresh-sender-20260830.mjs
          node scripts/timepoint-refresh-core-20260830.mjs
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          REF='2026-08-30T14:20:00+09:00'
          p=Path('operations/audits/institution-coverage-20260830-1420.json')
          d=json.loads(p.read_text())
          d['operation_version']='2.5'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')

          shelters=json.loads(Path('current-shelters.json').read_text())
          count=shelters['meta']['current_count']
          note=(shelters['meta'].get('source_last_modified') or shelters['meta']['fetched_at']).replace('T',' ').split('+')[0]
          for name in ['ehime_kumamoto_support_geocoded_shelters_20260802.html','public/dashboard.html']:
              q=Path(name); h=q.read_text()
              pat=r'<button class="overview-kpi" data-overview-impact="shelters"[\s\S]*?</button>'
              repl=f'<button class="overview-kpi" data-overview-impact="shelters" type="button"><div class="overview-kpi-label">避難所</div><div class="overview-kpi-value">{count}<span class="overview-kpi-unit">か所</span></div><div class="overview-kpi-note">公式JSON現在・{note}</div></button>'
              h,n=re.subn(pat,repl,h,count=1)
              if n!=1: raise SystemExit(f'shelter KPI patch failed: {name}')
              h=h.replace('24市町の人的被害表内合計396人。県第45報の人的被害合計は402人','24市町の人的被害表内合計396人。県第49報の人的被害合計は402人')
              h=h.replace('住家被害の市町別旧スナップショット38,498棟と県第45報39,567棟は時点が異なるため単純差分を現況差と扱わない','住家被害の市町別旧スナップショット38,498棟と県第49報43,292棟は時点が異なるため単純差分を現況差と扱わない')
              h=h.replace('8月26日19:26までに確認できた一次情報','8月30日14:20までに確認できた一次情報')
              q.write_text(h)

          # The national generator owns the final current-state overlay; move its tags to report 49 too.
          sn=Path('scripts/sync-national-support-audit.mjs')
          s=sn.read_text().replace('tags:["熊本県第45報","8月26日8時","最新確認"]','tags:["熊本県第49報","8月28日8時","最新確認"]')
          sn.write_text(s)

          # Dashboard validator: retain strict checks but move expected current facts to this release.
          v=Path('scripts/validate-dashboard-current.mjs')
          s=v.read_text()
          replacements={
            '国交省第49報8/25値はHISTORICALスナップショット。8/26は佐伯市給水継続をCURRENT、TEC-FORCE第5陣・はくおう2宿泊は実働未確認のためUNKNOWN':'国交省第50報（8/27）を最新インフラ履歴として確認。8/30ははくおう2宿泊支援をCURRENT、同一定義の実働を直接確認できない項目はUNKNOWN',
            '8月25日閣議の災害融資特別措置を保持し、8月30日実働主体を再監査':'8月27日支援パッケージ・8月28日予備費使用決定を確認し、8月30日実働主体を再監査',
            '2026年8月26日 19:26':'2026年8月30日 14:20'
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          v.write_text(s)

          # Current-state validator: distinguish report-49 snapshot from live shelter JSON and require the new page-wide reference.
          v=Path('scripts/validate-current-state-audit.mjs')
          s=v.read_text()
          replacements={
            '2026-08-26T19:26:53+09:00':REF,
            'assert.ok(need("p-shelter").observed.includes("熊本県第45報"));':'assert.ok(need("p-shelter").observed.includes("熊本県第49報"));',
            'assert.ok(event("t-current-status").tags.includes("熊本県第45報"));':'assert.ok(event("t-current-status").tags.includes("熊本県第49報"));',
            'assert.equal(event("t-current-status").summary, "避難者2,589人、開設避難所64か所、人的被害402人、住家被害39,567棟。");':'assert.equal(event("t-current-status").summary, "避難者2,442人、開設避難所61か所、人的被害402人、住家被害43,292棟。");',
            '["D+29", "行政応援971人", "8月26日19:26までに確認できた一次情報", "8月26日19:26基準で全件再監査"]':'["D+33", "行政応援971人", "8月30日14:20までに確認できた一次情報", "8月30日14:20基準で全件再監査"]'
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          v.write_text(s)

          # Volunteer hard gate keeps its full field/state checks; only its audited reference day advances.
          v=Path('scripts/validate-volunteer-data.mjs')
          s=v.read_text().replace('data.meta.reference_at.startsWith("2026-08-26")','data.meta.reference_at.startsWith("2026-08-30")').replace('ボランティア情報の基準日が2026-08-26ではありません','ボランティア情報の基準日が2026-08-30ではありません')
          v.write_text(s)
          PY
      - name: Build all generated artifacts and run embedded validators
        run: |
          set -Eeuo pipefail
          npm run build
          node --check scripts/sync-municipal-support-audit.mjs
          node --check scripts/sync-national-support-audit.mjs
          node --check scripts/validate-dashboard-current.mjs
          node --check scripts/validate-current-state-audit.mjs
          node --check scripts/validate-volunteer-data.mjs
          node --check scripts/validate-national-support-audit.mjs
          node --check scripts/sender-coverage-lib.mjs
      - name: Remove temporary refresh machinery
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/timepoint-refresh-20260830.yml scripts/timepoint-refresh-core-20260830.mjs scripts/timepoint-refresh-sender-20260830.mjs
      - name: Finalize exact ledger changed-file inventory
        env:
          BASE_SHA: 638192a5af73e5767f9dc48e06b18606e78a8127
        run: |
          set -Eeuo pipefail
          node --input-type=module - <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const base=process.env.BASE_SHA;
          const path='operations/ledgers/refresh-20260830-1420.json';
          const ledger=JSON.parse(readFileSync(path,'utf8'));
          const files=execFileSync('git',['diff','--name-only',base,'--'],{encoding:'utf8'}).trim().split(/\r?\n/u).filter(Boolean).sort();
          ledger.expected_changed_files=files;
          writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          console.log(JSON.stringify({expectedChangedFiles:files.length,files}));
          NODE
      - name: Rebuild and run every release gate
        env:
          BASE_SHA: 638192a5af73e5767f9dc48e06b18606e78a8127
        run: |
          set -Eeuo pipefail
          npm run build
          npm run validate:dashboard
          npm run validate:current-state
          npm run validate:timeline
          npm run validate:volunteer
          npm run validate:shelters
          npm run validate:current-shelters
          npm run validate:municipal-support
          npm run validate:national-support
          npm run validate:institution-coverage
          npm run validate:ehime-sender-coverage
          npm run validate:nationwide-sender-coverage
          npm run validate:sender-source-mentions
          npm run validate:sender-coverage
          npm run validate:sender-dist
          npm run test:release-gate
          git diff --check
          git add -A
          git diff --cached --check
          npm run validate:release -- --staged --ledger=operations/ledgers/refresh-20260830-1420.json
      - name: Commit validated refresh and verify committed release gate
        env:
          BASE_SHA: 638192a5af73e5767f9dc48e06b18606e78a8127
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: full timepoint refresh at 2026-08-30 14:20 JST'
          npm run validate:release -- --base="$BASE_SHA" --ledger=operations/ledgers/refresh-20260830-1420.json
          git push origin HEAD:audit/timepoint-20260830-1420
