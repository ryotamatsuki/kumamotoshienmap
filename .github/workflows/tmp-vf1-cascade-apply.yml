name: Temporary VF1 cascade applicator

on:
  push:
    branches:
      - design/visual-foundation-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/visual-foundation-v1
          fetch-depth: 0
      - name: Apply cascade lock once
        run: |
          set -Eeuo pipefail
          if grep -q 'VF1_CASCADE_LOCK_START' volunteer.css; then
            echo 'Cascade lock already applied.'
            exit 0
          fi
          cat scripts/tmp-vf1-cascade-lock.css >> volunteer.css
          git add volunteer.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'design: lock visual foundation cascade'
          git push origin HEAD:design/visual-foundation-v1
