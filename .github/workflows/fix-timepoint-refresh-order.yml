name: Fix timepoint refresh order

on:
  push:
    branches:
      - audit/timepoint-20260903-1450

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source/public sync order once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/timepoint-source-probe.yml')
          s=p.read_text(encoding='utf-8')
          old='          npm run sync:municipal-support\n'
          new='          cp ehime_kumamoto_support_geocoded_shelters_20260802.html public/dashboard.html\n          npm run sync:municipal-support\n'
          if new not in s:
              if old not in s: raise SystemExit('target not found')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/timepoint-source-probe.yml
          git commit -m 'chore: sync canonical and public before generators'
          git push origin HEAD:audit/timepoint-20260903-1450
