name: Temporary Stage3 detail UI applicator

on:
  push:
    branches:
      - design/detail-ui-polish

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/detail-ui-polish
          fetch-depth: 0
      - name: Apply staged CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css_path=Path('volunteer.css')
          css=css_path.read_text(encoding='utf-8')
          staged=Path('tmp-stage3.css').read_text(encoding='utf-8').strip('\n')
          if '/* STAGE3_DETAIL_UI_POLISH_START */' not in css:
              css_path.write_text(css.rstrip('\n')+'\n\n'+staged+'\n',encoding='utf-8')
          sender_path=Path('sender-municipalities.html')
          sender=sender_path.read_text(encoding='utf-8')
          sender_css=Path('tmp-stage3-sender.css').read_text(encoding='utf-8').strip('\n')
          if '/* STAGE3_SENDER_DETAIL_UI_START */' not in sender:
              sender_path.write_text(sender.replace('</style>',sender_css+'\n</style>',1),encoding='utf-8')
          PY
          git diff --check
      - name: Commit applied UI
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- volunteer.css sender-municipalities.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volunteer.css sender-municipalities.html
          git commit -m "design: polish detail UI and research metadata"
          git push origin HEAD:design/detail-ui-polish
