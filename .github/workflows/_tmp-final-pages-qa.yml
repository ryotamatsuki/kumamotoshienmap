name: Temporary final Pages QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pages-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Verify deployed bytes and national state
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://ryotamatsuki.github.io/kumamotoshienmap"
          target="ehime_kumamoto_support_geocoded_shelters_20260802.html"
          deployed=/tmp/deployed-dashboard.html
          matched=false
          for attempt in $(seq 1 30); do
            if curl -fsSL --connect-timeout 10 --max-time 30 "${base}/${target}" -o "$deployed" && cmp --silent "$target" "$deployed"; then
              matched=true
              break
            fi
            echo "Pages not converged yet: attempt ${attempt}"
            sleep 10
          done
          [[ "$matched" == true ]]
          for asset in volunteer.css volunteer.js volunteer-data.js current-shelters.json; do
            curl -fsSL --connect-timeout 10 --max-time 30 "${base}/${asset}" -o "/tmp/${asset}"
            cmp --silent "$asset" "/tmp/${asset}"
          done
          curl -fsSL --connect-timeout 10 --max-time 30 "${base}/" -o /tmp/root.html
          grep -F './ehime_kumamoto_support_geocoded_shelters_20260802.html' /tmp/root.html
          grep -F 'NATIONAL_SUPPORT_AUDIT_START' "$deployed"
          grep -F '8月24日22:38全件再監査基準・23:58追加再監査（既存12件＋追加1件）' "$deployed"
          grep -F '2隊9名' "$deployed"
          grep -F '616億円の繰上げ交付決定：確認済／現金交付完了：UNKNOWN' "$deployed"
          grep -F '8/18：プッシュ型物資支援24億円・強化／8/24継続：UNKNOWN' "$deployed"
          ! grep -F '8月2日公表値・継続要確認' "$deployed"
      - name: Install browser driver
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false puppeteer-core
          command -v google-chrome
      - name: Verify Desktop and Mobile runtime
        run: |
          node --input-type=module - <<'NODE'
          import puppeteer from 'puppeteer-core';
          const url='https://ryotamatsuki.github.io/kumamotoshienmap/ehime_kumamoto_support_geocoded_shelters_20260802.html';
          const expectedViews=['overview','needs','timeline','dashboard','volunteer','map'];
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            for (const spec of [{name:'desktop',width:1440,height:1000,mobile:false},{name:'mobile',width:390,height:844,mobile:true}]) {
              const page=await browser.newPage();
              await page.setViewport({width:spec.width,height:spec.height,isMobile:spec.mobile,deviceScaleFactor:1});
              const pageErrors=[]; const consoleErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());});
              const response=await page.goto(url,{waitUntil:'networkidle2',timeout:60000});
              if(!response?.ok()) throw new Error(`${spec.name}: HTTP ${response?.status()}`);
              const state=await page.evaluate((views)=>{
                const values=[...document.querySelectorAll('[data-view]')].map(el=>el.getAttribute('data-view'));
                const body=document.body.innerText;
                const badge=document.querySelector('.badge');
                return {
                  presentViews:views.filter(v=>values.includes(v)),
                  badgeVisible:badge ? getComputedStyle(badge).display !== 'none' : false,
                  nationalCurrent:body.includes('緊急消防援助隊：2隊9名（北九州市第6次）'),
                  pushUnknown:body.includes('8/18：プッシュ型物資支援24億円・強化／8/24継続：UNKNOWN'),
                  financeUnknown:body.includes('616億円の繰上げ交付決定：確認済／現金交付完了：UNKNOWN')
                };
              },expectedViews);
              if(state.presentViews.length!==expectedViews.length) throw new Error(`${spec.name}: missing views`);
              if(!state.nationalCurrent||!state.pushUnknown||!state.financeUnknown) throw new Error(`${spec.name}: national state mismatch`);
              if(spec.mobile && state.badgeVisible) throw new Error('mobile badge should be hidden');
              if(!spec.mobile && !state.badgeVisible) throw new Error('desktop badge should be visible');
              if(pageErrors.length) throw new Error(`${spec.name}: page errors ${pageErrors.join(' | ')}`);
              if(consoleErrors.length) throw new Error(`${spec.name}: console errors ${consoleErrors.join(' | ')}`);
              console.log(JSON.stringify({name:spec.name,...state,pageErrors,consoleErrors}));
              await page.close();
            }
          } finally { await browser.close(); }
          NODE
