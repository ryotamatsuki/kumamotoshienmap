name: Temporary Needs control fix
on:
  push:
    branches:
      - design/final-visual-polish
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/final-visual-polish
      - name: Enlarge Needs municipal table hit areas
        run: |
          set -euo pipefail
          if ! grep -q 'FINAL_VISUAL_POLISH_NEEDS_TABLE_BUTTONS_START' volunteer.css; then
            cat >> volunteer.css <<'CSS'
          /* FINAL_VISUAL_POLISH_NEEDS_TABLE_BUTTONS_START */
          body button[data-needs-table-municipal]{display:inline-flex!important;align-items:center!important;min-height:40px!important;padding:6px 4px!important;font-size:11px!important;font-weight:650!important;color:inherit!important}
          @media(max-width:760px){body button[data-needs-table-municipal]{min-height:44px!important}}
          /* FINAL_VISUAL_POLISH_NEEDS_TABLE_BUTTONS_END */
          CSS
            python3 - <<'PY'
          from pathlib import Path
          p=Path('volunteer.css')
          p.write_text(p.read_text().rstrip()+"\n")
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add volunteer.css
            git diff --cached --check
            git commit -m 'design: normalize Needs municipal hit areas'
            git push origin HEAD:design/final-visual-polish
          else
            echo 'Needs municipal control polish already present.'
          fi
